[workspace]
resolver = "3"
members = [
  "crates/aurora-core",
  "crates/aurora-config",
  "crates/aurora-db",
  "crates/aurora-crypto",
  "crates/aurora-secrets",
  "crates/aurora-policy",
  "crates/aurora-registry",
  "crates/aurora-llm",
  "crates/aurora-summary",
  "crates/aurora-protocol",
  "crates/aurora-channels",
  "crates/aurora-client",
  "crates/aurora-connector-sdk",
  "crates/aurora-testkit",
  "crates/aurora-hook-wit",
  "crates/aurora-plugin-sdk",
  "services/aurora-api",
  "services/aurora-gateway",
  "services/aurora-hookhost",
  "services/aurora-runner",
  "services/aurora-supervisor",
  "services/aurora-cli",
  "connectors/fake",
  "tests/e2e-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# internal
aurora-core = { path = "crates/aurora-core" }
aurora-config = { path = "crates/aurora-config" }
aurora-db = { path = "crates/aurora-db" }
aurora-crypto = { path = "crates/aurora-crypto" }
aurora-secrets = { path = "crates/aurora-secrets" }
aurora-policy = { path = "crates/aurora-policy" }
aurora-registry = { path = "crates/aurora-registry" }
aurora-llm = { path = "crates/aurora-llm" }
aurora-summary = { path = "crates/aurora-summary" }
aurora-protocol = { path = "crates/aurora-protocol" }
aurora-channels = { path = "crates/aurora-channels" }
aurora-client = { path = "crates/aurora-client" }
aurora-connector-sdk = { path = "crates/aurora-connector-sdk" }
aurora-testkit = { path = "crates/aurora-testkit" }
aurora-hook-wit = { path = "crates/aurora-hook-wit" }
aurora-plugin-sdk = { path = "crates/aurora-plugin-sdk" }

# runtime / http
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs", "process"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "limit", "timeout", "sensitive-headers"] }
hyper = { version = "1.8", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-native-certs = "0.8"
rcgen = "0.13"
futures = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
lru = "0.18"
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls"] }

# containers (podman API)
bollard = { version = "0.21", default-features = false, features = ["pipe"] }

# data
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
schemars = { version = "1", features = ["uuid1", "chrono04"] }
jsonschema = { version = "0.33", default-features = false }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
uuid = { version = "1.22", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
toml = "0.9"
graphql-parser = "0.4"
mail-parser = "1.0"
regex = "1"
percent-encoding = "2"
async-trait = "0.1"
flate2 = "1"
tar = "0.4"
psl = "2"
pulldown-cmark = { version = "0.13", default-features = false }
sha2 = "0.10"
hmac = "0.12"
arc-swap = "1"

# crypto
aws-lc-rs = "1.18"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
argon2 = "0.5"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "tokio1", "aws-lc-rs", "hostname"] }
zeroize = { version = "1.8", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
rustix = { version = "1", default-features = false, features = ["std", "process"] }

# observability / errors / cli
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }

# wasm components (HOOK-001; wit-bindgen guest side, wasmtime pinned for the hook host, HOOK-002)
wit-bindgen = { version = "0.46", default-features = false, features = ["macros", "realloc"] }
wasmparser = "0.239"
wasmtime = { version = "50", default-features = false }
wasmtime-wasi = { version = "50", default-features = false }

# tests
proptest = "1"
insta = { version = "1", features = ["json", "yaml"] }
wiremock = "0.6"

[profile.dev]
# Disk is constrained on the dev host (docs/90-decisions.md I-03).
debug = "line-tables-only"
# Incremental caches grew to 44 GB; off to bound disk use (I-24).
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
