[workspace]
resolver = "3"
members = [
  "crates/aurora-core",
  "crates/aurora-config",
  "crates/aurora-db",
  "crates/aurora-counters",
  "crates/aurora-crypto",
  "crates/aurora-secrets",
  "crates/aurora-policy",
  "crates/aurora-sqlclass",
  "crates/aurora-registry",
  "crates/aurora-llm",
  "crates/aurora-summary",
  "crates/aurora-protocol",
  "crates/aurora-channels",
  "crates/aurora-client",
  "crates/aurora-connector-sdk",
  "crates/aurora-testkit",
  "crates/aurora-hook-wit",
  "crates/aurora-plugin-sdk",
  "services/aurora-api",
  "services/aurora-gateway",
  "services/aurora-hookhost",
  "services/aurora-relay",
  "services/aurora-terminator",
  "services/aurora-runner",
  "services/aurora-supervisor",
  "services/aurora-cli",
  "services/aurora-connector-host",
  "connectors/fake",
  "connectors/builtin",
  "connectors/mattermost",
  "tests/e2e-gateway",
  "tests/e2e-hosted",
  "tests/conformance/connector",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# internal
aurora-core = { path = "crates/aurora-core" }
aurora-config = { path = "crates/aurora-config" }
aurora-db = { path = "crates/aurora-db" }
aurora-counters = { path = "crates/aurora-counters" }
aurora-crypto = { path = "crates/aurora-crypto" }
aurora-secrets = { path = "crates/aurora-secrets" }
aurora-policy = { path = "crates/aurora-policy" }
aurora-sqlclass = { path = "crates/aurora-sqlclass" }
aurora-registry = { path = "crates/aurora-registry" }
aurora-llm = { path = "crates/aurora-llm" }
aurora-summary = { path = "crates/aurora-summary" }
aurora-protocol = { path = "crates/aurora-protocol" }
aurora-channels = { path = "crates/aurora-channels" }
aurora-client = { path = "crates/aurora-client" }
aurora-connector-sdk = { path = "crates/aurora-connector-sdk" }
aurora-testkit = { path = "crates/aurora-testkit" }
aurora-hook-wit = { path = "crates/aurora-hook-wit" }
aurora-plugin-sdk = { path = "crates/aurora-plugin-sdk" }
aurora-hookhost = { path = "services/aurora-hookhost" }

# runtime / http
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs", "process"] }
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "limit", "timeout", "sensitive-headers"] }
hyper = { version = "1.8", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
# reqwest 0.13: `rustls` = aws-lc-rs + rustls-platform-verifier (the OS trust store, which every image
# carries: distroless cc, AlmaLinux); `query`/`form` are opt-in since 0.13.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query", "form"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-native-certs = "0.8"
rcgen = "0.14"
x509-parser = "0.18"
futures = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
# (P5-FILES-1, D-316) the SFTP v3 client of the Files page (Apache-2.0; the raw session over any
# AsyncRead + AsyncWrite, `extended()` for `posix-rename@openssh.com`; no SSH stack).
russh-sftp = { version = "3.0.1", default-features = false }
# (P4-SSH-2, D-239) the terminator's SSH server (Apache-2.0). Default features off: no RSA, no
# compression; `aws-lc-rs` is the crypto backend already in the tree. `russh-sftp` is a dev-dependency
# of russh only (the terminator never speaks SFTP), so the tree has one `ssh-key` and one `russh-sftp`.
russh = { version = "0.65.2", default-features = false, features = ["aws-lc-rs"] }
lru = "0.19"
# No `reqwest` feature: openidconnect 4 is built for reqwest 0.12; aurora-api's OidcHttp adapts the
# workspace reqwest instead (domains/oidc/client.rs).
openidconnect = { version = "4.1", default-features = false }

# containers (podman API)
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
# Kubernetes (RUN-004): rustls only (no openssl). kube 5 is built for k8s-openapi 0.29 (they move together); k8s-openapi `earliest` = oldest API the chart supports.
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.29", default-features = false, features = ["earliest"] }

# data
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
schemars = { version = "1", features = ["uuid1", "chrono04"] }
jsonschema = { version = "0.33", default-features = false }
utoipa = { version = "6", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.3"
uuid = { version = "1.22", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
croner = "4"
toml = "1.2"
graphql-parser = "0.4"
mail-parser = "1.0"
regex = "1"
percent-encoding = "2"
async-trait = "0.1"
flate2 = "1"
tar = "0.4"
psl = "2"
pulldown-cmark = { version = "0.13", default-features = false }
# WHATWG URL parsing for the deceptive-label check of markdown_safe (FIX-142 review): the host a browser would use.
url = "2"
sha2 = "0.11"
# avatar re-encode (I-31): png/jpeg/webp decoders + png encoder only
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
hmac = "0.13"
arc-swap = "1"

# crypto
aws-lc-rs = "1.18"
# (phase 5, P4-011B-3, D-134) Web Push: the VAPID ES256 key and the RFC 8291 ECDH (RustCrypto,
# Apache-2.0/MIT, already in the lockfile); HKDF and AES-GCM come from aws-lc-rs.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "pem", "std"] }
ed25519-dalek = { version = "3.0", features = ["rand_core", "zeroize"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "tokio1", "aws-lc-rs", "hostname"] }
zeroize = { version = "1.8", features = ["derive"] }
# (phase 5, P4-SSH-1, D-239) OpenSSH public keys, `SHA256:` fingerprints and user certificates
# (RustCrypto, Apache-2.0/MIT). The 0.7 line shares this workspace's ed25519-dalek 3 / sha2 0.11.
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["ed25519", "std", "alloc", "rand_core"] }
base64 = "0.23"
crc32fast = "1"
hex = "0.4"
rustix = { version = "1", default-features = false, features = ["std", "process", "pty", "termios", "fs"] }

# observability / errors / cli
tracing = "0.1"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
# http-proto over rustls (no openssl, no tonic); blocking reqwest is what the batch span
# processor thread uses.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client", "reqwest-rustls"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }

# wasm components (HOOK-001; wit-bindgen guest side, wasmtime pinned for the hook host, HOOK-002)
# wasmparser = the version wasmtime 50 parses with (the registry validates what the host will load);
# wit-bindgen 0.62 = the newest whose wasm-tools line (0.259) is not ahead of it. Move all three together.
wit-bindgen = { version = "0.62", default-features = false, features = ["macros", "realloc"] }
wasmparser = "0.261"
wasmtime = { version = "50", default-features = false }
wasmtime-wasi = { version = "50", default-features = false }

# tests
proptest = "1"
insta = { version = "1", features = ["json", "yaml"] }
wiremock = "0.6"

[profile.dev]
# Disk is constrained on the dev host (docs/90-decisions.md I-03).
debug = "line-tables-only"
# Incremental for every local dev/test loop (I-45, refines I-24/I-36). Applies to workspace members
# only; registry deps stay non-incremental and sccache-cached. CI forces CARGO_INCREMENTAL=0 in the
# workflow env (throw-away targets; sccache cannot cache incremental crates). Disk is bounded by one
# test binary per crate (I-34), per-lane target dirs (I-35) and `just clean-stale`.
incremental = true

[profile.dev.package."*"]
debug = false

# Alias kept so `just dev`, `just build-fast` and AURORA_DEV_PROFILE keep working (I-36); since I-45
# it is identical to `dev` apart from its target subdirectory.
[profile.dev-fast]
inherits = "dev"
incremental = true

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
