# cargo-deny configuration (docs/18-testing.md §CI pipeline stage 1).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa (via openidconnect): Marvin timing attack affects private-key decryption/signing;
  # Aurora only verifies ID-token signatures with provider public keys.
  { id = "RUSTSEC-2023-0071", reason = "public-key verification only (OIDC); no private RSA operations" },
  # unsafe-libyaml (via serde_yaml, pinned by docs/02 for manifests) is unmaintained.
  { id = "RUSTSEC-2024-0449", reason = "serde_yaml pinned by spec 02; parses size-limited signed manifests; track migration" },
  # chrono and chrono-tz were declared unmaintained (2026-11, no vulnerability, "no safe upgrade
  # available"). chrono is the workspace's date-time type (sqlx, serde, every timestamp); moving
  # to another crate (e.g. jiff) is a planned task, not a version bump.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice, no vulnerability; workspace-wide date-time type; replacement is a planned task" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained notice, no vulnerability; follows chrono's replacement" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0",
  "0BSD", "BSL-1.0", "CC0-1.0",
]
confidence-threshold = 0.9
# Workspace crates are publish = false and carry the project license (GPL-3.0-or-later).
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
