# cargo-deny configuration (docs/18-testing.md §CI pipeline stage 1).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0",
  "0BSD", "BSL-1.0", "CC0-1.0",
]
confidence-threshold = 0.9
# Workspace crates are publish = false and carry the project license (GPL-3.0-or-later).
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
