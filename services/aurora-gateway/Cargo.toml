[package]
name = "aurora-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "aurora_gateway"
path = "src/lib.rs"

[[bin]]
name = "aurora-gateway"
path = "src/main.rs"

[dependencies]
aurora-core = { workspace = true, features = ["service"] }
aurora-config = { workspace = true }
aurora-db = { workspace = true }
aurora-counters = { workspace = true, features = ["redis"] }
aurora-crypto = { workspace = true }
aurora-policy = { workspace = true }
aurora-sqlclass = { workspace = true }
aurora-secrets = { workspace = true }
aurora-llm = { workspace = true }
aurora-summary = { workspace = true }
aurora-registry = { workspace = true }
aurora-webhook = { workspace = true }
arc-swap = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
md-5 = "0.11"
metrics = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
zeroize = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
h2 = "0.4"
lru = { workspace = true }
percent-encoding = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"] }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = "0.3"
tower = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

[features]
# (FIX-290) The destination guard's test-only seams (fixed name answers, injected interface
# addresses). Never on in a build of the binary: only the dev-dependency below turns it on.
test-hooks = []

[dev-dependencies]
aurora-gateway = { path = ".", features = ["test-hooks"] }
aurora-config = { workspace = true, features = ["test-registry"] }
aurora-secrets = { workspace = true, features = ["memory-store"] }
aurora-testkit = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
# FIX-146: tests/it/proxy.rs (the gateway span is a child of the turn's context; no canary in a span)
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "gateway_perf"
path = "benches/gateway_perf.rs"
harness = false
