[package]
name = "aurora-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "aurora_gateway"
path = "src/lib.rs"

[[bin]]
name = "aurora-gateway"
path = "src/main.rs"

[dependencies]
aurora-core = { workspace = true, features = ["service"] }
aurora-config = { workspace = true }
aurora-db = { workspace = true }
aurora-crypto = { workspace = true }
aurora-policy = { workspace = true }
aurora-secrets = { workspace = true }
aurora-llm = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
zeroize = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
lru = { workspace = true }
percent-encoding = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"] }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = "0.3"
tower = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
aurora-secrets = { workspace = true, features = ["memory-store"] }
aurora-testkit = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
