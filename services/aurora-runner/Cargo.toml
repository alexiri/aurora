[package]
name = "aurora-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aurora-runner"
path = "src/main.rs"

[dependencies]
aurora-core = { workspace = true, features = ["service"] }
aurora-config = { workspace = true }
aurora-protocol = { workspace = true }
async-trait = { workspace = true }
bollard = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hmac = { workspace = true }
tokio-tungstenite = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
# (FIX-101) the skip policy of the env-gated podman tests (`require_or_skip`).
aurora-testkit = { workspace = true }
tower = { workspace = true }
wiremock = { workspace = true }
# (P5-REFINE-4) `start_paused` / `advance` for the keep-awake heartbeat tests.
tokio = { workspace = true, features = ["test-util"] }
# FIX-146: executor tracing test (the work span is a child of the item's trace context)
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
