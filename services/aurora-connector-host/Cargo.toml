[package]
name = "aurora-connector-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Aurora connector host: runs the built-in connector types for managed connectors (docs/13 §3.1)."

[lints]
workspace = true

[lib]
name = "aurora_connector_host"
path = "src/lib.rs"

[[bin]]
name = "aurora-connector-host"
path = "src/main.rs"

[dependencies]
aurora-core = { workspace = true, features = ["service"] }
aurora-config = { workspace = true }
aurora-connector-sdk = { workspace = true }
aurora-connectors-builtin = { path = "../../connectors/builtin" }
aurora-protocol = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
http = { workspace = true }
metrics = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
aurora-connector-fake = { path = "../../connectors/fake" }
aurora-registry = { workspace = true }
ed25519-dalek = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
