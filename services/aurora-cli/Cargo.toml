[package]
name = "aurora-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
aurora-client = { workspace = true }
aurora-crypto = { workspace = true }
# the embedded hook-host runtime of `aurora plugin test` (docs/09 §12)
aurora-hookhost = { workspace = true }
aurora-policy = { workspace = true }
aurora-registry = { workspace = true }
ed25519-dalek = { workspace = true }
pulldown-cmark = { workspace = true, features = ["html"] }
serde = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
wiremock = { workspace = true }
