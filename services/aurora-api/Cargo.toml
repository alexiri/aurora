[package]
name = "aurora-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "aurora_api"
path = "src/lib.rs"

[[bin]]
name = "aurora-api"
path = "src/main.rs"

[dependencies]
aurora-core = { workspace = true, features = ["service"] }
aurora-config = { workspace = true }
aurora-template = { workspace = true }
arc-swap = { workspace = true }
axum = { workspace = true }
http-body-util = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
aurora-db = { workspace = true }
aurora-counters = { workspace = true, features = ["redis"] }
aurora-channels = { workspace = true }
aurora-protocol = { workspace = true }
sqlx = { workspace = true }
base64 = { workspace = true }
crc32fast = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
croner = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
russh-sftp = { workspace = true }
lettre = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
aws-lc-rs = { workspace = true }
p256 = { workspace = true }
url = { workspace = true }
ssh-key = { workspace = true }
aurora-secrets = { workspace = true }
aurora-llm = { workspace = true }
aurora-policy = { workspace = true }
aurora-crypto = { workspace = true }
aurora-registry = { workspace = true }
aurora-webhook = { workspace = true, features = ["utoipa"] }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# (P5-SKLIB-1, C-1125) zlib streams of git packs, parsed in memory.
flate2 = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
hyper-util = { workspace = true }
openidconnect = { workspace = true }
percent-encoding = { workspace = true }
image = { workspace = true }
metrics = { workspace = true }
# FIX-146 Part D: browser spans are rebuilt as SDK SpanData and handed to the exporter
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
aurora-config = { workspace = true, features = ["test-registry"] }
aurora-secrets = { workspace = true, features = ["memory-store"] }
wiremock = { workspace = true }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
aurora-testkit = { workspace = true }
percent-encoding = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true }
# FIX-146 A2: db_spans.rs (database spans never carry bind values)
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry = { workspace = true }
aurora-supervisor = { path = "../aurora-supervisor" }
