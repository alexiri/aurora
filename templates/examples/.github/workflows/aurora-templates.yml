# The reference CI for a template repository. Two jobs:
#
#   check   — every pull request and every push: `aurora template check .`
#   publish — push to the default branch only, after check: pack each template
#             and create the release <id>-v<version>. A published version is
#             never replaced: if the release exists and the freshly packed
#             bytes differ, the job fails and tells you to raise the version.
#
# This file sits inside templates/examples/ in the Aurora repository, so it
# never runs here. Copy it to your own repository as
# .github/workflows/aurora-templates.yml.

name: aurora-templates

on:
  pull_request:
  push:

# `check` needs only read; `publish` narrows to contents: write below.
permissions:
  contents: read

env:
  # The sha256 of the aurora-linux-x86_64 binary of the version you pin below:
  # the CLI release publishes it beside the binary as
  # aurora-linux-x86_64.sha256. Copy its first field here, and change it only
  # together with the version. The jobs run no other binary.
  AURORA_CLI_SHA256: "AURORA_CLI_SHA256"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      # Install the aurora CLI at a pinned version. Either download the release
      # binary and check it (below) or build it:
      #   cargo install --locked aurora-cli --version AURORA_CLI_VERSION
      - name: Install the aurora CLI
        run: |
          download="$(mktemp -d)/aurora"
          curl -fsSL \
            "https://github.com/alexiri/aurora/releases/download/cli-vAURORA_CLI_VERSION/aurora-linux-x86_64" \
            -o "$download"
          printf '%s  %s\n' "$AURORA_CLI_SHA256" "$download" | sha256sum -c -
          install -m 755 "$download" /usr/local/bin/aurora
          aurora --version
      - name: Check the templates
        run: aurora template check .

  publish:
    # Only push to the default branch publishes. Adjust the ref if yours is
    # not `main`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two merges in quick succession must publish one after the other, never
    # in parallel, and must not cancel each other.
    concurrency:
      group: aurora-templates-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - name: Install the aurora CLI
        run: |
          download="$(mktemp -d)/aurora"
          curl -fsSL \
            "https://github.com/alexiri/aurora/releases/download/cli-vAURORA_CLI_VERSION/aurora-linux-x86_64" \
            -o "$download"
          printf '%s  %s\n' "$AURORA_CLI_SHA256" "$download" | sha256sum -c -
          install -m 755 "$download" /usr/local/bin/aurora
          aurora --version
      - name: Pack and publish every template
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: .github/aurora-publish.sh .
