# The LDAP lane (docs/06 §LDAP lane): a request to `<app id>.ldap.aurora.internal` is classified
# like any HTTP request; the gateway then runs the search. Only `POST /search` is a tool.
- name: a person search is the read tool
  request:
    method: POST
    url: "https://cern-phonebook.ldap.aurora.internal/search"
    body: '{"filter":"(|(displayName=Jane Do*)(mail=jane.do*))","attributes":["mail","physicalDeliveryOfficeName"]}'
  expect: { app: cern-phonebook, tool: search }
- name: an exact lookup is the same tool
  request:
    method: POST
    url: "https://cern-phonebook.ldap.aurora.internal/search"
    body: '{"filter":"(uid=jdoe)"}'
  expect: { app: cern-phonebook, tool: search }
- name: a GET is not a tool
  request: { method: GET, url: "https://cern-phonebook.ldap.aurora.internal/search" }
  expect: { app: cern-phonebook }
- name: no other operation exists on the host
  request:
    method: POST
    url: "https://cern-phonebook.ldap.aurora.internal/modify"
    body: '{"dn":"uid=jdoe,DC=cern,DC=ch","replace":{"mail":"x@example.org"}}'
  expect: { app: cern-phonebook }
