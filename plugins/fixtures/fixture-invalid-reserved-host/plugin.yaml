package:
  id: fixture-invalid-reserved-host
  version: 1.0.0
  contract: 1
  min_core: 0.1.0
  publisher: fixtures
  name: Invalid fixture
  description: "Expected rejection: reserved_host"
apps:
  - about: { id: invalid-app, name: Invalid app, web_hosts: [app.invalid.example.test] }
    credentials: [ { name: api_token, secret: true } ]
    metadata: [ { name: org } ]
    connect:
      - id: api_key
        kind: fields
        fields: [ { name: api_token, label: API token, type: secret, required: true } ]
    hosts:
      - match: { host: llm.aurora.internal }
        inject:
          - bearer: "{credentials.api_token}"
    tools:
      read:
        items:
          - { id: list_things, name: List things, host: llm.aurora.internal, path: /v1/things, methods: [GET] }
