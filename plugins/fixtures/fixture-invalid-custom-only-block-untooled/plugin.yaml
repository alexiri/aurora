package:
  id: fixture-invalid-custom-only-block-untooled
  version: 1.0.0
  contract: 1
  min_core: 0.1.0
  publisher: fixtures
  name: Invalid fixture
  description: "Expected rejection: custom_only_needs_block_untooled"
apps:
  - about: { id: invalid-app, name: Invalid app, web_hosts: [app.invalid.example.test] }
    credentials: [ { name: api_token, secret: true } ]
    metadata: [ { name: org } ]
    connect:
      - id: api_key
        kind: fields
        fields: [ { name: api_token, label: API token, type: secret, required: true } ]
    hosts:
      - match: { host: api.invalid.example.test }
        inject:
          - bearer: "{credentials.api_token}"
    # `custom_only` without `block_untooled`: a request outside the tools would not be blocked.
    grants: { custom_only: true }
    tools:
      read:
        items:
          - { id: list_things, name: List things, host: api.invalid.example.test, path: /v1/things, methods: [GET] }
