package:
  id: fixture-app-skills
  version: 1.0.0
  contract: 1
  min_core: 0.1.0
  publisher: fixtures
  name: Fixture App Skills
  description: P5-APPSKILL-1 fixture, an app that ships skills (two skills, one with an executable script and a nested reference file)
apps:
  - about:
      id: skills-demo
      name: Skills demo
      description: Rooms service with agent skills
      category: testing
      api_docs: https://docs.guide.example.test/api
      web_hosts: [app.guide.example.test]
    credentials:
      - { name: api_token, secret: true }
    connect:
      - id: api_key
        kind: fields
        fields:
          - { name: api_token, label: API token, type: secret, store: credentials, required: true }
    hosts:
      - match: { host: api.guide.example.test }
        inject:
          - bearer: "{credentials.api_token}"
    token:
      kind: static
    tools:
      read:
        items:
          - { id: list_rooms, name: List rooms, description: Rooms of a building, host: api.guide.example.test, path: /v1/rooms, methods: [GET] }
          - { id: get_room, name: Get a room, description: One room with its bookings, host: api.guide.example.test, path: "/v1/rooms/*", methods: [GET] }
      write:
        items:
          - { id: book_room, name: Book a room, description: Reserve a room for a time slot, host: api.guide.example.test, path: "/v1/rooms/*/bookings", methods: [POST] }
    approvals:
      book_room:
        title: Book a room
        fields:
          - { label: Room, source: path, segment: 3 }
    agent:
      summary: "Room search and booking."
      operations: operations.json
      instructions: |
        Rooms are addressed by numeric id. Send JSON bodies.
