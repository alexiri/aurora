- name: token.mint (github-app) never uses ghes_host
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app
    http_cassette:
      - request: { method: POST, url: "https://api.github.com/app/installations/7/access_tokens" }
        response: { status: 201, body: '{"token":"tok-fixture-inst-3","expires_at":"2099-01-01T00:00:00Z"}' }
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7", ghes_host: "evil.example.com" }
    expect: { credentials: { access_token: "tok-fixture-inst-3" } }
- name: token.mint (github-app) maps 401 to reauth-required
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app
    http_cassette:
      - request: { method: POST, url: "https://api.github.com/app/installations/7/access_tokens" }
        response: { status: 401, body: '{"message":"A JSON web token could not be decoded"}' }
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7" }
    expect: { error: reauth-required, message_contains: "rejected the app credentials" }
- name: token.mint (github-app) maps 404 (uninstalled) to reauth-required
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app
    http_cassette:
      - request: { method: POST, url: "https://api.github.com/app/installations/7/access_tokens" }
        response: { status: 404, body: '{"message":"Not Found"}' }
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7" }
    expect: { error: reauth-required, message_contains: "installation not found" }
- name: token.mint (github-app) maps 403 (suspended) to upstream
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app
    http_cassette:
      - request: { method: POST, url: "https://api.github.com/app/installations/7/access_tokens" }
        response: { status: 403, body: '{"message":"This installation has been suspended"}' }
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7" }
    expect: { error: upstream, message_contains: "suspended" }
- name: token.mint (github-app) rejects an answer without a token
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app
    http_cassette:
      - request: { method: POST, url: "https://api.github.com/app/installations/7/access_tokens" }
        response: { status: 201, body: '{"expires_at":"2099-01-01T00:00:00Z"}' }
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7" }
    expect: { error: upstream, message_contains: "without a token" }
- name: token.mint (github-app) without a private key asks to reconnect
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app
    input:
      credentials: {}
      metadata: { app_id: "123456", installation_id: "7" }
    expect: { error: reauth-required, message_contains: "private key is missing" }
- name: token.mint (github-app) with an unusable stored key asks to reconnect and does not echo it
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app
    input:
      credentials: { private_key: "not-a-pem-fixture" }
      metadata: { app_id: "123456", installation_id: "7" }
    expect: { error: reauth-required, message_contains: "stored private key is unusable" }
- name: token.mint (github-app) without an installation id asks to reconnect
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456" }
    expect: { error: reauth-required, message_contains: "installation id" }
- name: token.mint (github-app) outside its egress list is denied
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app
    egress_override: [other.example.test]
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7" }
    expect: { error: egress-denied, message_contains: "egress denied" }
- name: token.mint (github-app-ghes) mints on the registered instance host
  request: { method: GET, url: "https://github.example.com/api/v3/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app-ghes
    egress_override: [github.example.com]
    http_cassette:
      - request: { method: POST, url: "https://github.example.com/api/v3/app/installations/7/access_tokens" }
        response: { status: 201, body: '{"token":"tok-fixture-inst-4","expires_at":"2099-01-01T00:00:00Z"}' }
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7", ghes_host: "GitHub.Example.com" }
    expect: { credentials: { access_token: "tok-fixture-inst-4" } }
- name: token.mint (github-app-ghes) with a ghes_host other than the registered instance is denied
  request: { method: GET, url: "https://github.example.com/api/v3/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app-ghes
    egress_override: [github.example.com]
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7", ghes_host: "evil.example.com" }
    expect: { error: egress-denied, message_contains: "does not match the registered instance" }
- name: token.mint (github-app-ghes) can never reach api.github.com
  request: { method: GET, url: "https://github.example.com/api/v3/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app-ghes
    egress_override: [api.github.com]
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7", ghes_host: "github.example.com" }
    expect: { error: egress-denied, message_contains: "does not match the registered instance" }
- name: token.mint (github-app-ghes) without ghes_host asks to reconnect
  request: { method: GET, url: "https://github.example.com/api/v3/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app-ghes
    egress_override: [github.example.com]
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7" }
    expect: { error: reauth-required, message_contains: "ghes_host" }
- name: token.mint (github-app-ghes) refuses a ghes_host with a scheme, path or credentials
  request: { method: GET, url: "https://github.example.com/api/v3/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app-ghes
    egress_override: [github.example.com]
    steps:
      - input:
          credentials: { private_key: *key }
          metadata: { app_id: "123456", installation_id: "7", ghes_host: "https://github.example.com" }
        expect: { error: reauth-required, message_contains: "ghes_host" }
      - input:
          credentials: { private_key: *key }
          metadata: { app_id: "123456", installation_id: "7", ghes_host: "github.example.com/api/v3" }
        expect: { error: reauth-required, message_contains: "ghes_host" }
      - input:
          credentials: { private_key: *key }
          metadata: { app_id: "123456", installation_id: "7", ghes_host: "admin@github.example.com" }
        expect: { error: reauth-required, message_contains: "ghes_host" }
- name: token.mint (github-app-ghes) outside its egress list is denied
  request: { method: GET, url: "https://github.example.com/api/v3/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app-ghes
    egress_override: [other.example.test]
    input:
      credentials: { private_key: *key }
      metadata: { app_id: "123456", installation_id: "7", ghes_host: "github.example.com" }
    expect: { error: egress-denied, message_contains: "egress denied" }
- name: connect.exchange (github-app) validates the form by minting once
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: connect.exchange
    app_id: github-app
    http_cassette:
      - request: { method: POST, url: "https://api.github.com/app/installations/7/access_tokens" }
        response: { status: 201, body: '{"token":"tok-fixture-inst-5","expires_at":"2099-01-01T00:00:00Z"}' }
    input:
      method_id: installation
      source:
        form: { app_id: "123456", installation_id: "7", private_key: *key }
    expect:
      connected:
        credentials: { access_token: "tok-fixture-inst-5" }
        metadata: { app_id: "123456", installation_id: "7" }
        label: "GitHub App 123456 (installation 7)"
- name: connect.exchange (github-app) reports a rejected key without echoing it
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: connect.exchange
    app_id: github-app
    http_cassette:
      - request: { method: POST, url: "https://api.github.com/app/installations/7/access_tokens" }
        response: { status: 401, body: '{"message":"A JSON web token could not be decoded"}' }
    input:
      method_id: installation
      source:
        form: { app_id: "123456", installation_id: "7", private_key: *key }
    expect: { error: invalid-input, message_contains: "check the app id and the private key" }
- name: connect.exchange (github-app) refuses a key that is not an RSA PEM
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: connect.exchange
    app_id: github-app
    input:
      method_id: installation
      source:
        form: { app_id: "123456", installation_id: "7", private_key: "not-a-pem-fixture" }
    expect: { error: invalid-input, message_contains: "not a valid RSA private key" }
- name: connect.exchange (github-app) requires the key and the ids
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: connect.exchange
    app_id: github-app
    steps:
      - input: { method_id: installation, source: { form: { app_id: "123456", installation_id: "7" } } }
        expect: { error: invalid-input, message_contains: "private key is required" }
      - input: { method_id: installation, source: { form: { app_id: "123456", installation_id: "abc", private_key: *key } } }
        expect: { error: invalid-input, message_contains: "installation id" }
      - input: { method_id: installation, source: { form: { installation_id: "7", private_key: *key } } }
        expect: { error: invalid-input, message_contains: "App id" }
