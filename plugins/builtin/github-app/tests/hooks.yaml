# Hook cases run `hooks.wasm` in the embedded hook host with `fetch` answered from recorded HTTP
# (docs/09 §12). The cassette matches the method and URL, so the minted path
# (/app/installations/7/access_tokens) is asserted by every positive case. The `Authorization:
# Bearer <jwt>` header and the JWT claims are asserted by the guest's unit tests (hooks/, cargo test).
#
# aurora-fixture-key: throw-away, generated for fixtures, never valid upstream
# The private key below is a THROW-AWAY 2048-bit RSA key generated only for these fixtures; it
# protects nothing and belongs to no GitHub App. This file is listed in
# scripts/guards/fixture-keys.allow (exempt from the PRIVATE KEY pattern only). The second key
# (&key8) is the same key in PKCS#8 form. Tokens in responses are fake.
#
# `egress_override` stands for the egress list as the hook host resolves it: `{instance}` becomes the
# connection's registered instance host (here github.example.com).
- name: token.mint (github-app) mints an installation token for the installation
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  hook:
    point: token.mint
    app_id: github-app
    http_cassette:
      - request: { method: POST, url: "https://api.github.com/app/installations/7/access_tokens" }
        response:
          status: 201
          headers: { content-type: application/json }
          body: '{"token":"tok-fixture-inst-1","expires_at":"2099-01-01T00:00:00Z","permissions":{"contents":"read"},"repository_selection":"selected"}'
