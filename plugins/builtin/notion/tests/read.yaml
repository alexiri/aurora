# Notion read tools: each has a positive case and a `negative <tool>:` case. The bearer token and the
# pinned Notion-Version header (2026-03-11) are injected on api.notion.com only. All credentials are fake.
- name: "get_bot_user: bearer and Notion-Version are injected on the API host"
  connection: { credentials: { access_token: "tok-fixture-1" }, metadata: { workspace_id: "ws-fixture-1" } }
  request: { method: GET, url: "https://api.notion.com/v1/users/me" }
  expect:
    app: notion
    tool: get_bot_user
    upstream:
      url: "https://api.notion.com/v1/users/me"
      headers: { authorization: "Bearer tok-fixture-1", notion-version: "2026-03-11" }
- name: "negative get_bot_user: DELETE selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://api.notion.com/v1/users/me" }
  expect: { app: notion }
- name: "agent supplied authorization and Notion-Version are overwritten"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: GET
    url: "https://api.notion.com/v1/users/me"
    headers: { authorization: "Bearer agent-guess", notion-version: "2022-06-28" }
  expect:
    tool: get_bot_user
    upstream: { headers: { authorization: "Bearer tok-fixture-1", notion-version: "2026-03-11" } }
- name: "list_users"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.notion.com/v1/users?page_size=50" }
  expect: { app: notion, tool: list_users, upstream: { headers: { notion-version: "2026-03-11" } } }
- name: "negative list_users: DELETE selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://api.notion.com/v1/users" }
  expect: { app: notion }
