- name: "negative: the token is not injected outside /v1 on the API host"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.notion.com/other/users/me" }
  expect:
    upstream: { headers_absent: [authorization, notion-version] }
