# GitHub Enterprise Server read tools (D-74): a connection bound to a registered instance is served
# on that exact host only; the REST API lives under /api/v3 and GraphQL at /api/graphql.
# `connection.instance_host` registers the instance for the case. All credentials are fake.
- name: "ghes get_authenticated_user: bearer is injected on the registered API host"
  connection: { instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://github.example.com/api/v3/user" }
  expect:
    app: github-ghes
    tool: get_authenticated_user
    upstream: { url: "https://github.example.com/api/v3/user", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "ghes negative get_authenticated_user: DELETE selects no tool"
  connection: { instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://github.example.com/api/v3/user" }
  expect: { app: github-ghes }
