- name: "ghes graphql_query: GraphQL is served at /api/graphql with the bearer token"
  connection: { instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://github.example.com/api/graphql"
    headers: { content-type: application/json }
    body: '{"query":"query Viewer { viewer { login } }","operationName":"Viewer"}'
  expect:
    app: github-ghes
    tool: graphql_query
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
- name: "ghes git_fetch: git over HTTPS uses basic auth on the registered host"
  connection: { instance_host: github.example.com, credentials: { access_token: "tok-git-1" } }
  request: { method: GET, url: "https://github.example.com/example/demo.git/info/refs?service=git-upload-pack" }
  expect:
    app: github-ghes
    tool: git_fetch
    upstream: { headers: { authorization: "Basic eC1hY2Nlc3MtdG9rZW46dG9rLWdpdC0x" } }
- name: "ghes negative get_repo: the SaaS path layout selects no tool on a registered host"
  connection: { instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://github.example.com/repos/example/demo" }
  expect: { app: github-ghes }
- name: "negative ghes host: a connection of the instance is refused on github.com"
  connection: { instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://github.com/example/demo.git/info/refs?service=git-upload-pack" }
  expect: { refused: host_mismatch, expected_host: github.example.com }
- name: "negative ghes host: a connection of the instance is not injected on api.github.com"
  connection: { instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.github.com/user" }
  expect: { refused: host_mismatch, expected_host: github.example.com }
- name: "negative ghes host: a connection of the instance is not injected on another host"
  connection: { instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://github.other.example/api/v3/user" }
  expect: { unmatched: true }
- name: "negative ghes host: an unregistered host injects nothing"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://github.example.com/api/v3/user" }
  expect: { unmatched: true }
