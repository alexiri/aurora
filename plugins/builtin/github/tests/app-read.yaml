- name: "github app: graphql_query: a query selects the read tool"
  connection: { method: github_app, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.github.com/graphql"
    headers: { content-type: application/json }
    body: '{"query":"query Repo { repository(owner: \"example\", name: \"demo\") { id } }","operationName":"Repo"}'
  expect:
    app: github
    tool: graphql_query
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
- name: "github app: negative graphql_query: a mutation does not select the read tool"
  connection: { method: github_app, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.github.com/graphql"
    headers: { content-type: application/json }
    body: '{"query":"mutation AddStar { addStar(input: {starrableId: \"R_example\"}) { clientMutationId } }","operationName":"AddStar"}'
  expect: { app: github, tool: graphql_mutation }
- name: "github app: unparseable graphql body matches no tool (fail closed)"
  connection: { method: github_app, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.github.com/graphql"
    headers: { content-type: application/json }
    body: 'not json'
  expect: { app: github }
- name: "github app: git_fetch: the ref advertisement uses basic auth with the installation token"
  connection: { method: github_app, credentials: { access_token: "tok-git-1" } }
  request: { method: GET, url: "https://github.com/example/demo.git/info/refs?service=git-upload-pack" }
  expect:
    app: github
    tool: git_fetch
    upstream: { headers: { authorization: "Basic eC1hY2Nlc3MtdG9rZW46dG9rLWdpdC0x" } }
- name: "github app: negative git_fetch: a web page on github.com is not a git operation"
  connection: { method: github_app, credentials: { access_token: "tok-git-1" } }
  request: { method: GET, url: "https://github.com/example/demo/issues" }
  expect: { app: github }
- name: "github app: negative: the token is not injected on a lookalike host"
  connection: { method: github_app, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.github.com.evil.example/installation/repositories" }
  expect: { unmatched: true }
# FIX-123 (D-214): tools restricted to a connect method are classified only for its connections.
- name: "method filter: list_installation_repos is not a tool of a personal-token connection"
  connection: { method: token, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.github.com/installation/repositories" }
  expect: { app: github, no_tool: true }
- name: "method filter: list_installation_repos is not a tool of an OAuth connection"
