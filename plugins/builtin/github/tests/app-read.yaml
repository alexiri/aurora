# github.com read tools of the GitHub App (the installation token is minted by the token.mint hook;
# these cases use the stored token). Each tool has a positive case and a `negative <tool>:` case.
# All credentials are fake.
- name: "github app: list_installation_repos: bearer is injected on the API host"
  connection: { method: github_app, credentials: { access_token: "tok-fixture-1", private_key: "key-fixture-1" }, metadata: { app_id: "123456", installation_id: "7" } }
  request: { method: GET, url: "https://api.github.com/installation/repositories?per_page=50" }
  expect:
    app: github
    tool: list_installation_repos
    upstream: { url: "https://api.github.com/installation/repositories?per_page=50", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative list_installation_repos: DELETE selects no tool"
  connection: { method: github_app, credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://api.github.com/installation/repositories" }
  expect: { app: github }
- name: "github app: agent supplied authorization is overwritten"
  connection: { method: github_app, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: GET
    url: "https://api.github.com/installation/repositories"
    headers: { authorization: "Bearer agent-guess" }
  expect:
    tool: list_installation_repos
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
