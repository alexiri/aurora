# github.com read tools: each has a positive case and a `negative <tool>:` case. All credentials are fake.
- name: "get_authenticated_user: bearer is injected on the API host"
  connection: { credentials: { access_token: "tok-fixture-1" }, metadata: { login: "alice-example" } }
  request: { method: GET, url: "https://api.github.com/user" }
  expect:
    app: github
    tool: get_authenticated_user
    upstream: { url: "https://api.github.com/user", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative get_authenticated_user: DELETE selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://api.github.com/user" }
  expect: { app: github }
- name: "agent supplied authorization is overwritten"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: GET
    url: "https://api.github.com/user"
    headers: { authorization: "Bearer agent-guess" }
  expect:
    tool: get_authenticated_user
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
