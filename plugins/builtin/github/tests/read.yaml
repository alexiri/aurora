- name: "graphql_query: a query selects the read tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.github.com/graphql"
    headers: { content-type: application/json }
    body: '{"query":"query Viewer { viewer { login } }","operationName":"Viewer"}'
  expect:
    app: github
    tool: graphql_query
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative graphql_query: a mutation does not select the read tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.github.com/graphql"
    headers: { content-type: application/json }
    body: '{"query":"mutation AddStar { addStar(input: {starrableId: \"R_example\"}) { clientMutationId } }","operationName":"AddStar"}'
  expect: { app: github, tool: graphql_mutation }
- name: "unparseable graphql body matches no tool (fail closed)"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.github.com/graphql"
    headers: { content-type: application/json }
    body: 'not json'
  expect: { app: github }
- name: "git_fetch: the ref advertisement uses basic auth on github.com"
  connection: { credentials: { access_token: "tok-git-1" } }
  request: { method: GET, url: "https://github.com/example/demo.git/info/refs?service=git-upload-pack" }
  expect:
    app: github
    tool: git_fetch
    upstream: { headers: { authorization: "Basic eC1hY2Nlc3MtdG9rZW46dG9rLWdpdC0x" } }
- name: "negative git_fetch: a web page on github.com is not a git operation"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://github.com/example/demo/issues" }
  expect: { app: github }
- name: "negative: the token is not injected on a lookalike host"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.github.com.evil.example/user" }
  expect: { unmatched: true }
- name: "negative: the token is not injected on uploads.github.com"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://uploads.github.com/repos/example/demo/releases/1/assets" }
  expect: { unmatched: true }
