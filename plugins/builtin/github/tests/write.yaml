- name: "write_contents: PUT summary shows file, branch and message"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: PUT
    url: "https://api.github.com/repos/example/demo/contents/README.md"
    headers: { content-type: application/json }
    body: '{"message":"Update readme","content":"aGVsbG8=","branch":"feature-x"}'
  expect:
    tool: write_contents
    summary: { title: "Change repository file", fields: { Owner: example, Repository: demo, File: "README.md", Branch: feature-x, Message: "Update readme" } }
- name: "write_contents: DELETE is the same write tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: DELETE
    url: "https://api.github.com/repos/example/demo/contents/README.md"
    headers: { content-type: application/json }
    body: '{"message":"Remove readme","sha":"abc123","branch":"feature-x"}'
  expect: { tool: write_contents }
- name: "negative write_contents: PATCH selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://api.github.com/repos/example/demo/contents/README.md" }
  expect: { app: github }
- name: "create_ref: summary shows the ref and its source commit"
  connection: { credentials: { access_token: "tok-fixture-1" } }
