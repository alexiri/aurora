- name: "graphql_mutation: summary shows the operation and fields"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.github.com/graphql"
    headers: { content-type: application/json }
    body: '{"query":"mutation AddStar { addStar(input: {starrableId: \"R_example\"}) { clientMutationId } }","operationName":"AddStar"}'
  expect:
    tool: graphql_mutation
    summary: { title: "GraphQL mutation", fields: { Operation: AddStar, Fields: addStar } }
- name: "negative graphql_mutation: GET selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.github.com/graphql" }
  expect: { app: github }
- name: "git_push: the push service is the write tool"
  connection: { credentials: { access_token: "tok-git-1" } }
  request: { method: POST, url: "https://github.com/example/demo.git/git-receive-pack" }
  expect:
    tool: git_push
    summary: { title: "Push code", fields: { Owner: example, Repository: demo.git } }
    upstream: { headers: { authorization: "Basic eC1hY2Nlc3MtdG9rZW46dG9rLWdpdC0x" } }
- name: "negative git_push: a fetch is not a push"
  connection: { credentials: { access_token: "tok-git-1" } }
  request: { method: POST, url: "https://github.com/example/demo.git/git-upload-pack" }
  expect: { app: github, tool: git_fetch }
