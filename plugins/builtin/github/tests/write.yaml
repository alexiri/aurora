# github.com write tools: each is classified as a write tool, has an approval summary and a
# `negative <tool>:` case. All credentials are fake.
- name: "create_issue: summary shows repository and title"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.github.com/repos/example/demo/issues"
    headers: { content-type: application/json }
    body: '{"title":"Broken build","body":"CI is red"}'
  expect:
    app: github
    tool: create_issue
    summary: { title: "Create issue", fields: { Owner: example, Repository: demo, Title: "Broken build" } }
- name: "negative create_issue: PUT selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PUT, url: "https://api.github.com/repos/example/demo/issues" }
  expect: { app: github }
- name: "update_issue: summary shows the issue and the new state"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: PATCH
    url: "https://api.github.com/repos/example/demo/issues/7"
    headers: { content-type: application/json }
    body: '{"state":"closed"}'
  expect:
    tool: update_issue
    summary: { title: "Update issue", fields: { Owner: example, Repository: demo, Issue: "7", State: closed } }
- name: "negative update_issue: POST selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://api.github.com/repos/example/demo/issues/7" }
  expect: { app: github }
- name: "create_issue_comment: summary shows the comment"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.github.com/repos/example/demo/issues/7/comments"
    headers: { content-type: application/json }
    body: '{"body":"Fixed in the next release"}'
  expect:
    tool: create_issue_comment
    summary: { title: "Comment on issue or pull request", fields: { Owner: example, Repository: demo, Issue: "7", Comment: "Fixed in the next release" } }
- name: "negative create_issue_comment: PUT selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PUT, url: "https://api.github.com/repos/example/demo/issues/7/comments" }
  expect: { app: github }
- name: "create_pull: summary shows title, head and base"
  connection: { credentials: { access_token: "tok-fixture-1" } }
