  request:
    method: POST
    url: "https://github.example.com/api/graphql"
    headers: { content-type: application/json }
    body: '{"query":"mutation AddStar { addStar(input: {starrableId: \"R_example\"}) { clientMutationId } }","operationName":"AddStar"}'
  expect:
    app: github-ghes
    tool: graphql_mutation
    summary: { title: "GraphQL mutation", fields: { Operation: AddStar, Fields: addStar } }
