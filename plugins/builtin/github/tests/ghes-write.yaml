# GitHub Enterprise Server write tools: classified on the registered host, with approval summaries.
# All credentials are fake.
- name: "ghes create_issue: summary shows repository and title"
  connection: { instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://github.example.com/api/v3/repos/example/demo/issues"
    headers: { content-type: application/json }
    body: '{"title":"Broken build"}'
  expect:
    app: github-ghes
    tool: create_issue
    summary: { title: "Create issue", fields: { Owner: example, Repository: demo, Title: "Broken build" } }
- name: "ghes update_issue"
  connection: { instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: PATCH
    url: "https://github.example.com/api/v3/repos/example/demo/issues/7"
    headers: { content-type: application/json }
    body: '{"state":"closed"}'
  expect:
    app: github-ghes
    tool: update_issue
    summary: { title: "Update issue", fields: { Owner: example, Repository: demo, Issue: "7", State: closed } }
