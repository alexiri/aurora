# GitHub App on GitHub Enterprise Server (D-74): a connection bound to a registered instance is
# served on that exact host only; REST under /api/v3, GraphQL at /api/graphql. All credentials are fake.
- name: "github app: ghes list_installation_repos: bearer is injected on the registered API host"
  connection: { method: github_app, instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" }, metadata: { app_id: "123456", installation_id: "7", ghes_host: github.example.com } }
  request: { method: GET, url: "https://github.example.com/api/v3/installation/repositories" }
  expect:
    app: github-ghes
    tool: list_installation_repos
    upstream: { url: "https://github.example.com/api/v3/installation/repositories", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "ghes negative list_installation_repos: DELETE selects no tool"
  connection: { method: github_app, instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://github.example.com/api/v3/installation/repositories" }
  expect: { app: github-ghes }
