- name: "github app: ghes graphql_query: GraphQL is served at /api/graphql with the bearer token"
  connection: { method: github_app, instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://github.example.com/api/graphql"
    headers: { content-type: application/json }
    body: '{"query":"query Repo { repository(owner: \"example\", name: \"demo\") { id } }","operationName":"Repo"}'
  expect:
    app: github-ghes
    tool: graphql_query
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
