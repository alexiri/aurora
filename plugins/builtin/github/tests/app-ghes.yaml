- name: "github app: negative ghes host: a connection of the instance is refused on github.com"
  connection: { method: github_app, instance_host: github.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://github.com/example/demo.git/info/refs?service=git-upload-pack" }
  expect: { refused: host_mismatch, expected_host: github.example.com }
- name: "github app: negative ghes host: a connection of the instance is refused on api.github.com"
