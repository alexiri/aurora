    agent:
      summary: "Grafana dashboards, queries on Prometheus, Mimir, Loki, OpenSearch and SQL data sources, and alerts: find a dashboard, run a query, see what fires."
      instructions: |
        Aurora adds the token: send none, and never send this connection's requests to another
        host. Query any data source with query_datasources (POST /api/ds/query); read the
        grafana-query skill first and use its script. Find a data source UID with
        list_datasources or in a dashboard's panels. The data source proxy GET tools (prometheus_*,
        loki_*) are a fallback: a 3xx from them means use query_datasources. Keep time ranges and
        steps small; send only read statements.
        To leave a Grafana alert rule, read the grafana-alerts skill and use its script: never
        create, change or delete a rule without the script's managed_by label and expiry, and
        never name a contact point that list_contact_points does not show. The script is the only
        way to write a rule: build no rule body by hand — the gateway refuses a rule body the
        script cannot build (a recording rule, a second query, or a label, annotation or receiver
        setting the script does not set), and the approval card shows the shape the script builds
        and cannot show fields outside it. There is no tool for contact points,
        notification policies, mute timings or templates: a person makes those.
      operations: operations.json
