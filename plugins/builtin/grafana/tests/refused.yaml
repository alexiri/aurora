# Dangerous endpoints no tool offers (FIX-118, SEC-145, D-429): each request is a Grafana request
# but selects no tool, so the package's `grants.block_untooled` blocks it under every grant. Paths and methods are
# Grafana v13.3.1's (pkg/api/api.go, pkg/services/serviceaccounts/api/api.go). All credentials are fake.
- name: "refused service-account token creation: POST /api/serviceaccounts/<id>/tokens selects no tool (SEC-145)"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://grafana.example.org/api/serviceaccounts/7/tokens"
    headers: { content-type: application/json }
    body: '{"name":"second-token"}'
  expect: { app: grafana, no_tool: true }
- name: "refused service-account token creation: listing a service account's tokens selects no tool either"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/api/serviceaccounts/7/tokens" }
  expect: { app: grafana, no_tool: true }
- name: "refused service-account creation: POST /api/serviceaccounts selects no tool"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://grafana.example.org/api/serviceaccounts"
    headers: { content-type: application/json }
    body: '{"name":"agent-made","role":"Admin"}'
  expect: { app: grafana, no_tool: true }
- name: "refused API key creation: POST /api/auth/keys (removed in Grafana 12, still on older servers) selects no tool"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request:
