# Security review (P5-CATALOG §Security review, D-429): Grafana's data source proxy forwards any
# method and any backend path, so only the named backend paths are tools. Every request below is a
# Grafana request (the token is injected under /api, so grants, approvals and the request log apply)
# but selects no tool: the package's `grants.block_untooled` blocks it under every grant. Tool paths are exact (no `**`),
# so an extra, encoded or dot segment after a tool path never matches it.
#
# The gateway refuses dot segments (`.`, `..`, also as `%2e`), an encoded `/` (`%2F`) or `\` (`%5C`)
# and NUL with 400 `ambiguous_path` before matching (docs/06 step 3), and forwards the normalized path
# (`//` collapsed, encoded unreserved characters decoded), so matcher and Grafana see the same segments.
# Since FIX-216 this offline runner applies the same step, so those cases expect the refusal; the
# normalization cases show a normalized path matches exactly what its plain form matches. All
# credentials are fake.
- name: "proxy boundary: an unlisted backend GET (Prometheus configuration) selects no tool"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/api/datasources/proxy/uid/prom-main/api/v1/status/config" }
  expect:
    app: grafana
    no_tool: true
    upstream: { url: "https://grafana.example.org/api/datasources/proxy/uid/prom-main/api/v1/status/config", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "proxy boundary: the command-line flags status selects no tool"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/api/datasources/proxy/uid/prom-main/api/v1/status/flags" }
  expect: { app: grafana, no_tool: true }
