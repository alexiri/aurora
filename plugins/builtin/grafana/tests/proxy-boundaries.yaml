- name: "proxy boundary: a dot-dot segment after a tool path is refused before matching (ambiguous_path)"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/api/datasources/proxy/uid/prom-main/api/v1/query/../admin/tsdb/snapshot" }
  expect: { refused: ambiguous_path }
- name: "proxy boundary: an encoded dot-dot (%2e%2e) after a tool path is refused (ambiguous_path)"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/api/datasources/proxy/uid/prom-main/api/v1/query/%2e%2e/admin/tsdb/snapshot" }
  expect: { refused: ambiguous_path }
- name: "proxy boundary: an upper-case encoded dot-dot (%2E%2E) is refused (ambiguous_path)"
