# Read tools: one positive and one negative case each. Grafana has no default host, so every case
# registers the instance grafana.example.org. All credentials are fake.
- name: "get_current_user: GET /api/user injects the bearer"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/api/user" }
  expect:
    app: grafana
    tool: get_current_user
    upstream: { url: "https://grafana.example.org/api/user", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative get_current_user: changing the signed-in user (PUT) is not the read"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: PUT, url: "https://grafana.example.org/api/user" }
  expect: { app: grafana, no_tool: true }
