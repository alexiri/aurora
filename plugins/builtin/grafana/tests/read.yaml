# query_datasources is a READ (D-462): Grafana's own UI queries every data source through this POST and
# grants it to the Viewer role. It is classified exactly at POST /api/ds/query and nowhere else.
- name: "query_datasources: a unified PromQL query is a read and shows the data source and expression"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://grafana.example.org/api/ds/query"
    headers: { content-type: application/json }
    body: '{"from":"now-1h","to":"now","queries":[{"refId":"A","datasource":{"type":"prometheus","uid":"prom-main"},"expr":"sum(rate(http_requests_total[5m]))"},{"refId":"B","datasource":{"uid":"loki-main"},"expr":"count_over_time({app=\"api\"}[5m])"}]}'
  expect:
    app: grafana
    tool: query_datasources
    upstream: { url: "https://grafana.example.org/api/ds/query", headers: { authorization: "Bearer tok-fixture-1" } }
    summary:
      title: "run a data source query"
      fields:
        Data source UIDs: "prom-main, loki-main"
        Expression: "sum(rate(http_requests_total[5m]))"
        From: "now-1h"
        To: "now"
- name: "query_datasources: a SQL query shows the statement"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://grafana.example.org/api/ds/query"
    headers: { content-type: application/json }
    body: '{"from":"1763643600000","to":"1763650800000","queries":[{"refId":"A","datasource":{"uid":"pg-reports"},"rawSql":"SELECT count(*) FROM deployments","format":"table"}]}'
  expect:
    app: grafana
    tool: query_datasources
    summary:
      title: "run a data source query"
      fields:
        Data source UIDs: "pg-reports"
        SQL: "SELECT count(*) FROM deployments"
- name: "query_datasources: an Elasticsearch query shows its query string"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://grafana.example.org/api/ds/query"
    headers: { content-type: application/json }
    body: '{"from":"now-6h","to":"now","queries":[{"refId":"A","datasource":{"uid":"es-logs"},"query":"level:error AND service:api","metrics":[{"type":"count","id":"1"}]}]}'
  expect:
    app: grafana
    tool: query_datasources
    summary:
      title: "run a data source query"
      fields:
        Data source UIDs: "es-logs"
        Query: "level:error AND service:api"
- name: "negative query_datasources: a data source's resource call (any method, any path) selects no tool"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://grafana.example.org/api/datasources/uid/prom-main/resources/api/v1/query" }
  expect: { app: grafana, no_tool: true }
- name: "negative query_datasources: GET /api/ds/query selects no tool"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/api/ds/query" }
  expect: { app: grafana, no_tool: true }
- name: "negative query_datasources: a path under /api/ds/query selects no tool"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://grafana.example.org/api/ds/query/history" }
  expect: { app: grafana, no_tool: true }
- name: "negative query_datasources: the sibling /api/ds/query-diagnostics selects no tool"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://grafana.example.org/api/ds/query-diagnostics" }
  expect: { app: grafana, no_tool: true }
