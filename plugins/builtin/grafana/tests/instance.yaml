# Instance binding (D-74, D-231, SEC-04/59): Grafana has no default host. A connection bound to a
# registered server is injected on that exact host, under /api only, and under the server's base
# path when it has one. Grafana claims no other host, so a request anywhere else is not a Grafana
# request at all: nothing is injected (`unmatched`; `host_mismatch` needs a second claim on the host,
# which an instance-only app never has). All credentials are fake.
- name: "instance: the bearer is injected on the registered host under /api"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/api/dashboards/uid/api-overview" }
  expect:
    app: grafana
    tool: get_dashboard
    upstream: { url: "https://grafana.example.org/api/dashboards/uid/api-overview", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "instance: a Grafana Cloud stack registered as an instance is served the same way"
  connection: { instance_host: example-stack.grafana.net, credentials: { access_token: "tok-fixture-2" } }
  request: { method: GET, url: "https://example-stack.grafana.net/api/user" }
  expect: { app: grafana, tool: get_current_user, upstream: { headers: { authorization: "Bearer tok-fixture-2" } } }
- name: "negative instance: the connection is not injected on another host"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.other.example/api/user" }
  expect: { unmatched: true }
- name: "negative instance: a look-alike host under the registered one is another host"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org.attacker.example/api/user" }
  expect: { unmatched: true }
- name: "negative instance: an unregistered host injects nothing"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/api/user" }
  expect: { unmatched: true }
- name: "boundary: the sign-in page of the registered host never gets the token"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://grafana.example.org/login" }
  expect: { unmatched: true }
- name: "boundary: the newer /apis layer is outside /api and never gets the token"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/apis/dashboard.grafana.app/v1/namespaces/default/dashboards" }
  expect: { unmatched: true }
- name: "boundary: the service account pages of the web interface never get the token"
  connection: { instance_host: grafana.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/org/serviceaccounts" }
  expect: { unmatched: true }
# (D-231) Grafana served under a path (root_url with serve_from_sub_path).
- name: "base path: a proxy query under /grafana is matched on the app path and injected"
  connection: { instance_host: monit.example.org, instance_base_path: /grafana, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://monit.example.org/grafana/api/datasources/proxy/uid/prom-main/api/v1/query?query=up" }
  expect:
    app: grafana
    tool: prometheus_query
    upstream: { url: "https://monit.example.org/grafana/api/datasources/proxy/uid/prom-main/api/v1/query?query=up", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "base path: ending a silence under /grafana reads the silence id from the app path"
  connection: { instance_host: monit.example.org, instance_base_path: /grafana, credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://monit.example.org/grafana/api/alertmanager/grafana/api/v2/silence/silence-fixture-2" }
  expect: { app: grafana, tool: delete_silence, summary: { title: "end a silence", fields: { Silence: "silence-fixture-2" } } }
- name: "base path: the admin API under /grafana still selects no tool"
  connection: { instance_host: monit.example.org, instance_base_path: /grafana, credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://monit.example.org/grafana/api/datasources/proxy/uid/prom-main/api/v1/admin/tsdb/delete_series" }
  expect: { app: grafana, no_tool: true }
- name: "negative base path: the same request without the base path matches nothing"
  connection: { instance_host: monit.example.org, instance_base_path: /grafana, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://monit.example.org/api/user" }
  expect: { unmatched: true }
- name: "negative base path: a sibling path /grafana2 matches nothing"
  connection: { instance_host: monit.example.org, instance_base_path: /grafana, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://monit.example.org/grafana2/api/user" }
  expect: { unmatched: true }
- name: "negative base path: another host matches nothing"
  connection: { instance_host: monit.example.org, instance_base_path: /grafana, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://grafana.example.org/grafana/api/user" }
  expect: { unmatched: true }
