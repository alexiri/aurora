# Write tools: each has a positive case with its approval summary and a negative case.
- name: "send_message: summary shows recipient and subject read from the raw message"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://gmail.googleapis.com/gmail/v1/users/me/messages/send"
    headers: { content-type: application/json }
    body: '{"raw":"VG86IGJvYkBleGFtcGxlLmNvbQ0KU3ViamVjdDogUXVhcnRlcmx5IHJlcG9ydA0KDQpIZWxsbw"}'
  expect:
    app: gmail
    tool: send_message
    summary: { title: "Send mail", fields: { To: "bob@example.com", Subject: "Quarterly report" } }
- name: "negative send_message: PUT selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PUT, url: "https://gmail.googleapis.com/gmail/v1/users/me/messages/send" }
  expect: { app: gmail }
- name: "create_draft: summary shows recipient and subject"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://gmail.googleapis.com/gmail/v1/users/me/drafts"
    headers: { content-type: application/json }
    body: '{"message":{"raw":"VG86IGNhcm9sQGV4YW1wbGUuY29tDQpTdWJqZWN0OiBEcmFmdCBub3Rlcw0KDQpCb2R5"}}'
  expect:
    tool: create_draft
    summary: { title: "Create a mail draft", fields: { To: "carol@example.com", Subject: "Draft notes" } }
- name: "negative create_draft: PUT selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PUT, url: "https://gmail.googleapis.com/gmail/v1/users/me/drafts" }
  expect: { app: gmail }
- name: "send_draft: summary shows the draft id"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://gmail.googleapis.com/gmail/v1/users/me/drafts/send"
    headers: { content-type: application/json }
    body: '{"id":"r-1234567890"}'
  expect:
    tool: send_draft
    summary: { title: "Send a draft", fields: { Draft: "r-1234567890" } }
- name: "negative send_draft: PUT selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PUT, url: "https://gmail.googleapis.com/gmail/v1/users/me/drafts/send" }
  expect: { app: gmail }
- name: "modify_message: summary shows the message and the label changes"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://gmail.googleapis.com/gmail/v1/users/me/messages/18c0ffee00000001/modify"
    headers: { content-type: application/json }
    body: '{"addLabelIds":["STARRED"],"removeLabelIds":["UNREAD"]}'
  expect:
    tool: modify_message
    summary: { title: "Change labels on a message", fields: { Message: "18c0ffee00000001", "Add label": "STARRED", "Remove label": "UNREAD" } }
- name: "negative modify_message: PUT selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PUT, url: "https://gmail.googleapis.com/gmail/v1/users/me/messages/18c0ffee00000001/modify" }
  expect: { app: gmail }
