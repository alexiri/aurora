# Gmail: every tool has a positive case and a `negative <tool>:` case. All credentials are fake.
# Request bodies are shaped like Gmail API requests; addresses are example.com.
- name: "get_profile: bearer is injected on the Gmail host"
  connection: { credentials: { access_token: "tok-fixture-1" }, metadata: { account: "alice@example.com" } }
  request: { method: GET, url: "https://gmail.googleapis.com/gmail/v1/users/me/profile" }
  expect:
    app: gmail
    tool: get_profile
    upstream: { url: "https://gmail.googleapis.com/gmail/v1/users/me/profile", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative get_profile: POST selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://gmail.googleapis.com/gmail/v1/users/me/profile" }
  expect: { app: gmail }
- name: "agent supplied authorization is overwritten"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: GET
    url: "https://gmail.googleapis.com/gmail/v1/users/me/profile"
    headers: { authorization: "Bearer agent-guess" }
  expect:
    tool: get_profile
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative get_profile: the Calendar path on the Gmail host is not claimed"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://gmail.googleapis.com/calendar/v3/users/me/calendarList" }
  expect: { unmatched: true }
- name: "negative get_profile: another API version is not claimed"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://gmail.googleapis.com/gmail/v2/users/me/profile" }
  expect: { unmatched: true }
- name: "negative get_profile: the Gmail API path on the shared Google host is not claimed"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://www.googleapis.com/gmail/v1/users/me/profile" }
  expect: { unmatched: true }
- name: "negative get_profile: the Google token endpoint is not claimed"
  request: { method: GET, url: "https://oauth2.googleapis.com/token" }
  expect: { unmatched: true }
- name: "negative get_profile: the upload variant of Gmail is not claimed"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send" }
  expect: { unmatched: true }
- name: "list_messages: search query is passed through"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://gmail.googleapis.com/gmail/v1/users/me/messages?q=from%3Abob%40example.com&maxResults=10" }
  expect:
    tool: list_messages
    upstream: { url: "https://gmail.googleapis.com/gmail/v1/users/me/messages?q=from%3Abob%40example.com&maxResults=10" }
- name: "negative list_messages: DELETE selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://gmail.googleapis.com/gmail/v1/users/me/messages" }
  expect: { app: gmail }
- name: "get_message: format and metadata headers"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://gmail.googleapis.com/gmail/v1/users/me/messages/18c0ffee00000001?format=metadata&metadataHeaders=Subject" }
  expect: { tool: get_message }
- name: "negative get_message: DELETE (permanent delete) selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://gmail.googleapis.com/gmail/v1/users/me/messages/18c0ffee00000001" }
  expect: { app: gmail }
- name: "negative get_message: trash is not offered"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://gmail.googleapis.com/gmail/v1/users/me/messages/18c0ffee00000001/trash" }
  expect: { app: gmail }
- name: "list_threads"
  connection: { credentials: { access_token: "tok-fixture-1" } }
