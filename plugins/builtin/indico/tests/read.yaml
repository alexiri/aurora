# Read tools. Every case registers the Indico server through connection.instance_host (the app has
# no default host). Host: indico.example.org. All credentials are fake. Each read tool has a
# positive case and a `negative <tool>:` case; the overlapping patterns have ordering cases
# (R2/R3, R4/R5/R6, R20/R22, R23/R25).

# --- official tier: /api/ (H2) and /export/ (H1) ---
- name: "get_current_user: the connected user, bearer injected on /api/ (H2)"
  connection: { instance_host: indico.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://indico.example.org/api/user/" }
  expect: { app: indico, tool: get_current_user, upstream: { url: "https://indico.example.org/api/user/", headers: { authorization: "Bearer tok-fixture-1" } } }
- name: "negative get_current_user: POST selects no read tool"
  connection: { instance_host: indico.example.org, credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://indico.example.org/api/user/" }
  expect: { app: indico }

