  request:
    method: POST
    url: "https://indico.example.org/event/create/prepare"
    headers: { content-type: application/json }
    body: '{"title":"Planning meeting","start_dt":"2026-11-12T14:00:00","tz":"Europe/Zurich","duration":60,"event_type":"meeting"}'
