package:
  id: indico
  version: 1.2.2
  contract: 1
  min_core: 0.1.0
  publisher: aurora
  name: Indico
  description: Events, meetings, room booking and favorites on your organisation's own Indico server (documented HTTP API on Indico 3.0 and later; opt-in extended tier on Indico's internal endpoints, verified against 3.3.14)
  homepage: https://getindico.io
oauth_clients:
  - id: indico
    authorize_url: "https://{instance}/oauth/authorize"
    token_url: "https://{instance}/oauth/token"
    pkce: true
    client_auth: body
    body_format: form
    fields:
      - { name: client_id, label: Client ID }
      - { name: client_secret, label: Client secret, secret: true }
    setup_note: "An Indico administrator adds an application on that Indico server (/admin/apps/), registers the Aurora redirect URI and allows only the scopes you will offer. Every Indico server has its own application."
apps:
  - about:
      id: indico
      name: Indico
      description: Search and read events and meetings, book rooms and manage favorites on your Indico server
      category: productivity
      api_docs: https://docs.getindico.io/en/stable/http-api/
      connect_note:
        text: "An administrator registers your Indico server first (Self-hosted apps). Bookings, favorites and room search by free time use Indico's internal endpoints and the broad 'Everything' scopes, which Indico does not keep compatible between versions; read the setup guide before choosing them. To find free rooms and book them, also tick 'Extended: read everything' and 'Book rooms through the documented HTTP API'; 'Everything' write access is only needed for recurring bookings, cancellations and favorites."
        url: https://docs.getindico.io/en/stable/http-api/access/
      label_hint: Indico account email
    instances:
      label: Indico server
      probe: { method: GET, path: /api/user/, expect_status: [200] }
    credentials:
      - { name: access_token, secret: true }
    connect:
      - id: token
        kind: fields
        label: Personal API token
        description: "A token you create on your Indico profile. It does not tell Aurora which scopes it has, so you say which ones you gave it."
        fields:
          - name: access_token
            label: Personal API token
            type: secret
            store: credentials
            required: true
            placeholder: "indp_…"
            help_url: https://docs.getindico.io/en/stable/http-api/access/#api-token-authentication
        # A personal token does not tell Aurora its scopes (Indico shows them only on the token page).
        # The names are Indico's own (indico/core/oauth/scopes.py, 3.3.14); the read ones are probed with
        # one harmless GET each, the write ones are never probed.
        scopes:
          - { scope: "read:user", name: Read your Indico profile, access: read }
          - { scope: "read:legacy_api", name: "Read events, timetables, rooms and bookings (official API)", access: read }
          - { scope: "write:legacy_api", name: "Book rooms through the official API", access: write }
          - { scope: "read:everything", name: "Read everything you can see (Indico web API)", access: read }
          - { scope: "full:everything", name: "Change everything you can change (Indico web API)", access: write }
        probe_scopes:
          "read:user": { method: GET, url: "https://{instance}/api/user/" }
          "read:legacy_api": { method: GET, url: "https://{instance}/export/categ/0.json?limit=1" }
          "read:everything": { method: GET, url: "https://{instance}/rooms/api/locations" }
        probe:
          method: GET
          url: "https://{instance}/api/user/"
          expect_status: [200]
          label: /email
      - id: oauth
        kind: oauth2
        label: Sign in with Indico
        description: "You sign in to your Indico server and Aurora gets a token that renews itself. Needs an OAuth client registered for that server first."
        client: indico
        scopes:
          - { scope: "read:user", name: Read your Indico profile, access: read }
          - { scope: "read:legacy_api", name: "Read events, timetables, rooms and bookings (documented HTTP API)", access: read }
          - { scope: "write:legacy_api", name: "Book rooms through the documented HTTP API", access: write }
          - { scope: "read:everything", name: "Extended: read everything you can see in Indico (room search by free time, favorites, my bookings, search)", access: read }
          - { scope: "full:everything", name: "Extended write: recurring bookings, cancellations, favorites, event preparation — Indico's internal endpoints, may change between versions", access: write }
        default_scopes: ["read:user", "read:legacy_api"]
        callback: query
        token_response:
          access_token: /access_token
          scope: /scope
        probe:
          method: GET
          url: "https://{instance}/api/user/"
          expect_status: [200]
          label: /email
    hosts:
      - match: { host: "{instance}", path_prefix: /export/ }
        inject:
          - bearer: "{credentials.access_token}"
      - match: { host: "{instance}", path_prefix: /api/ }
        inject:
          - bearer: "{credentials.access_token}"
      - match: { host: "{instance}", path_prefix: /rooms/api/ }
        inject:
          - bearer: "{credentials.access_token}"
      - match: { host: "{instance}", path_prefix: /user/api/favorites/ }
        inject:
          - bearer: "{credentials.access_token}"
      - match: { host: "{instance}", path_prefix: /user/search/ }
        inject:
          - bearer: "{credentials.access_token}"
      - match: { host: "{instance}", path_prefix: /search/api/search }
        inject:
          - bearer: "{credentials.access_token}"
      - match: { host: "{instance}", path_prefix: /category/search }
        inject:
          - bearer: "{credentials.access_token}"
      - match: { host: "{instance}", path_prefix: /event/create/prepare }
        inject: []
    # The `full:everything` token is far broader than this catalogue: only catalogued tools may use
    # it (P4-GRANTS, D-123, SEC-67). No full grants; untooled requests are blocked.
    grants:
      custom_only: true
      block_untooled: true
    tools:
      read:
        items:
          - { id: get_current_user, description: "Shows the Indico account Aurora is connected as.", name: Get the connected Indico user, host: "{instance}", path: /api/user/, methods: [GET], scopes: ["read:user"] }
          - { id: list_favorite_category_events, description: "Lists events in the categories you follow.", name: List events in my favorite categories, host: "{instance}", path: "/export/categ/favorites*", methods: [GET], scopes: ["read:legacy_api"] }
          - { id: list_category_events, description: "Lists the events in one or more categories.", name: List events in categories, host: "{instance}", path: "/export/categ/*", methods: [GET], scopes: ["read:legacy_api"] }
          - { id: search_events, description: "Searches events by title.", name: Search events by title, host: "{instance}", path: "/export/event/search/*", methods: [GET], scopes: ["read:legacy_api"] }
          - { id: get_event, description: "Reads an event: contributions, sessions, attachments and notes.", name: "Read an event (contributions, sessions, attachments, notes)", host: "{instance}", path: "/export/event/*", methods: [GET], scopes: ["read:legacy_api"] }
          - { id: get_event_file, description: "Downloads an event's file, or reads part of an event.", name: Download an event file or read part of an event, host: "{instance}", path: "/export/event/*/*/**", methods: [GET], scopes: ["read:legacy_api"] }
          - { id: get_timetable, description: "Reads an event's timetable.", name: Read an event timetable, host: "{instance}", path: "/export/timetable/*", methods: [GET], scopes: ["read:legacy_api"] }
          - { id: get_rooms, description: "Lists rooms with their bookings.", name: "Read rooms and their bookings (official API)", host: "{instance}", path: "/export/room/*/*", methods: [GET], scopes: ["read:legacy_api"] }
          - { id: find_room_by_name, description: "Finds a room by its name.", name: "Find a room by name (official API)", host: "{instance}", path: "/export/roomName/*/**", methods: [GET], scopes: ["read:legacy_api"] }
          - { id: list_reservations, description: "Lists the room bookings at a location.", name: "List room bookings at a location (official API)", host: "{instance}", path: "/export/reservation/*", methods: [GET], scopes: ["read:legacy_api"] }
          - { id: search, description: "Searches events, contributions, categories, notes and files.", name: "Search events, contributions, categories, notes and files (Indico web API)", host: "{instance}", path: /search/api/search, methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: search_categories, description: "Searches categories.", name: Search categories (Indico web API), host: "{instance}", path: /category/search, methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: list_favorite_users, description: "Lists the people you marked as favorites.", name: List my favorite users (Indico web API), host: "{instance}", path: /user/api/favorites/users, methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: list_favorite_categories, description: "Lists your favorite categories.", name: List my favorite categories (Indico web API), host: "{instance}", path: "/user/api/favorites/categories/**", methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: list_favorite_events, description: "Lists your favorite events.", name: List my favorite events (Indico web API), host: "{instance}", path: "/user/api/favorites/events/**", methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: list_favorite_rooms, description: "Lists your favorite rooms.", name: List my favorite rooms (Indico web API), host: "{instance}", path: "/rooms/api/user/favorite-rooms/**", methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: list_room_locations, description: "Lists the places where rooms can be booked.", name: List room booking locations (Indico web API), host: "{instance}", path: /rooms/api/locations, methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: list_equipment_types, description: "Lists the equipment a room can have.", name: List room equipment types (Indico web API), host: "{instance}", path: /rooms/api/equipment, methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: list_all_rooms, description: "Lists all rooms with their details.", name: "List all rooms with details (Indico web API)", host: "{instance}", path: /rooms/api/rooms/, methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: search_rooms, description: "Finds rooms that are free in a time slot.", name: "Search rooms free in a time slot (Indico web API)", host: "{instance}", path: /rooms/api/rooms/search, methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: get_room_availability, description: "Checks whether a room is free at a given time.", name: Check a room's availability (Indico web API), host: "{instance}", path: "/rooms/api/rooms/*/availability/**", methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: get_room_details, description: "Reads one room's details.", name: Read a room's details (Indico web API), host: "{instance}", path: "/rooms/api/rooms/*", methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: list_my_upcoming_bookings, description: "Lists your next room bookings.", name: List my next room bookings (Indico web API), host: "{instance}", path: /rooms/api/bookings/mine, methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: get_booking_calendar, description: "Reads the room booking calendar.", name: Read the booking calendar (Indico web API), host: "{instance}", path: /rooms/api/calendar, methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: get_booking, description: "Reads one room booking.", name: Read a room booking (Indico web API), host: "{instance}", path: "/rooms/api/bookings/*", methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: get_user_search_token, description: "Starts a search for people, the first step of searching users.", name: Start a user search (Indico web API), host: "{instance}", path: /user/search/token, methods: [GET], scopes: ["read:everything", "full:everything"] }
          - { id: search_users, description: "Searches for people in Indico. The answer contains personal data.", name: Search Indico users (Indico web API; returns personal data), host: "{instance}", path: /user/search/, methods: [GET], scopes: ["read:everything", "full:everything"] }
      write:
        items:
          - { id: book_room, description: "Books a room for one time slot.", name: "Book a room: one slot (official API)", host: "{instance}", path: "/api/roomBooking/bookRoom*", methods: [POST], scopes: ["write:legacy_api"] }
          - { id: create_booking, description: "Books a room with all options, including recurring bookings.", name: "Book a room: recurring, with all options (Indico web API)", host: "{instance}", path: /rooms/api/booking/create, methods: [POST], scopes: ["full:everything"] }
          - { id: cancel_booking, description: "Cancels a room booking.", name: Cancel a room booking (Indico web API), host: "{instance}", path: "/rooms/api/bookings/*/cancel", methods: [POST], scopes: ["full:everything"] }
          - { id: cancel_booking_occurrence, description: "Cancels one date of a recurring room booking.", name: Cancel one date of a room booking (Indico web API), host: "{instance}", path: "/rooms/api/bookings/*/*/cancel", methods: [POST], scopes: ["full:everything"] }
          - { id: add_favorite_user, description: "Adds a person to your favorites.", name: Add a favorite user (Indico web API), host: "{instance}", path: "/user/api/favorites/users/*", methods: [PUT], scopes: ["full:everything"] }
          - { id: remove_favorite_user, description: "Removes a person from your favorites.", name: Remove a favorite user (Indico web API), host: "{instance}", path: "/user/api/favorites/users/*", methods: [DELETE], scopes: ["full:everything"] }
          - { id: add_favorite_category, description: "Adds a category to your favorites.", name: Add a favorite category (Indico web API), host: "{instance}", path: "/user/api/favorites/categories/*", methods: [PUT], scopes: ["full:everything"] }
          - { id: remove_favorite_category, description: "Removes a category from your favorites.", name: Remove a favorite category (Indico web API), host: "{instance}", path: "/user/api/favorites/categories/*", methods: [DELETE], scopes: ["full:everything"] }
          - { id: add_favorite_event, description: "Adds an event to your favorites.", name: Add a favorite event (Indico web API), host: "{instance}", path: "/user/api/favorites/events/*", methods: [PUT], scopes: ["full:everything"] }
          - { id: remove_favorite_event, description: "Removes an event from your favorites.", name: Remove a favorite event (Indico web API), host: "{instance}", path: "/user/api/favorites/events/*", methods: [DELETE], scopes: ["full:everything"] }
          - { id: add_favorite_room, description: "Adds a room to your favorites.", name: Add a favorite room (Indico web API), host: "{instance}", path: "/rooms/api/user/favorite-rooms/*", methods: [PUT], scopes: ["full:everything"] }
          - { id: remove_favorite_room, description: "Removes a room from your favorites.", name: Remove a favorite room (Indico web API), host: "{instance}", path: "/rooms/api/user/favorite-rooms/*", methods: [DELETE], scopes: ["full:everything"] }
          - { id: prepare_event, description: "Prepares an event for you to review and create in Indico.", name: Prepare an event for me to create (Indico web API), host: "{instance}", path: /event/create/prepare, methods: [POST], scopes: ["full:everything"] }
    approvals:
      book_room:
        title: book a room
        fields:
          - { label: Room ID, source: body, steps: [ { form: roomid } ] }
          - { label: From, source: body, steps: [ { form: from } ] }
          - { label: From (f), source: body, steps: [ { form: f } ] }
          - { label: To, source: body, steps: [ { form: to } ] }
          - { label: To (t), source: body, steps: [ { form: t } ] }
          - { label: Time zone, source: body, steps: [ { form: tz } ] }
          - { label: Booked for, source: body, steps: [ { form: username } ] }
          - { label: Reason, source: body, steps: [ { form: reason } ] }
        link: "https://{request.host}/rooms/"
      create_booking:
        title: book a room
        fields:
          - { label: Room ID, source: body, steps: [ { json: /room_id } ] }
          - { label: Start, source: body, steps: [ { json: /start_dt } ] }
          - { label: End, source: body, steps: [ { json: /end_dt } ] }
          - { label: Repeats, source: body, steps: [ { json: /repeat_frequency } ] }
          - { label: Repeat interval, source: body, steps: [ { json: /repeat_interval } ] }
          - { label: Booked for, source: body, steps: [ { json: /user } ] }
          - { label: Reason, source: body, steps: [ { json: /reason } ] }
          - { label: Pre-booking, source: body, steps: [ { json: /is_prebooking } ] }
          - { label: Admin override, source: body, steps: [ { json: /admin_override_enabled } ] }
          - { label: Linked to, source: body, steps: [ { json: /link_type } ] }
          - { label: Linked id, source: body, steps: [ { json: /link_id } ] }
        link: "https://{request.host}/rooms/"
      cancel_booking:
        title: cancel a room booking
        fields:
          - { label: Booking, source: path, segment: 4 }
        link: "https://{request.host}/rooms/"
      cancel_booking_occurrence:
        title: cancel one date of a room booking
        fields:
          - { label: Booking, source: path, segment: 4 }
          - { label: Date, source: path, segment: 5 }
        link: "https://{request.host}/rooms/"
      add_favorite_user:
        title: add a favorite user
        fields:
          - { label: User, source: path, segment: 5 }
        link: "https://{request.host}/user/favorites/"
      remove_favorite_user:
        title: remove a favorite user
        fields:
          - { label: User, source: path, segment: 5 }
        link: "https://{request.host}/user/favorites/"
      add_favorite_category:
        title: add a favorite category
        fields:
          - { label: Category, source: path, segment: 5 }
        link: "https://{request.host}/user/favorites/"
      remove_favorite_category:
        title: remove a favorite category
        fields:
          - { label: Category, source: path, segment: 5 }
        link: "https://{request.host}/user/favorites/"
      add_favorite_event:
        title: add a favorite event
        fields:
          - { label: Event, source: path, segment: 5 }
        link: "https://{request.host}/user/favorites/"
      remove_favorite_event:
        title: remove a favorite event
        fields:
          - { label: Event, source: path, segment: 5 }
        link: "https://{request.host}/user/favorites/"
      add_favorite_room:
        title: add a favorite room
        fields:
          - { label: Room, source: path, segment: 5 }
        link: "https://{request.host}/rooms/"
      remove_favorite_room:
        title: remove a favorite room
        fields:
          - { label: Room, source: path, segment: 5 }
        link: "https://{request.host}/rooms/"
      prepare_event:
        title: prepare to create an event
        fields:
          - { label: Title, source: body, steps: [ { json: /title } ] }
          - { label: Start, source: body, steps: [ { json: /start_dt } ] }
          - { label: Time zone, source: body, steps: [ { json: /tz } ] }
          - { label: Duration, source: body, steps: [ { json: /duration } ] }
          - { label: Type, source: body, steps: [ { json: /event_type } ] }
    agent:
      instructions: |
        Indico is connected. Send requests to <address>, the address shown with the account (the
        Indico server this connection is registered for); Aurora adds the token. Never ask for one, never add ak, apikey, signature,
        timestamp or cookieauth, and never send this connection's requests to another host.
        Official API: /export/categ/<ids>.json (from, to, type, location, room, detail),
        /export/categ/favorites.json, /export/event/<id>.json (detail=contributions|sessions),
        /export/event/search/<term>.json, /export/timetable/<id>.json, /export/room/<loc>/<id>.json,
        /export/roomName/<loc>/<name>.json, /export/reservation/<loc>.json,
        /export/event/<id>/material/<folder>/<file>.bin, /api/user/ (id, email, names; no login).
        Free rooms (read:everything): GET /rooms/api/rooms/search?building=<b>&capacity=<n>
        &start_dt=<YYYY-MM-DDTHH:MM:SS>&end_dt=<...>&repeat_frequency=NEVER, one call per building.
        Always send repeat_frequency, or busy rooms come back too. It returns ids only: name them
        with GET /rooms/api/rooms/<id>. Times are the server's local time; with no end time assume
        one hour and say so.
        Book (write:legacy_api): POST /api/roomBooking/bookRoom.json, form: roomid, from, to (same
        day, YYYY-MM-DDTHH:MM), tz, reason, username = the person's Indico login, not the email
        (ask if unknown). Long names only. It cannot book rooms that need confirmation. With
        full:everything: POST /rooms/api/booking/create, JSON {room_id, start_dt, end_dt,
        repeat_frequency:"NEVER", reason, is_prebooking}; leave user out (it books for you).
        Never guess availability: if a scope is missing, say which one.
        /rooms/api/, /user/api/favorites/, /user/search/, /search/api/search and /event/create/prepare
        are internal to Indico: on a 404 or an unexpected shape, say so. Confirm room, time and
        person before booking; never retry a booking. Indico cannot create events by API: prepare
        one and give the user the link.
