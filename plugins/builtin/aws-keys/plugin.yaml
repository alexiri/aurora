package:
  id: aws-keys
  version: 1.1.0
  contract: 1
  min_core: 0.1.0
  publisher: aurora
  name: AWS (access keys)
  description: Amazon S3 objects, read-only EC2 Describe calls, GetCallerIdentity and other EC2 API calls signed with an IAM access key pair (AWS Signature Version 4)
  homepage: https://aws.amazon.com
apps:
  - about:
      id: aws-keys
      name: AWS (access keys)
      description: Work with S3 buckets and objects and query EC2, signed with an IAM access key pair
      category: cloud
      api_docs: https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html
      web_hosts: [console.aws.amazon.com]
      connect_note:
        text: "Use an IAM user or a temporary key pair with the narrowest policy you can. Requests are signed for the one region you enter; other regions need their own connection."
        url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
      label_hint: A name for these keys, such as the IAM user
    credentials:
      - { name: access_key_id, secret: true }
      - { name: secret_access_key, secret: true }
      - { name: session_token, secret: true, optional: true }
    metadata:
      - { name: region }
    connect:
      - id: keys
        kind: fields
        fields:
          - name: access_key_id
            label: Access key ID
            type: secret
            store: credentials
            required: true
            help_url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
          - name: secret_access_key
            label: Secret access key
            type: secret
            store: credentials
            required: true
          - name: session_token
            label: Session token (temporary credentials only)
            type: secret
            store: credentials
          - name: region
            label: Region
            type: text
            store: metadata
            required: true
            placeholder: "eu-west-1"
            help_url: https://docs.aws.amazon.com/general/latest/gr/rande.html
    hosts:
      - match: { host: "s3.*.amazonaws.com" }
        inject: []
        finalize:
          aws_sigv4:
            region: "{metadata.region}"
            service: s3
            access_key: "{credentials.access_key_id}"
            secret_key: "{credentials.secret_access_key}"
            session_token: "{credentials.session_token}"
      # STS (P4-GRANTS, D-124): AssumeRole, GetSessionToken and GetFederationToken answers carry
      # usable credentials (D-95), so the host is claimed ONLY to sign the one harmless action
      # GetCallerIdentity, matched by the `sts_get_caller_identity` tool (`params`). `grants.
      # block_untooled` below blocks every other STS request, even under a full grant.
      - match: { host: "sts.*.amazonaws.com" }
        inject: []
        finalize:
          aws_sigv4:
            region: "{metadata.region}"
            service: sts
            access_key: "{credentials.access_key_id}"
            secret_key: "{credentials.secret_access_key}"
            session_token: "{credentials.session_token}"
      - match: { host: "ec2.*.amazonaws.com" }
        inject: []
        finalize:
          aws_sigv4:
            region: "{metadata.region}"
            service: ec2
            access_key: "{credentials.access_key_id}"
            secret_key: "{credentials.secret_access_key}"
            session_token: "{credentials.session_token}"
    # Only catalogued tools may use these keys: a full grant never means "anything the keys can do".
    grants:
      block_untooled: true
    tools:
      read:
        items:
          - { id: s3_list_buckets, name: List buckets, host: "s3.*.amazonaws.com", path: /, methods: [GET] }
          - { id: s3_list_objects, name: List objects in a bucket, host: "s3.*.amazonaws.com", path: "/*", methods: [GET] }
          - { id: s3_get_object, name: Get or inspect an object, host: "s3.*.amazonaws.com", path: "/*/*/**", methods: [GET, HEAD] }
          # Read-only EC2 Describe* calls (Action in a form body). Declared before the generic
          # ec2_call, which keeps every other EC2 request (and every GET) as a held write tool.
          - id: ec2_describe
            name: Describe EC2 resources (read-only Describe* actions)
            host: "ec2.*.amazonaws.com"
            path: /
            methods: [POST]
            params: [ { source: form, name: Action, match: { prefix: Describe } } ]
          - id: sts_get_caller_identity
            name: Show which AWS identity the keys belong to (GetCallerIdentity)
            host: "sts.*.amazonaws.com"
            path: /
            methods: [POST]
            params: [ { source: form, name: Action, match: { equals: GetCallerIdentity } } ]
      write:
        items:
          - { id: s3_put_object, name: Upload or copy an object, host: "s3.*.amazonaws.com", path: "/*/*/**", methods: [PUT] }
          - { id: s3_delete_object, name: Delete an object, host: "s3.*.amazonaws.com", path: "/*/*/**", methods: [DELETE] }
          - { id: ec2_call, name: Call an EC2 action (for example DescribeInstances), host: "ec2.*.amazonaws.com", path: /, methods: [GET, POST] }
    approvals:
      s3_put_object:
        title: Upload S3 object
        fields:
          - { label: Bucket, source: path, segment: 1 }
          - { label: Key, source: path, segment: 2 }
        link: "https://console.aws.amazon.com/s3/"
      s3_delete_object:
        title: Delete S3 object
        fields:
          - { label: Bucket, source: path, segment: 1 }
          - { label: Key, source: path, segment: 2 }
        link: "https://console.aws.amazon.com/s3/"
      ec2_call:
        title: Call EC2 action
        fields:
          - { label: Action, source: query, name: Action }
          - { label: Action in form, source: body, steps: [ { form: Action } ] }
        link: "https://console.aws.amazon.com/ec2/"
    agent:
      instructions: |
        AWS is connected with an IAM access key pair for ONE region (the connection's region).
        Send requests straight to the regional endpoints; Aurora signs them (Signature Version 4)
        and never shows you a key, so do not use `aws configure` or an SDK credential chain.
        S3: use path-style URLs, https://s3.<region>.amazonaws.com/<bucket>/<key>; virtual-hosted
        bucket URLs are not covered. EC2 uses the Query API on https://ec2.<region>.amazonaws.com/
        with the Action and Version parameters (for example
        Action=DescribeInstances&Version=2016-11-15). Send the parameters as a POST body
        (content-type application/x-www-form-urlencoded), once each and not also in the query:
        read-only Describe* actions are then allowed without approval, and every other EC2 call
        (including any GET) is held for approval. STS: only POST Action=GetCallerIdentity to
        sts.<region>.amazonaws.com works; every other STS action is blocked. A request to a
        region other than the connection's will be signed for the wrong region and AWS will
        refuse it.
