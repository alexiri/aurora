# Write tools: a positive case with the approval summary and a `negative <tool>:` case each.
- name: "s3_put_object: summary shows bucket and key"
  connection:
    credentials: { access_key_id: "AKIDEXAMPLE", secret_access_key: "fixture-secret-key-1" }
    metadata: { region: eu-west-1 }
  request: { method: PUT, url: "https://s3.eu-west-1.amazonaws.com/example-bucket/reports/q1.txt", body: "hello" }
  expect:
    app: aws-keys
    tool: s3_put_object
    summary: { title: "Upload S3 object", fields: { Bucket: example-bucket, Key: reports } }
- name: "negative s3_put_object: PUT on the bucket (CreateBucket) selects no tool"
  connection:
    credentials: { access_key_id: "AKIDEXAMPLE", secret_access_key: "fixture-secret-key-1" }
    metadata: { region: eu-west-1 }
  request: { method: PUT, url: "https://s3.eu-west-1.amazonaws.com/example-bucket" }
  expect: { app: aws-keys }
- name: "s3_delete_object: summary shows bucket and key"
  connection:
    credentials: { access_key_id: "AKIDEXAMPLE", secret_access_key: "fixture-secret-key-1" }
    metadata: { region: eu-west-1 }
  request: { method: DELETE, url: "https://s3.eu-west-1.amazonaws.com/example-bucket/old.txt" }
  expect:
    tool: s3_delete_object
    summary: { title: "Delete S3 object", fields: { Bucket: example-bucket, Key: old.txt } }
- name: "negative s3_delete_object: DELETE on the bucket selects no tool"
  connection:
    credentials: { access_key_id: "AKIDEXAMPLE", secret_access_key: "fixture-secret-key-1" }
    metadata: { region: eu-west-1 }
  request: { method: DELETE, url: "https://s3.eu-west-1.amazonaws.com/example-bucket" }
  expect: { app: aws-keys }
- name: "ec2_call: action from the query"
  connection:
    credentials: { access_key_id: "AKIDEXAMPLE", secret_access_key: "fixture-secret-key-1" }
    metadata: { region: eu-west-1 }
  request: { method: GET, url: "https://ec2.eu-west-1.amazonaws.com/?Action=TerminateInstances&Version=2016-11-15" }
  expect:
    tool: ec2_call
    summary: { title: "Call EC2 action", fields: { Action: TerminateInstances } }
- name: "ec2_call: action from a form body"
  connection:
    credentials: { access_key_id: "AKIDEXAMPLE", secret_access_key: "fixture-secret-key-1" }
    metadata: { region: eu-west-1 }
  request:
    method: POST
    url: "https://ec2.eu-west-1.amazonaws.com/"
    headers: { content-type: application/x-www-form-urlencoded }
    body: "Action=RunInstances&Version=2016-11-15"
  expect:
    tool: ec2_call
    summary: { title: "Call EC2 action", fields: { "Action in form": RunInstances } }
- name: "negative ec2_call: DELETE selects no tool"
  connection:
    credentials: { access_key_id: "AKIDEXAMPLE", secret_access_key: "fixture-secret-key-1" }
    metadata: { region: eu-west-1 }
  request: { method: DELETE, url: "https://ec2.eu-west-1.amazonaws.com/" }
  expect: { app: aws-keys }
