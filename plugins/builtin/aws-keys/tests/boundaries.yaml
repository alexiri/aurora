# Credentials are used only on the declared hosts, and only the session credentials are used.
- name: "session credentials are not sent to a host the package does not declare"
  connection: &conn
    credentials:
      source_access_key_id: "AKIDFIXTURESRC0001"
      source_secret_access_key: "fixture-source-secret-1"
      access_key_id: "ASIDFIXTURE00001"
      secret_access_key: "fixture-session-secret-1"
      session_token: "fixture-session-token-1"
    metadata: { role_arn: "arn:aws:iam::123456789012:role/aurora-agent", region: eu-west-1, session_duration: "3600" }
  request: { method: GET, url: "https://s3.eu-west-1.amazonaws.com.evil.example.test/example-bucket/x" }
  expect:
    unmatched: true
- name: "the global STS endpoint is not declared, so nothing is signed for it"
  connection: *conn
  request: { method: GET, url: "https://sts.amazonaws.com/?Action=GetCallerIdentity&Version=2011-06-15" }
  expect:
    unmatched: true
- name: "a foreign host gets neither the session token nor a signature"
  connection: *conn
  request: { method: GET, url: "https://storage.example.test/example-bucket/x" }
  expect:
    unmatched: true
    upstream: { headers_absent: [authorization, x-amz-security-token, x-amz-date] }
- name: "the source key is never an upstream header, on any declared host"
  connection: *conn
  request: { method: GET, url: "https://s3.eu-west-1.amazonaws.com/example-bucket/logs/app.log" }
  expect:
    tool: s3_get_object
    upstream:
      headers: { x-amz-security-token: "fixture-session-token-1" }
      headers_absent: [x-amz-source-access-key-id, x-amz-source-secret-access-key, x-api-key]
