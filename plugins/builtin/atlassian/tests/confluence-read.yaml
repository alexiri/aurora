# Confluence Cloud read tools. REST API v2 is /ex/confluence/<cloudid>/wiki/api/v2; the search
# endpoint is the v1 /wiki/rest/api/search (v2 has none). All credentials and ids are fake.
# The connect probe (accessible-resources) needs a host entry of each cloud app. The gateway serves
# that exact path through the Jira Cloud app (longest prefix wins; see jira-read.yaml); the
# Confluence entry is the broader /oauth/token prefix, which no tool uses (FIX-118: it cannot be
# narrowed to the exact path, a tie goes to the smaller app id and would take the path from Jira).
- name: "boundary: the broader /oauth/token prefix of the Confluence entry injects the bearer and selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.atlassian.com/oauth/token/other" }
  expect:
    app: confluence
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
- name: "list_spaces: bearer is injected on the site API prefix"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/spaces?limit=25" }
  expect:
    app: confluence
    tool: list_spaces
    upstream: { url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/spaces?limit=25", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative list_spaces: DELETE selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/spaces" }
  expect: { app: confluence }
- name: "get_space"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/spaces/65537" }
  expect: { app: confluence, tool: get_space }
