- name: "list_issue_transitions"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.atlassian.com/ex/jira/site-fixture-1/rest/api/3/issue/DEMO-7/transitions" }
