- name: "negative host: the token is not injected on a host the app does not declare"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://example.atlassian.net/rest/api/3/myself" }
  expect: { unmatched: true }
- name: "negative host: the token is not injected on another path of api.atlassian.com"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.atlassian.com/admin/v1/orgs" }
  expect: { unmatched: true }
- name: "negative host: the Confluence prefix belongs to the Confluence app, not to Jira"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/spaces" }
  expect: { app: confluence, tool: list_spaces }
