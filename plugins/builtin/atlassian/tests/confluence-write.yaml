# Confluence Cloud write tools: a positive case with the approval summary and a `negative <tool>:`
# case each.
- name: "create_page: summary shows space, title and status"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/pages"
    headers: { content-type: application/json }
    body: '{"spaceId":"65537","status":"current","title":"Release runbook","body":{"representation":"storage","value":"<p>Steps</p>"}}'
  expect:
    app: confluence
    tool: create_page
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
    summary: { title: "Create Confluence page", fields: { Space: "65537", Title: "Release runbook", Status: "current", Content: "<p>Steps</p>" } }
- name: "negative create_page: PATCH selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/pages" }
  expect: { app: confluence }
- name: "update_page: summary shows the page, title and next version"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: PUT
    url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/pages/98765"
    headers: { content-type: application/json }
    body: '{"id":"98765","status":"current","title":"Release runbook v2","body":{"representation":"storage","value":"<p>New steps</p>"},"version":{"number":3}}'
  expect:
    app: confluence
    tool: update_page
    summary: { title: "Update Confluence page", fields: { Page: "98765", Title: "Release runbook v2", Version: "3", Content: "<p>New steps</p>" } }
- name: "negative update_page: PATCH selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/pages/98765" }
  expect: { app: confluence }
- name: "create_footer_comment: summary shows the page and the comment"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/footer-comments"
    headers: { content-type: application/json }
    body: '{"pageId":"98765","body":{"representation":"storage","value":"<p>Looks good</p>"}}'
  expect:
    app: confluence
    tool: create_footer_comment
    summary: { title: "Comment on Confluence page", fields: { Page: "98765", Comment: "<p>Looks good</p>" } }
- name: "negative create_footer_comment: DELETE selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://api.atlassian.com/ex/confluence/site-fixture-1/wiki/api/v2/footer-comments" }
  expect: { app: confluence }
