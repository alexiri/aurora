# Jira Data Center (D-74, D-91 pattern): a connection bound to a registered instance is served on
# that exact host only, with a personal access token as bearer. REST API v2 under /rest.
# `connection.instance_host` registers the instance for the case. All credentials are fake.
- name: "dc get_myself: bearer is injected on the registered host"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: GET, url: "https://jira.example.com/rest/api/2/myself" }
  expect:
    app: jira-dc
    tool: get_myself
    upstream: { url: "https://jira.example.com/rest/api/2/myself", headers: { authorization: "Bearer pat-fixture-1" } }
- name: "negative get_myself: DELETE selects no tool on the registered host"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: DELETE, url: "https://jira.example.com/rest/api/2/myself" }
  expect: { app: jira-dc }
- name: "dc list_projects"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: GET, url: "https://jira.example.com/rest/api/2/project" }
  expect: { app: jira-dc, tool: list_projects }
- name: "negative list_projects: POST (project creation) selects no tool on the registered host"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: POST, url: "https://jira.example.com/rest/api/2/project" }
  expect: { app: jira-dc }
- name: "dc get_project"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: GET, url: "https://jira.example.com/rest/api/2/project/DEMO" }
  expect: { app: jira-dc, tool: get_project }
- name: "negative get_project: DELETE selects no tool on the registered host"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: DELETE, url: "https://jira.example.com/rest/api/2/project/DEMO" }
  expect: { app: jira-dc }
- name: "dc search_issues: JQL in the query string"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: GET, url: "https://jira.example.com/rest/api/2/search?jql=project%20%3D%20DEMO&maxResults=20" }
  expect: { app: jira-dc, tool: search_issues }
- name: "negative search_issues: the POST form of the search is not offered on the registered host"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: POST, url: "https://jira.example.com/rest/api/2/search", headers: { content-type: application/json }, body: '{"jql":"project = DEMO"}' }
  expect: { app: jira-dc }
