- name: "dc create_issue: summary shows project, type and summary"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request:
    method: POST
    url: "https://jira.example.com/rest/api/2/issue"
    headers: { content-type: application/json }
    body: '{"fields":{"project":{"key":"DEMO"},"issuetype":{"name":"Bug"},"summary":"Crash on save","description":"Open a 2 GB file and save it."}}'
  expect:
    app: jira-dc
    tool: create_issue
    summary: { title: "Create Jira issue", fields: { Project: "DEMO", Type: "Bug", Summary: "Crash on save", Description: "Open a 2 GB file and save it." } }
- name: "negative create_issue: GET on the issue collection selects no tool on the registered host"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: GET, url: "https://jira.example.com/rest/api/2/issue" }
  expect: { app: jira-dc }
- name: "dc edit_issue: summary shows the issue, the new summary and a link on the registered host"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request:
    method: PUT
    url: "https://jira.example.com/rest/api/2/issue/DEMO-7"
    headers: { content-type: application/json }
    body: '{"fields":{"summary":"Crash on save of large files","description":"Only above 1 GB."}}'
  expect:
    app: jira-dc
    tool: edit_issue
    summary: { title: "Edit Jira issue", fields: { Issue: "DEMO-7", Summary: "Crash on save of large files", Description: "Only above 1 GB." } }
- name: "negative edit_issue: PATCH selects no tool on the registered host"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: PATCH, url: "https://jira.example.com/rest/api/2/issue/DEMO-7" }
  expect: { app: jira-dc }
- name: "dc add_issue_comment: summary shows the issue and the plain-text comment"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request:
    method: POST
    url: "https://jira.example.com/rest/api/2/issue/DEMO-7/comment"
    headers: { content-type: application/json }
    body: '{"body":"Reproduced on 9.12."}'
  expect:
    app: jira-dc
    tool: add_issue_comment
    summary: { title: "Comment on Jira issue", fields: { Issue: "DEMO-7", Comment: "Reproduced on 9.12." } }
- name: "negative add_issue_comment: PUT selects no tool on the registered host"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: PUT, url: "https://jira.example.com/rest/api/2/issue/DEMO-7/comment" }
  expect: { app: jira-dc }
- name: "dc transition_issue: summary shows the issue and the transition id"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request:
    method: POST
    url: "https://jira.example.com/rest/api/2/issue/DEMO-7/transitions"
    headers: { content-type: application/json }
    body: '{"transition":{"id":"41"}}'
  expect:
    app: jira-dc
    tool: transition_issue
    summary: { title: "Move Jira issue", fields: { Issue: "DEMO-7", Transition: "41" } }
- name: "negative transition_issue: DELETE selects no tool on the registered host"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: DELETE, url: "https://jira.example.com/rest/api/2/issue/DEMO-7/transitions" }
  expect: { app: jira-dc }
- name: "negative dc host: a host that is not the registered instance gets no Jira app match and nothing is injected"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: GET, url: "https://other.example.com/rest/api/2/myself" }
  expect: { unmatched: true }
- name: "negative dc host: a Jira instance connection is not injected on Atlassian Cloud"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: GET, url: "https://api.atlassian.com/ex/jira/site-fixture-1/rest/api/3/myself" }
  expect: { refused: host_mismatch, expected_host: jira.example.com }
- name: "negative dc host: outside /rest on the registered host nothing is injected"
  connection: { instance_host: jira.example.com, instance_app: jira-dc, credentials: { access_token: "pat-fixture-1" } }
  request: { method: GET, url: "https://jira.example.com/secure/ViewProfile.jspa" }
  expect: { unmatched: true }
