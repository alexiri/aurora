# Jira Cloud write tools: each has a positive case with its approval summary and a `negative <tool>:`
# case. Comment bodies in REST v3 are Atlassian Document Format; the summary shows the first text.
- name: "create_issue: summary shows project, type and summary"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.atlassian.com/ex/jira/site-fixture-1/rest/api/3/issue"
    headers: { content-type: application/json }
    body: '{"fields":{"project":{"key":"DEMO"},"issuetype":{"name":"Task"},"summary":"Fix the login page"}}'
  expect:
    app: jira
    tool: create_issue
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
    summary: { title: "Create Jira issue", fields: { Project: "DEMO", Type: "Task", Summary: "Fix the login page" } }
- name: "negative create_issue: GET on the issue collection selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://api.atlassian.com/ex/jira/site-fixture-1/rest/api/3/issue" }
  expect: { app: jira }
- name: "edit_issue: summary shows the issue and the new summary"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: PUT
    url: "https://api.atlassian.com/ex/jira/site-fixture-1/rest/api/3/issue/DEMO-7"
    headers: { content-type: application/json }
    body: '{"fields":{"summary":"Fix the login page redirect"}}'
  expect:
    app: jira
    tool: edit_issue
    summary: { title: "Edit Jira issue", fields: { Issue: "DEMO-7", Summary: "Fix the login page redirect" } }
- name: "negative edit_issue: PATCH selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://api.atlassian.com/ex/jira/site-fixture-1/rest/api/3/issue/DEMO-7" }
  expect: { app: jira }
- name: "add_issue_comment: summary shows the issue and the comment text"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.atlassian.com/ex/jira/site-fixture-1/rest/api/3/issue/DEMO-7/comment"
    headers: { content-type: application/json }
    body: '{"body":{"type":"doc","version":1,"content":[{"type":"paragraph","content":[{"type":"text","text":"Deployed to staging."}]}]}}'
  expect:
    app: jira
    tool: add_issue_comment
    summary: { title: "Comment on Jira issue", fields: { Issue: "DEMO-7", Comment: "Deployed to staging." } }
- name: "negative add_issue_comment: PUT selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PUT, url: "https://api.atlassian.com/ex/jira/site-fixture-1/rest/api/3/issue/DEMO-7/comment" }
  expect: { app: jira }
- name: "transition_issue: summary shows the issue and the transition id"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://api.atlassian.com/ex/jira/site-fixture-1/rest/api/3/issue/DEMO-7/transitions"
    headers: { content-type: application/json }
    body: '{"transition":{"id":"31"}}'
  expect:
    app: jira
    tool: transition_issue
    summary: { title: "Move Jira issue", fields: { Issue: "DEMO-7", Transition: "31" } }
- name: "negative transition_issue: DELETE selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://api.atlassian.com/ex/jira/site-fixture-1/rest/api/3/issue/DEMO-7/transitions" }
  expect: { app: jira }
