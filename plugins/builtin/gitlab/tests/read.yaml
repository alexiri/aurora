# Read tools: each has a positive case and a `negative <tool>:` case. All credentials are fake.
- name: "get_current_user: bearer is injected on the API host"
  connection: { credentials: { access_token: "tok-fixture-1" }, metadata: { username: "alice-example" } }
  request: { method: GET, url: "https://gitlab.com/api/v4/user" }
  expect:
    app: gitlab
    tool: get_current_user
    upstream: { url: "https://gitlab.com/api/v4/user", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative get_current_user: PATCH selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://gitlab.com/api/v4/user" }
  expect: { app: gitlab }
- name: "agent supplied authorization is overwritten"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: GET
    url: "https://gitlab.com/api/v4/user"
    headers: { authorization: "Bearer agent-guess" }
  expect:
    tool: get_current_user
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
