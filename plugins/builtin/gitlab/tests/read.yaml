- name: "git_fetch: ref advertisement uses basic auth on the git paths"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://gitlab.com/group/sub/demo.git/info/refs?service=git-upload-pack" }
  expect:
    app: gitlab
    tool: git_fetch
    # base64 of "oauth2:tok-fixture-1"
    upstream: { headers: { authorization: "Basic b2F1dGgyOnRvay1maXh0dXJlLTE=" } }
- name: "git_fetch: upload-pack"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://gitlab.com/group/demo.git/git-upload-pack" }
  expect: { tool: git_fetch }
- name: "negative git_fetch: a plain web page is not a git operation"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://gitlab.com/group/demo/-/issues" }
  expect: { app: gitlab }
- name: "negative git_fetch: another GitLab host is not claimed"
  request: { method: GET, url: "https://registry.gitlab.com/v2/" }
  expect: { unmatched: true }
