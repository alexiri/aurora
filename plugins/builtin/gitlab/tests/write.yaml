# Write tools: each has a positive case with its approval summary and a `negative <tool>:` case.
- name: "create_issue: summary shows project and title"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: POST
    url: "https://gitlab.com/api/v4/projects/42/issues"
    headers: { content-type: application/json }
    body: '{"title":"Fix the login redirect","description":"Steps to reproduce"}'
  expect:
    app: gitlab
    tool: create_issue
    summary: { title: "Create issue", fields: { Project: "42", Title: "Fix the login redirect" } }
- name: "negative create_issue: PATCH selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://gitlab.com/api/v4/projects/42/issues" }
  expect: { app: gitlab }
- name: "update_issue: closing"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: PUT
    url: "https://gitlab.com/api/v4/projects/42/issues/7"
    headers: { content-type: application/json }
    body: '{"state_event":"close"}'
  expect:
    tool: update_issue
    summary: { title: "Update issue", fields: { Project: "42", Issue: "7", Change: "close" } }
- name: "negative update_issue: PATCH selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://gitlab.com/api/v4/projects/42/issues/7" }
  expect: { app: gitlab }
