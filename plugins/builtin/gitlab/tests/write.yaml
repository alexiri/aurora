- name: "git_push: receive-pack is the write tool and uses basic auth"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://gitlab.com/group/demo.git/git-receive-pack" }
  expect:
    tool: git_push
    upstream: { headers: { authorization: "Basic b2F1dGgyOnRvay1maXh0dXJlLTE=" } }
    summary: { title: "Push code", fields: { "Group or user": "group" } }
- name: "negative git_push: upload-pack is a fetch, not a push"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://gitlab.com/group/demo.git/git-upload-pack" }
  expect: { app: gitlab, tool: git_fetch }
# Token lifecycle: the gateway refreshes the OAuth token (oauth2_refresh) and stores the new
# access token; what the package must guarantee is that the stored field is the one injected.
- name: "token: a refreshed OAuth access token is what gets injected"
  connection: { credentials: { access_token: "oauth-fixture-2", refresh_token: "refresh-fixture-2" }, metadata: { username: "alice-example" } }
  request: { method: GET, url: "https://gitlab.com/api/v4/projects/42/issues" }
  expect:
    tool: list_issues
    upstream: { headers: { authorization: "Bearer oauth-fixture-2" } }
