package:
  id: gitlab
  version: 1.2.3
  contract: 1
  min_core: 0.1.0
  publisher: aurora
  name: GitLab
  description: Projects, issues, merge requests, pipelines and repository files on gitlab.com and self-managed GitLab instances (REST API v4 and git over HTTPS)
  homepage: https://gitlab.com
oauth_clients:
  - id: gitlab
    authorize_url: "https://{instance}/oauth/authorize"
    token_url: "https://{instance}/oauth/token"
    pkce: true
    client_auth: body
    body_format: form
    fields:
      - { name: client_id, label: Application ID }
      - { name: client_secret, label: Secret, secret: true }
    setup_note: "In GitLab open User settings, Applications, and add an application. Mark it Confidential, tick only the scopes you will offer, and register the Aurora redirect URI. Every GitLab instance (gitlab.com or a self-managed one) has its own application."
apps:
  - about:
      id: gitlab
      name: GitLab
      description: Work with projects, issues, merge requests, pipelines and repository files on gitlab.com or a self-managed GitLab
      category: development
      api_docs: https://docs.gitlab.com/api/rest/
      api_spec: https://gitlab.com/gitlab-org/gitlab/-/raw/master/doc/api/openapi/openapi_v2.yaml
      web_hosts: [gitlab.com]
      connect_note:
        text: "Connects to gitlab.com by default. For a self-managed GitLab, an administrator registers the server first (Self-hosted apps), then choose it when connecting."
        url: https://docs.gitlab.com/api/rest/
      label_hint: GitLab username
    instances:
      label: GitLab instance
      default_host: gitlab.com
      probe: { method: GET, path: /api/v4/version, expect_status: [200, 401] }
    credentials:
      - { name: access_token, secret: true }
      - { name: refresh_token, secret: true, optional: true }
    metadata:
      - { name: username }
    connect:
      - id: token
        kind: fields
        label: Personal access token
        description: "A token you create in GitLab (User settings, Access tokens). Pick the narrowest scopes and an expiry date; a project or group access token limits the reach to one project or group."
        fields:
          - name: access_token
            label: Access token
            type: secret
            store: credentials
            required: true
            placeholder: "glpat-…"
            help_url: https://gitlab.com/-/user_settings/personal_access_tokens
        probe:
          method: GET
          url: "https://{instance}/api/v4/user"
          expect_status: [200]
          label: /username
          metadata: { username: /username }
      - id: oauth
        kind: oauth2
        label: Sign in with GitLab
        description: "You sign in to GitLab and Aurora gets a token that renews itself. Needs an OAuth client registered for this GitLab first; a self-managed server must be registered before anyone can sign in to it."
        client: gitlab
        scopes:
          - { scope: read_user, name: Read your profile, access: read }
          - { scope: read_api, name: "Read projects, issues, merge requests and pipelines", access: read }
          - { scope: read_repository, name: Read repository files and clone over HTTPS, access: read }
          - { scope: api, name: "Full API access (create and change issues, merge requests, pipelines)", access: write }
          - { scope: write_repository, name: Push code over HTTPS, access: write }
        default_scopes: [read_user, read_api, read_repository]
        callback: query
        token_response:
          access_token: /access_token
          refresh_token: /refresh_token
          expires_in: /expires_in
          scope: /scope
        probe:
          method: GET
          url: "https://{instance}/api/v4/user"
          expect_status: [200]
          label: /username
          metadata: { username: /username }
    hosts:
      - match: { host: "{instance}", path_prefix: /api/v4 }
        inject:
          - bearer: "{credentials.access_token}"
      - match: { host: "{instance}" }
        inject:
          - basic: { user: oauth2, password: "{credentials.access_token}" }
    library:
      repo_pattern: "^[A-Za-z0-9_.-]{1,100}(/[A-Za-z0-9_.-]{1,100}){1,19}$"
      request_host: "{instance}"
      resolve_ref:
        path: "/api/v4/projects/{repo|urlencode}/repository/commits/{ref|urlencode}"
        default_path: "/api/v4/projects/{repo|urlencode}"
        sha: "$.id"
        default_branch: "$.default_branch"
      list_tree:
        path: "/api/v4/projects/{repo|urlencode}/repository/tree?recursive=true&per_page=100&ref={sha}"
        entries: "$[*]"
        fields: { path: "$.path", type: "$.type", mode: "$.mode", blob: "$.id" }
        file_type: blob
        paginate: link_header
        max_pages: 200
      get_blob:
        path: "/api/v4/projects/{repo|urlencode}/repository/blobs/{blob}/raw"
        encoding: raw
      required_access: read
    token:
      kind: oauth2_refresh
      client: gitlab
      refresh_field: refresh_token
      rotate_refresh_token: true
      max_lifetime_secs: 7200
      stale_codes:
        - { status: 401, body_contains: invalid_token }
      reauth_codes: [invalid_grant]
    tools:
      read:
        items:
          - { id: get_current_user, description: "Shows the GitLab account Aurora is connected as.", name: Get the connected user, host: "{instance}", path: /api/v4/user, methods: [GET] }
          - { id: list_projects, description: "Lists the projects you can see.", name: List projects, host: "{instance}", path: /api/v4/projects, methods: [GET] }
          - { id: get_project, description: "Reads one project.", name: Get a project, host: "{instance}", path: "/api/v4/projects/*", methods: [GET] }
          - { id: list_groups, description: "Lists the groups you can see.", name: List groups, host: "{instance}", path: /api/v4/groups, methods: [GET] }
          - { id: list_issues, description: "Lists the issues of a project.", name: List issues, host: "{instance}", path: "/api/v4/projects/*/issues", methods: [GET] }
          - { id: get_issue, description: "Reads one issue.", name: Get an issue, host: "{instance}", path: "/api/v4/projects/*/issues/*", methods: [GET] }
          - { id: list_issue_notes, description: "Lists the comments on an issue.", name: List issue comments, host: "{instance}", path: "/api/v4/projects/*/issues/*/notes", methods: [GET] }
          - { id: list_merge_requests, description: "Lists the merge requests of a project.", name: List merge requests, host: "{instance}", path: "/api/v4/projects/*/merge_requests", methods: [GET] }
          - { id: get_merge_request, description: "Reads one merge request.", name: Get a merge request, host: "{instance}", path: "/api/v4/projects/*/merge_requests/*", methods: [GET] }
          - { id: get_merge_request_diffs, description: "Reads the changes in a merge request.", name: Get merge request changes, host: "{instance}", path: "/api/v4/projects/*/merge_requests/*/diffs", methods: [GET] }
          - { id: list_merge_request_notes, description: "Lists the comments on a merge request.", name: List merge request comments, host: "{instance}", path: "/api/v4/projects/*/merge_requests/*/notes", methods: [GET] }
          - { id: list_pipelines, description: "Lists the pipelines of a project.", name: List pipelines, host: "{instance}", path: "/api/v4/projects/*/pipelines", methods: [GET] }
          - { id: get_pipeline, description: "Reads one pipeline.", name: Get a pipeline, host: "{instance}", path: "/api/v4/projects/*/pipelines/*", methods: [GET] }
          - { id: list_pipeline_jobs, description: "Lists the jobs of a pipeline.", name: List pipeline jobs, host: "{instance}", path: "/api/v4/projects/*/pipelines/*/jobs", methods: [GET] }
          - { id: get_job_log, description: "Reads the log of a pipeline job.", name: Read a job log, host: "{instance}", path: "/api/v4/projects/*/jobs/*/trace", methods: [GET] }
          - { id: list_repository_tree, description: "Lists the files and folders of a repository.", name: List repository files, host: "{instance}", path: "/api/v4/projects/*/repository/tree", methods: [GET] }
          - { id: get_repository_file, description: "Reads a repository file with its details.", name: Get a repository file, host: "{instance}", path: "/api/v4/projects/*/repository/files/*", methods: [GET] }
          - { id: get_repository_file_raw, description: "Downloads the raw content of a repository file.", name: Get a repository file (raw), host: "{instance}", path: "/api/v4/projects/*/repository/files/*/raw", methods: [GET] }
          - { id: list_branches, description: "Lists the branches of a repository.", name: List branches, host: "{instance}", path: "/api/v4/projects/*/repository/branches", methods: [GET] }
          - { id: list_commits, description: "Lists the commits of a repository.", name: List commits, host: "{instance}", path: "/api/v4/projects/*/repository/commits", methods: [GET] }
          - { id: search_projects, description: "Searches for projects by name.", name: Search a project, host: "{instance}", path: "/api/v4/projects/*/search", methods: [GET] }
          - { id: git_fetch, description: "Clones or fetches a repository over HTTPS.", name: Clone and fetch over HTTPS, host: "{instance}", path: "/**", methods: [GET, POST], git: fetch }
      write:
        items:
          - { id: create_issue, description: "Opens a new issue.", name: Create an issue, host: "{instance}", path: "/api/v4/projects/*/issues", methods: [POST] }
          - { id: update_issue, description: "Edits or closes an issue.", name: Update or close an issue, host: "{instance}", path: "/api/v4/projects/*/issues/*", methods: [PUT] }
          - { id: create_issue_note, description: "Adds a comment to an issue.", name: Comment on an issue, host: "{instance}", path: "/api/v4/projects/*/issues/*/notes", methods: [POST] }
          - { id: create_merge_request, description: "Opens a merge request.", name: Create a merge request, host: "{instance}", path: "/api/v4/projects/*/merge_requests", methods: [POST] }
          - { id: update_merge_request, description: "Edits or closes a merge request.", name: Update or close a merge request, host: "{instance}", path: "/api/v4/projects/*/merge_requests/*", methods: [PUT] }
          - { id: merge_merge_request, description: "Merges a merge request.", name: Merge a merge request, host: "{instance}", path: "/api/v4/projects/*/merge_requests/*/merge", methods: [PUT] }
          - { id: create_merge_request_note, description: "Adds a comment to a merge request.", name: Comment on a merge request, host: "{instance}", path: "/api/v4/projects/*/merge_requests/*/notes", methods: [POST] }
          - { id: create_pipeline, description: "Starts a pipeline.", name: Run a pipeline, host: "{instance}", path: "/api/v4/projects/*/pipeline", methods: [POST] }
          - { id: retry_pipeline, description: "Runs the failed jobs of a pipeline again.", name: Retry a pipeline, host: "{instance}", path: "/api/v4/projects/*/pipelines/*/retry", methods: [POST] }
          - { id: cancel_pipeline, description: "Stops a running pipeline.", name: Cancel a pipeline, host: "{instance}", path: "/api/v4/projects/*/pipelines/*/cancel", methods: [POST] }
          - { id: create_branch, description: "Creates a branch.", name: Create a branch, host: "{instance}", path: "/api/v4/projects/*/repository/branches", methods: [POST] }
          - { id: delete_branch, description: "Deletes a branch.", name: Delete a branch, host: "{instance}", path: "/api/v4/projects/*/repository/branches/*", methods: [DELETE] }
          - { id: create_commit, description: "Commits changes to one or more files.", name: Commit file changes, host: "{instance}", path: "/api/v4/projects/*/repository/commits", methods: [POST] }
          - { id: write_repository_file, description: "Creates, changes or deletes a file in a repository.", name: "Create, change or delete a repository file", host: "{instance}", path: "/api/v4/projects/*/repository/files/*", methods: [POST, PUT, DELETE] }
          - { id: git_push, description: "Pushes commits to a repository over HTTPS.", name: Push code over HTTPS, host: "{instance}", path: "/**", methods: [GET, POST], git: push }
    approvals:
      create_issue:
        title: create an issue
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Title, source: body, steps: [ { json: /title } ] }
        link: "https://{request.host}/dashboard/issues"
      update_issue:
        title: update an issue
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Issue, source: path, segment: 6 }
          - { label: Change, source: body, steps: [ { json: /state_event } ] }
      create_issue_note:
        title: comment on an issue
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Issue, source: path, segment: 6 }
          - { label: Comment, source: body, steps: [ { json: /body } ] }
      create_merge_request:
        title: create a merge request
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Title, source: body, steps: [ { json: /title } ] }
          - { label: From, source: body, steps: [ { json: /source_branch } ] }
          - { label: Into, source: body, steps: [ { json: /target_branch } ] }
        link: "https://{request.host}/dashboard/merge_requests"
      update_merge_request:
        title: update a merge request
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Merge request, source: path, segment: 6 }
          - { label: Change, source: body, steps: [ { json: /state_event } ] }
      merge_merge_request:
        title: merge a merge request
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Merge request, source: path, segment: 6 }
      create_merge_request_note:
        title: comment on a merge request
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Merge request, source: path, segment: 6 }
          - { label: Comment, source: body, steps: [ { json: /body } ] }
      create_pipeline:
        title: run a pipeline
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Ref, source: query, name: ref }
      retry_pipeline:
        title: retry a pipeline
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Pipeline, source: path, segment: 6 }
      cancel_pipeline:
        title: cancel a pipeline
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Pipeline, source: path, segment: 6 }
      create_branch:
        title: create a branch
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Branch, source: body, steps: [ { json: /branch } ] }
          - { label: From, source: body, steps: [ { json: /ref } ] }
      delete_branch:
        title: delete a branch
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Branch, source: path, segment: 7 }
      create_commit:
        title: commit changes
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: Branch, source: body, steps: [ { json: /branch } ] }
          - { label: Message, source: body, steps: [ { json: /commit_message } ] }
      write_repository_file:
        title: change a file in a repository
        fields:
          - { label: Project, source: path, segment: 4 }
          - { label: File, source: path, segment: 7 }
          - { label: Branch, source: body, steps: [ { json: /branch } ] }
          - { label: Message, source: body, steps: [ { json: /commit_message } ] }
      git_push:
        title: push code
        fields:
          - { label: Group or user, source: path, segment: 1 }
    agent:
      instructions: |
        GitLab is connected. Use the REST API v4 at <address>/api/v4, where <address> is the address
        shown with the account (gitlab.com, or the self-managed instance it was registered for), and
        git over HTTPS (clone URLs of the form <address>/<group>/<project>.git). Aurora adds the
        credentials; never ask for or write a token, and never send a request for one GitLab
        connection to another host. Address a project by its numeric id or by its full path with
        slashes encoded as %2F, for example group%2Fsubgroup%2Fproject. Send request bodies as
        JSON so approvals can show what a change does.
