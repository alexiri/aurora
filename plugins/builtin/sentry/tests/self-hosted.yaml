# Self-hosted Sentry (app `sentry-self-hosted`, instance-bound, D-74): every case registers the
# instance `sentry.example.com`. Each tool has a positive case and a `negative <tool>:` case. The
# token is injected on that host only. All credentials are fake.
- name: "list_organizations: bearer is injected on the registered instance"
  connection: { instance_host: sentry.example.com, credentials: { access_token: "tok-fixture-1" }, metadata: { org_slug: "example-org" } }
  request: { method: GET, url: "https://sentry.example.com/api/0/organizations/" }
  expect:
    app: sentry-self-hosted
    tool: list_organizations
    upstream: { url: "https://sentry.example.com/api/0/organizations/", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative list_organizations: DELETE selects no tool"
  connection: { instance_host: sentry.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://sentry.example.com/api/0/organizations/" }
  expect: { app: sentry-self-hosted }
- name: "get_organization"
  connection: { instance_host: sentry.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://sentry.example.com/api/0/organizations/example-org/" }
  expect: { app: sentry-self-hosted, tool: get_organization }
- name: "negative get_organization: DELETE selects no tool"
  connection: { instance_host: sentry.example.com, credentials: { access_token: "tok-fixture-1" } }
