- name: "update_issue: resolving an issue shows the status and links to the instance"
  connection: { instance_host: sentry.example.com, credentials: { access_token: "tok-fixture-1" } }
  request:
    method: PUT
    url: "https://sentry.example.com/api/0/organizations/example-org/issues/1234/"
    headers: { content-type: application/json }
    body: '{"status":"resolved"}'
  expect:
    app: sentry-self-hosted
    tool: update_issue
    summary: { title: "Update issue", fields: { Organization: example-org, Issue: "1234", Status: resolved } }
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative update_issue: PATCH selects no tool"
  connection: { instance_host: sentry.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://sentry.example.com/api/0/organizations/example-org/issues/1234/" }
  expect: { app: sentry-self-hosted }
- name: "negative instance: a connection of the instance is refused on sentry.io"
  connection: { instance_host: sentry.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://sentry.io/api/0/organizations/" }
  expect: { refused: host_mismatch, expected_host: sentry.example.com }
- name: "negative instance: a connection of the instance is refused on the US region host"
  connection: { instance_host: sentry.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://us.sentry.io/api/0/organizations/example-org/" }
  expect: { refused: host_mismatch, expected_host: sentry.example.com }
- name: "negative instance: a connection of the instance is not injected on another host"
  connection: { instance_host: sentry.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://sentry.other.example/api/0/organizations/" }
  expect: { unmatched: true }
- name: "negative instance: an unregistered host injects nothing"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://sentry.example.com/api/0/organizations/" }
  expect: { unmatched: true }
- name: "negative instance: the token is not injected outside /api/0 on the instance"
  connection: { instance_host: sentry.example.com, credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://sentry.example.com/settings/account/api/auth-tokens/" }
  expect:
    upstream: { headers_absent: [authorization] }
