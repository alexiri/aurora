- name: "update_issue: resolving an issue is a write tool whose summary shows the status"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: PUT
    url: "https://sentry.io/api/0/organizations/example-org/issues/1234/"
    headers: { content-type: application/json }
    body: '{"status":"resolved"}'
  expect:
    app: sentry
    tool: update_issue
    summary: { title: "Update issue", fields: { Organization: example-org, Issue: "1234", Status: resolved } }
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
- name: "update_issue: assigning an issue shows the assignee"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: PUT
    url: "https://sentry.io/api/0/organizations/example-org/issues/1234/"
    headers: { content-type: application/json }
    body: '{"assignedTo":"user:42"}'
  expect:
    tool: update_issue
    summary: { title: "Update issue", fields: { "Assigned to": "user:42" } }
- name: "negative update_issue: PATCH selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://sentry.io/api/0/organizations/example-org/issues/1234/" }
  expect: { app: sentry }
- name: "negative update_issue: PUT on the organization selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PUT, url: "https://sentry.io/api/0/organizations/example-org/" }
  expect: { app: sentry }
- name: "negative: the token is not injected on a lookalike host"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://sentry.io.evil.example/api/0/organizations/" }
  expect: { unmatched: true }
- name: "negative: the token is not injected on docs.sentry.io"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://docs.sentry.io/api/0/organizations/" }
  expect: { unmatched: true }
- name: "negative: the token is not injected outside /api/0 on sentry.io"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://sentry.io/settings/account/api/auth-tokens/" }
  expect:
    upstream: { headers_absent: [authorization] }
