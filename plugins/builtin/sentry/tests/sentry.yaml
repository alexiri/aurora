# Sentry SaaS on sentry.io (app `sentry`): read tools, the issue update write tool and host rules.
# Each tool has a positive case and a `negative <tool>:` case. All credentials are fake.
- name: "list_organizations: bearer is injected on sentry.io"
  connection: { credentials: { access_token: "tok-fixture-1" }, metadata: { org_slug: "example-org" } }
  request: { method: GET, url: "https://sentry.io/api/0/organizations/" }
  expect:
    app: sentry
    tool: list_organizations
    upstream: { url: "https://sentry.io/api/0/organizations/", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative list_organizations: DELETE selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://sentry.io/api/0/organizations/" }
  expect: { app: sentry }
- name: "agent supplied authorization is overwritten"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: GET
    url: "https://sentry.io/api/0/organizations/"
    headers: { authorization: "Bearer agent-guess" }
  expect: { tool: list_organizations, upstream: { headers: { authorization: "Bearer tok-fixture-1" } } }
