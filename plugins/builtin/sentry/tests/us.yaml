- name: "update_issue: resolving an issue is a write tool whose summary shows the status"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: PUT
    url: "https://us.sentry.io/api/0/organizations/example-org/issues/1234/"
    headers: { content-type: application/json }
    body: '{"status":"resolved"}'
  expect:
    app: sentry-us
    tool: update_issue
    summary: { title: "Update issue", fields: { Organization: example-org, Issue: "1234", Status: resolved } }
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative update_issue: PATCH selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://us.sentry.io/api/0/organizations/example-org/issues/1234/" }
  expect: { app: sentry-us }
- name: "negative: the token is not injected on a lookalike host"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://us.sentry.io.evil.example/api/0/organizations/example-org/" }
  expect: { unmatched: true }
- name: "negative: the token is not injected on another region host"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://eu.sentry.io/api/0/organizations/example-org/" }
  expect: { unmatched: true }
- name: "negative: the token is not injected outside /api/0 on us.sentry.io"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://us.sentry.io/settings/account/api/auth-tokens/" }
  expect:
    upstream: { headers_absent: [authorization] }
