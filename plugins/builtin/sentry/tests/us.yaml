# Sentry US region (app `sentry-us`, host us.sentry.io). Each tool has a positive case and a
# `negative <tool>:` case. All credentials are fake.
- name: "get_organization: bearer is injected on us.sentry.io"
  connection: { credentials: { access_token: "tok-fixture-1" }, metadata: { org_slug: "example-org" } }
  request: { method: GET, url: "https://us.sentry.io/api/0/organizations/example-org/" }
  expect:
    app: sentry-us
    tool: get_organization
    upstream: { url: "https://us.sentry.io/api/0/organizations/example-org/", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative get_organization: DELETE selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: DELETE, url: "https://us.sentry.io/api/0/organizations/example-org/" }
  expect: { app: sentry-us }
- name: "negative us region: listing organizations is not offered on the region host"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://us.sentry.io/api/0/organizations/" }
  expect: { app: sentry-us }
