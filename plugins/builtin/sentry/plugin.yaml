package:
  id: sentry
  version: 2.1.0
  contract: 1
  min_core: 0.1.0
  publisher: aurora
  name: Sentry
  description: Organizations, projects, issues, events and releases on Sentry SaaS (sentry.io and its US and DE regions) and on self-hosted Sentry servers, connected with an auth token; resolving and updating issues is a separate, approved permission
  homepage: https://sentry.io
apps:
  - about:
      id: sentry
      name: Sentry
      description: Read organizations, projects, issues, events and releases on Sentry, and update or resolve issues when you allow it
      category: monitoring
      api_docs: https://docs.sentry.io/api/
      web_hosts: [sentry.io]
      connect_note:
        text: "Choose where your Sentry organization lives: sentry.io, the US region or the EU (DE) region (Organization settings, Data Storage Location shows which), or a self-hosted server an administrator registered."
        url: https://docs.sentry.io/api/guides/create-auth-token/
      label_hint: Sentry organization slug
    instances:
      label: Sentry server
      default_host: sentry.io
      presets:
        - { host: us.sentry.io, label: US region }
        - { host: de.sentry.io, label: EU region (DE) }
      probe: { method: GET, path: /api/0/, expect_status: [200] }
    credentials:
      - { name: access_token, secret: true }
    metadata:
      - { name: org_slug }
      - { name: project_slug }
    connect:
      - id: token
        kind: fields
        label: Auth token
        description: "An internal integration token or a personal auth token from Sentry, with the organization it belongs to. Give it only the scopes agents need."
        fields:
          - name: access_token
            label: Auth token
            type: secret
            store: credentials
            required: true
            placeholder: "Internal integration or personal auth token"
            help_url: https://docs.sentry.io/api/guides/create-auth-token/
          - name: org_slug
            label: Organization slug
            type: text
            store: metadata
            required: true
            placeholder: "my-org"
          - name: project_slug
            label: Default project slug (optional)
            type: text
            store: metadata
            required: false
            placeholder: "my-project"
        probe:
          method: GET
          url: "https://{instance}/api/0/organizations/{fields.org_slug}/projects/"
          expect_status: [200]
    hosts:
      - match: { host: "{instance}", path_prefix: /api/0 }
        inject:
          - bearer: "{credentials.access_token}"
    tools:
      read:
        items:
          - { id: list_organizations, description: "Lists the Sentry organizations the token can see.", name: List the organizations the token can see, host: "{instance}", path: /api/0/organizations/, methods: [GET] }
          - { id: get_organization, description: "Reads one Sentry organization.", name: Get an organization, host: "{instance}", path: "/api/0/organizations/*/", methods: [GET] }
          - { id: list_projects, description: "Lists an organization's projects.", name: List an organization's projects, host: "{instance}", path: "/api/0/organizations/*/projects/", methods: [GET] }
          - { id: get_project, description: "Reads one project.", name: Get a project, host: "{instance}", path: "/api/0/projects/*/*/", methods: [GET] }
          - { id: list_issues, description: "Lists an organization's issues.", name: List an organization's issues, host: "{instance}", path: "/api/0/organizations/*/issues/", methods: [GET] }
          - { id: get_issue, description: "Reads one issue.", name: Get an issue, host: "{instance}", path: "/api/0/organizations/*/issues/*/", methods: [GET] }
          - { id: list_issue_events, description: "Lists the events of an issue.", name: List an issue's events, host: "{instance}", path: "/api/0/organizations/*/issues/*/events/", methods: [GET] }
          - { id: get_issue_event, description: "Reads one event of an issue.", name: Get one event of an issue, host: "{instance}", path: "/api/0/organizations/*/issues/*/events/*/", methods: [GET] }
          - { id: list_releases, description: "Lists an organization's releases.", name: List an organization's releases, host: "{instance}", path: "/api/0/organizations/*/releases/", methods: [GET] }
          - { id: get_release, description: "Reads one release.", name: Get a release, host: "{instance}", path: "/api/0/organizations/*/releases/*/", methods: [GET] }
      write:
        items:
          - { id: update_issue, description: "Changes an issue: resolve it, assign it, or bookmark it.", name: "Update or resolve an issue (status, assignee, bookmarks)", host: "{instance}", path: "/api/0/organizations/*/issues/*/", methods: [PUT] }
    approvals:
      update_issue:
        title: update an issue
        fields:
          - { label: Organization, source: path, segment: 4 }
          - { label: Issue, source: path, segment: 6 }
          - { label: Status, source: body, steps: [ { json: /status } ] }
          - { label: Assigned to, source: body, steps: [ { json: /assignedTo } ] }
        link: "https://{request.host}/organizations/{path.4}/issues/{path.6}/"
    agent:
      summary: "Sentry issues, events and projects: find unresolved issues, read a stack trace, resolve an issue."
      instructions: |
        Sentry is connected. Use the API at the address shown with the account: https://sentry.io,
        https://us.sentry.io (US region), https://de.sentry.io (EU region) or a self-hosted server
        (for example <address>/api/0/organizations/<org>/issues/?query=is:unresolved); paths end
        with a slash. Aurora adds the token; never ask for or write one, and never send this
        connection's requests to another host: a token only works on the host of its
        organization's region. Page through results with the cursor in the Link response header.
        Listing the organizations a token can see is only served on sentry.io and self-hosted
        servers; on a region host the organization slug is in the connection's metadata. Send JSON
        bodies for changes so approvals can show what changes; resolving an issue is PUT with
        {"status":"resolved"}.
