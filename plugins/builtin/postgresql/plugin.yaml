package:
  id: postgresql
  version: 1.3.0
  contract: 1
  min_core: 0.1.0
  publisher: aurora
  name: PostgreSQL
  description: Run SQL on a PostgreSQL database through the Aurora gateway without ever holding its password; every statement is classified and checked against your policy
  homepage: https://www.postgresql.org
apps:
  - about:
      id: postgresql
      name: PostgreSQL
      description: Let agents query and change a PostgreSQL database. The gateway holds the database login; agents connect to the gateway with psql or any PostgreSQL driver and each statement is checked against your rules and held for approval when it changes anything.
      summary: Run SQL on a PostgreSQL database without the agent holding its password.
      first_prompt: "Which tables are in the database, and how many rows does each have?"
      category: database
      api_docs: https://www.postgresql.org/docs/current/sql.html
      connect_note:
        text: "Create a database role for Aurora with only the privileges agents need (for example a read-only role), and enter its login here. The server must be reachable from the Aurora gateway. The password stays with the gateway; agents never receive it."
        url: https://www.postgresql.org/docs/current/user-manag.html
      label_hint: A name for this database, for example "orders prod"; agents connect with it as the service name
    credentials:
      - { name: host, secret: false }
      - { name: port, secret: false, optional: true }
      - { name: dbname, secret: false }
      - { name: user, secret: false }
      - { name: password, secret: true }
      - { name: sslmode, secret: false, optional: true }
      - { name: ca_pem, secret: false, optional: true }
    metadata:
      # (FIX-106, D-178 Q-R5-7) `off` = the explicit, audited opt-out of server certificate
      # verification under `require` without a CA certificate. Never part of the sealed login.
      - { name: tls_verification }
    connect:
      - id: login
        kind: fields
        label: Database login
        description: "The server, database, user and password of a PostgreSQL account. Use an account that has only the rights agents need."
        fields:
          - name: host
            label: Server host
            type: text
            store: credentials
            required: true
            placeholder: "db.example.org"
          - name: port
            label: Port
            type: text
            store: credentials
            placeholder: "5432"
          - name: dbname
            label: Database name
            type: text
            store: credentials
            required: true
          - name: user
            label: Database user
            type: text
            store: credentials
            required: true
          - name: password
            label: Database password
            type: secret
            store: credentials
            required: true
          - name: sslmode
            label: TLS mode
            type: select
            store: credentials
            required: true
            options:
              - { value: verify-full, label: "verify-full (verify the certificate and host name)" }
              - { value: verify-ca, label: "verify-ca (verify the certificate chain)" }
              - { value: require, label: "require (encrypt and verify the certificate: against the CA certificate below, or the system's trusted CAs)" }
              - { value: prefer, label: "prefer (encrypt when the server supports it)", warning: "Falls back to an unencrypted connection when the server does not offer TLS." }
              - { value: allow, label: "allow (encrypt only when the server insists)", warning: "Sends the password unencrypted unless the server demands TLS." }
              - { value: disable, label: "disable (no encryption)", warning: "Everything, including the password, travels unencrypted." }
          - name: ca_pem
            label: CA certificate (PEM, for a private certificate authority)
            type: file
            store: credentials
          - name: tls_verification
            label: Server certificate check (only for "require" without a CA certificate)
            type: select
            store: metadata
            show_when: { field: sslmode, equals: require }
            options:
              - { value: verify, label: "Verify the certificate against the system's trusted CAs (default)" }
              - { value: "off", label: "Do not verify the certificate", warning: "Use only for a private certificate authority whose certificate you cannot store above. The gateway then sends the database password to whichever server answers, so anyone able to intercept the connection can read it. This choice is recorded in the audit log and shown on the connection." }
    tools:
      read:
        items:
          - { id: read, description: "Reads data: SELECT, SHOW and EXPLAIN.", name: "Read data (SELECT, SHOW, EXPLAIN)", host: "*.db.aurora.internal", path: /read, methods: [POST] }
      write:
        items:
          - { id: write, description: "Changes data: INSERT, UPDATE, DELETE, COPY FROM and SELECT FOR UPDATE.", name: "Change data (INSERT, UPDATE, DELETE, COPY FROM, SELECT FOR UPDATE)", host: "*.db.aurora.internal", path: /write, methods: [POST] }
          - { id: ddl, description: "Changes the schema: CREATE, ALTER, DROP, TRUNCATE and GRANT.", name: "Change the schema (CREATE, ALTER, DROP, TRUNCATE, GRANT)", host: "*.db.aurora.internal", path: /ddl, methods: [POST] }
          - { id: admin, description: "Runs administration commands: VACUUM, ANALYZE, SET, LISTEN, DO, CALL and unlisted functions.", name: "Administer (VACUUM, ANALYZE, SET, LISTEN, DO, CALL, unlisted functions)", host: "*.db.aurora.internal", path: /admin, methods: [POST] }
    database: { engine: postgres }
    agent:
      summary: "Run SQL on a PostgreSQL database with psql: read freely, changes wait for approval."
      instructions: |
        Each connection granted to you is a libpq service: `psql service=<name> -c 'select 1'` (the
        name is listed with the account). Do not look for or ask for a database password: there is
        none for you; the Aurora gateway holds the login and checks every statement. Reads are
        allowed; writes, schema changes and administration are held for a person's approval
        (refusals answer SQLSTATE 42501 with the reason). Send one statement at a time, under 1 MiB.
      guide:
        - { file: using-psql.md, title: "Using psql: the four classes, never-permitted statements, habits" }
