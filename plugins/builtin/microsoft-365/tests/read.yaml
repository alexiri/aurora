# Read tools: each has a positive case and a `negative <tool>:` case. All credentials are fake.
- name: "get_me: bearer is injected on the Graph host"
  connection: { credentials: { access_token: "tok-fixture-1" }, metadata: { account: "alice@example.com" } }
  request: { method: GET, url: "https://graph.microsoft.com/v1.0/me" }
  expect:
    app: microsoft-365
    tool: get_me
    upstream: { url: "https://graph.microsoft.com/v1.0/me", headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative get_me: PATCH selects no tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: PATCH, url: "https://graph.microsoft.com/v1.0/me" }
  expect: { app: microsoft-365 }
- name: "agent supplied authorization is overwritten"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request:
    method: GET
    url: "https://graph.microsoft.com/v1.0/me"
    headers: { authorization: "Bearer agent-guess" }
  expect:
    tool: get_me
    upstream: { headers: { authorization: "Bearer tok-fixture-1" } }
- name: "negative get_me: the beta API is not claimed"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://graph.microsoft.com/beta/me" }
  expect: { unmatched: true }
- name: "negative get_me: the Entra sign-in host is not claimed"
  request: { method: GET, url: "https://login.microsoftonline.com/common/oauth2/v2.0/token" }
  expect: { unmatched: true }
