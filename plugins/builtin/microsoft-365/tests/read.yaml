# (D-482) Files are not offered (no Files.* or Sites.*): OneDrive and SharePoint paths select no tool.
- name: "negative OneDrive: the user's drive is not a tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://graph.microsoft.com/v1.0/me/drive/root/children" }
  expect: { app: microsoft-365 }
- name: "negative OneDrive: an item's content is not a tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://graph.microsoft.com/v1.0/me/drive/items/01EXAMPLEITEM/content" }
  expect: { app: microsoft-365 }
- name: "negative SharePoint: site search is not a tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://graph.microsoft.com/v1.0/sites?search=handbook" }
  expect: { app: microsoft-365 }
- name: "negative SharePoint: a document library's files are not a tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: GET, url: "https://graph.microsoft.com/v1.0/drives/b!exampledrive/root/children" }
  expect: { app: microsoft-365 }
- name: "negative: the batch endpoint is deliberately not a tool"
  connection: { credentials: { access_token: "tok-fixture-1" } }
  request: { method: POST, url: "https://graph.microsoft.com/v1.0/$batch" }
  expect: { app: microsoft-365 }
# Token lifecycle: the gateway refreshes the OAuth token (oauth2_refresh) and stores the new
# access token; what the package must guarantee is that the stored field is the one injected.
- name: "token: a refreshed OAuth access token is what gets injected"
  connection: { credentials: { access_token: "oauth-fixture-2", refresh_token: "refresh-fixture-2" }, metadata: { account: "alice@example.com" } }
  request: { method: GET, url: "https://graph.microsoft.com/v1.0/me/messages" }
  expect:
    tool: list_messages
    upstream: { headers: { authorization: "Bearer oauth-fixture-2" } }
