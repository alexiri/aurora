# OPS-021: automated dependency updates. Review policy: docs/ops/dependencies.md.
#
# One weekly run per ecosystem. Minor and patch updates of an ecosystem arrive as ONE grouped PR
# (so CI runs once per week per ecosystem); a major update is its own PR; security updates are
# raised immediately and ungrouped, whatever the schedule (Dependabot security updates are
# independent of `schedule`). Items pinned on purpose carry an `ignore` entry with the reason.
version: 2

updates:
  # --- Rust: the root workspace (Cargo.lock) ---------------------------------------------------
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Zurich }
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message: { prefix: "deps(cargo)" }
    groups:
      # Crates that only work as a pair arrive in one PR (a dependency goes to the first group that
      # matches): utoipa-axum is built for one utoipa major (PR #18), kube for one k8s-openapi
      # release (PR #19).
      utoipa:
        patterns: [utoipa, utoipa-axum]
      kube:
        patterns: [kube, kube-*, k8s-openapi]
      # The RustCrypto traits line (digest 0.10 -> 0.11) moves as one: sha2 0.11 does not build with
      # hmac 0.12 (PR #23: hmac::digest::KeyInit / CoreProxy not satisfied). Workspace direct deps:
      # sha2, hmac, md-5 (+ sha1/digest/hkdf if they appear).
      rustcrypto:
        patterns: [sha2, sha1, hmac, digest, hkdf, md-5]
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The hook host's wasmtime line is pinned to one major (workspace Cargo.toml, HOOK-001/002):
      # a major bump changes the component-model host API and the epoch/limits behaviour and is
      # done by hand together with aurora-hookhost's tests. Minor/patch updates are welcome.
      - dependency-name: wasmtime
        update-types: ["version-update:semver-major"]
      - dependency-name: wasmtime-wasi
        update-types: ["version-update:semver-major"]
      # The component-model tooling moves with that wasmtime line, not on its own: the registry
      # validates hook components with wasmparser before wasmtime loads them, and the guests are
      # built with wit-bindgen. These 0.x crates break their API on every minor (PR #13: wasmparser
      # 0.261's ComponentExternName), so minors are bumped by hand together with wasmtime.
      - dependency-name: wasmparser
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: wit-bindgen
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # P4-SSH-1: a hand-pinned pre-release (`=0.7.0-rc.12`) that russh pins as well; both move together
      # to the final 0.7.0 by hand (docs/ops/dependencies.md).
      - dependency-name: ssh-key

  # --- Rust: standalone hook guests of the built-in plugins (own Cargo.lock and [workspace]) ----
  # Each ships inside a signed built-in package (D-77); one PR per hook crate keeps the review small.
  - package-ecosystem: cargo
    directories:
      - /plugins/builtin/aws-keys/hooks
      - /plugins/builtin/github/hooks
      - /plugins/builtin/google-workspace/hooks
    schedule: { interval: weekly, day: monday, time: "06:30", timezone: Europe/Zurich }
    open-pull-requests-limit: 3
    labels: [dependencies, rust]
    commit-message: { prefix: "deps(hooks)" }
    groups:
      hooks-minor-patch:
        update-types: [minor, patch]
    ignore:
      # wit-bindgen moves with the hook host's wasmtime line (see the root workspace entry).
      - dependency-name: wit-bindgen
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # --- Dashboard: pnpm, web/ ---------------------------------------------------------------------
  # Dependabot reads pnpm-lock.yaml under the `npm` ecosystem.
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: tuesday, time: "06:00", timezone: Europe/Zurich }
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message: { prefix: "deps(web)" }
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # The web runtime is Node 22 (images/services/web.Containerfile, CI setup-node 22) and the
      # documented dev floor is Node 20.9 (web/package.json engines, README). @types/node must track
      # the runtime major, so a major above 22 describes APIs the runtime does not have; moved by
      # hand together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # jsdom 27+ requires Node ^22.22.2 || ^24.15 || >=26 (31.0.0), above the Node 20.9 floor of
      # web/package.json engines; bumped by hand together with raising that floor and the README.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]

  # --- The sandbox image's Claude Code CLI ---------------------------------------------------------
  - package-ecosystem: npm
    directory: /images/sandbox/harness/claude-code
    schedule: { interval: weekly, day: tuesday, time: "06:30", timezone: Europe/Zurich }
    open-pull-requests-limit: 1
    labels: [dependencies, javascript]
    commit-message: { prefix: "deps(sandbox)" }
    ignore:
      # The CLI version is pinned in two places that must agree (FIX-103): this package.json and
      # PINNED_VERSION in services/aurora-supervisor/src/adapters/claude_code/mod.rs, and a new
      # version needs the claude-code conformance run. Bumped by hand; never automatically.
      - dependency-name: "@anthropic-ai/claude-code"

  # --- GitHub Actions: every workflow action is pinned by commit SHA (OPS-019/020) ---------------
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: wednesday, time: "06:00", timezone: Europe/Zurich }
    open-pull-requests-limit: 3
    labels: [dependencies, github-actions]
    commit-message: { prefix: "deps(actions)" }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # --- Container images ----------------------------------------------------------------------------
  # Dependabot parses `Dockerfile*` and Kubernetes manifests only, not `Containerfile`:
  # the base-image digests of images/**/Containerfile are therefore NOT updated by it
  # (docs/ops/dependencies.md §Container images says how they are reviewed instead).
  - package-ecosystem: docker
    directories:
      - /images/sandbox
      - /images/services
      - /deploy/dev/llm-mock
      - /deploy/kind
    schedule: { interval: weekly, day: wednesday, time: "06:30", timezone: Europe/Zurich }
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message: { prefix: "deps(images)" }
    groups:
      images-minor-patch:
        update-types: [minor, patch]
    ignore:
      # I-30: the LLM mock stack is pinned by digest on purpose (a changed mock changes what the
      # claude-code conformance run proves); bumped by hand with a conformance run.
      # Dependabot names ghcr images without the registry (PR #3 bumped "berriai/litellm" past the
      # first entry), so both spellings are listed.
      - dependency-name: ghcr.io/berriai/litellm
      - dependency-name: berriai/litellm
      - dependency-name: ghcr.io/vidaiuk/vidaimock
      - dependency-name: vidaiuk/vidaimock
      # MM-003: Mattermost 11.7 is the supported (production) version; the preview image in
      # scripts/mattermost/setup.sh is pinned to 11.7.15 by digest.
      - dependency-name: mattermost/mattermost-preview
      - dependency-name: docker.io/mattermost/mattermost-preview
