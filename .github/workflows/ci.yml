# CI stages 1–2 (docs/18-testing.md §CI pipeline) + architecture guards. OPS-019.
# Layout: `rust-build` compiles once and publishes a nextest archive; `rust-test` shards consume it
# without compiling; `rust-lint` keeps its own (clippy) profile. Every action is pinned by commit SHA
# and runs on Node 24 (cargo-deny-action is a Docker action; install-action/rust-toolchain are composite).
name: ci
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Same values in every compiling job so the shared rust-cache stays valid. No debug info: ~100 test
  # binaries with it overflowed the runner disk (linker SIGBUS). lld cuts link time (clang + lld are on
  # ubuntu-24.04); keep in step with OPS-016's local linker choice.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  DATABASE_URL: postgres://aurora:aurora@127.0.0.1:5432/aurora
  SQLX_CLI_VERSION: 0.8.6
  NEXTEST_SHARDS: 4

jobs:
  rust-lint:
    runs-on: ubuntu-24.04
    services:
      postgres: &pg
        image: postgres:16
        env: { POSTGRES_USER: aurora, POSTGRES_PASSWORD: aurora, POSTGRES_DB: aurora }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurora" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: rust-lint }
      - &sqlx-cache
        name: sqlx-cli (cached binary)
        id: sqlx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ env.SQLX_CLI_VERSION }}-ubuntu-24.04
      - &sqlx-install
        name: sqlx-cli (install on cache miss)
        if: steps.sqlx-cache.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --no-default-features --features postgres,rustls --locked
        env: { RUSTFLAGS: "" }
      - name: migrate (sqlx macros check online, I-05)
        run: sqlx migrate run --source crates/aurora-db/migrations
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Compiles every workspace test binary once (plus the fixture packages connect.rs needs) and ships
  # a nextest archive. e2e crates are excluded (fixed ports, podman, serial): see e2e-gateway/e2e-hosted.
  rust-build:
    runs-on: ubuntu-24.04
    services:
      postgres: *pg
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: wasm32-wasip2 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: rust-test, cache-on-failure: true }
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with: { tool: cargo-nextest }
      - *sqlx-cache
      - *sqlx-install
      - run: sqlx migrate run --source crates/aurora-db/migrations
      - name: Fixture packages (plugins/fixtures/dist, needed by services/aurora-api/tests/connect.rs)
        run: bash scripts/fixtures/build.sh
      - name: Build nextest archive
        run: >-
          cargo nextest archive --workspace --all-features
          --exclude aurora-e2e-gateway --exclude aurora-e2e-hosted
          --archive-file nextest-archive.tar.zst
      - name: Doctests (nextest does not run them)
        run: cargo test --workspace --all-features --doc --exclude aurora-e2e-gateway --exclude aurora-e2e-hosted
      - name: Package fixtures
        run: tar -C plugins/fixtures --exclude=dist/hooks-target --exclude=dist/stage -cf fixtures-dist.tar dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: |
            nextest-archive.tar.zst
            fixtures-dist.tar
          retention-days: 1
          compression-level: 0

  rust-test:
    needs: rust-build
    runs-on: ubuntu-24.04
    services:
      postgres: *pg
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with: { tool: cargo-nextest }
      - *sqlx-cache
      - *sqlx-install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: nextest-archive }
      - run: tar -C plugins/fixtures -xf fixtures-dist.tar
      - run: sqlx migrate run --source crates/aurora-db/migrations
      - name: nextest shard ${{ matrix.shard }}/${{ env.NEXTEST_SHARDS }}
        run: >-
          cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap .
          --profile ci --partition count:${{ matrix.shard }}/${{ env.NEXTEST_SHARDS }}

  # Serial black-box suite (scripts/e2e/gateway.sh: builds api/gateway/hookhost, then
  # `cargo test -p aurora-e2e-gateway -- --test-threads=1`); binds 127.0.0.31-34, uses the service DB.
  e2e-gateway:
    needs: rust-build
    runs-on: ubuntu-24.04
    services:
      postgres: *pg
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: rust-test, save-if: "false" }
      - *sqlx-cache
      - *sqlx-install
      - run: sqlx migrate run --source crates/aurora-db/migrations
      - name: Fixture packages (hook fixtures used by the suite)
        run: bash scripts/fixtures/build.sh
      - run: bash scripts/e2e/gateway.sh

  # Hosted suite on the runner's rootless podman (scripts/e2e/hosted.sh creates its own Postgres
  # container and networks, builds the sandbox image unless SKIP_IMAGE_BUILD=1, and runs the tests
  # inside `podman unshare --rootless-netns`). If the runner forbids unprivileged user namespaces the
  # preflight step fails with `podman info` output; then run this suite locally/nightly (docs/18).
  e2e-hosted:
    needs: rust-build
    runs-on: ubuntu-24.04
    steps:
      - name: Free runner disk space (script needs 15 GB free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: rust-test, save-if: "false" }
      - name: Podman preflight (rootless, userns, netavark)
        run: |
          podman --version
          podman info --format 'rootless={{.Host.Security.Rootless}} network={{.Host.NetworkBackend}} sock={{.Host.RemoteSocket.Path}}'
          podman unshare --rootless-netns true
      - name: Restore sandbox image
        id: sbx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sandbox-image.tar
          key: sandbox-image-${{ hashFiles('images/**', 'Cargo.lock', 'services/aurora-supervisor/**', 'crates/*/src/**') }}
      - name: Load cached sandbox image
        if: steps.sbx.outputs.cache-hit == 'true'
        run: podman load -i sandbox-image.tar
      - name: Build sandbox image (cache miss)
        if: steps.sbx.outputs.cache-hit != 'true'
        run: |
          bash scripts/images/build-sandbox-min.sh aurora-sandbox:0.1.0
          podman save -o sandbox-image.tar localhost/aurora-sandbox:0.1.0
      - name: Start rootless podman API socket (the runner talks to it over a unix socket)
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          sock="$XDG_RUNTIME_DIR/podman/podman.sock"
          setsid nohup podman system service --time=0 "unix://$sock" > podman-service.log 2>&1 &
          for _ in $(seq 30); do [ -S "$sock" ] && break; sleep 1; done
          [ -S "$sock" ] || { echo "podman socket $sock did not appear"; cat podman-service.log; exit 1; }
          podman info --format '{{.Host.RemoteSocket.Path}} exists={{.Host.RemoteSocket.Exists}}'
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: e2e-hosted
        env:
          AURORA_TEST_PODMAN: "1"
          SKIP_IMAGE_BUILD: "1"
        run: bash scripts/e2e/hosted.sh

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: API client drift (openapi.json → schema.d.ts)
        run: pnpm gen:api && git diff --exit-code -- src/lib/api/schema.d.ts

  # No compile here: the schema_matches_spec test now runs inside the rust-test shards.
  guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bash scripts/guards/run-all.sh
      - name: schema extract is current
        run: python3 scripts/extract-schema.py --check
