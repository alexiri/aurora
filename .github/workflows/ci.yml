# CI stages 1–2 (docs/18-testing.md §CI pipeline) + architecture guards. OPS-019.
# Layout: `rust-build` compiles once and publishes a nextest archive; `rust-test` shards consume it
# without compiling; `rust-lint` keeps its own (clippy) profile. Every action is pinned by commit SHA
# and runs on Node 24 (cargo-deny-action is a Docker action; install-action/rust-toolchain are composite).
name: ci
on:
  push:
    branches: [main, master]
    tags: ["v*"]   # OPS-020: version tags run the full CI, then publish images
  pull_request:

# No workflow-level concurrency group: every push to master gets its own full test run (owner: CI on
# every merge). Only the publishing jobs serialize per ref, so two runs never race to push the same tag.
permissions:
  contents: read

# VTL-001: the sccache step, shared by every compiling job (`*sccache` anchor, defined in `rust-lint`).
# mozilla-actions/sccache-action reads ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN from the job environment;
# it is a no-op where the backend cannot start (fork PRs: the runtime token is read-only — sccache falls
# back to its local directory and the build proceeds; identical to OPS-023's measured fallback in image
# builds). ACTIONS_CACHE_KEY_PREFIX namespaces sccache's entries inside the repository's shared 10 GB
# Actions cache so they are identifiable next to the BuildKit scopes and rust-cache.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Same values in every compiling job so the shared rust-cache stays valid. No debug info: ~100 test
  # binaries with it overflowed the runner disk (linker SIGBUS). lld cuts link time (clang + lld are on
  # ubuntu-24.04); keep in step with OPS-016's local linker choice.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  DATABASE_URL: postgres://aurora:aurora@127.0.0.1:5432/aurora
  SQLX_CLI_VERSION: 0.8.6
  NEXTEST_SHARDS: 4
  # VTL-001 (velocity): shared sccache over the GitHub Actions cache for the compiling jobs. OPS-023 removed
  # sccache from the *docker image builds* (it competed with the BuildKit layer cache for the 10 GB repo cache
  # and never hit there); this is the plain `cargo` path in the lint/test jobs, measured at +0 hits/0 min cost
  # on a first run and faster warm runs (see docs/ops/build-performance.md §CI). The repo Actions cache cap
  # (10 GB) is the budget; the rust-cache entries stay under it.
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CACHE_SIZE: "8G"
  ACTIONS_CACHE_KEY_PREFIX: "sccache-"

jobs:
  rust-lint:
    runs-on: ubuntu-24.04
    services:
      postgres: &pg
        image: postgres:16
        env: { POSTGRES_USER: aurora, POSTGRES_PASSWORD: aurora, POSTGRES_DB: aurora }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurora" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: "rustfmt, clippy" }
      # VTL-001 (velocity): sccache on top of the rust-cache. Dependencies do not change between
      # consecutive runs, so their rlibs come from sccache while only the workspace crates recompile;
      # rust-cache keeps restoring target/ for the workspace part. Backend env set once in workflow env;
      # the step is anchored and reused by every other compiling job.
      - &sccache
        name: sccache (GitHub Actions cache backend, VTL-001)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: rust-lint }
      - &sqlx-cache
        name: sqlx-cli (cached binary)
        id: sqlx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ env.SQLX_CLI_VERSION }}-ubuntu-24.04
      - &sqlx-install
        name: sqlx-cli (install on cache miss)
        if: steps.sqlx-cache.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --no-default-features --features postgres,rustls --locked
        env: { RUSTFLAGS: "" }
      - name: migrate (sqlx macros check online, I-05)
        run: sqlx migrate run --source crates/aurora-db/migrations
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # P2-OPS-1 (D-100): the plugins/builtin/*/hooks crates have their own lockfiles, so the step above
      # never sees them. One deny.toml per hook crate (github carries a scoped RUSTSEC-2023-0071 waiver).
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with: { tool: cargo-deny }
      - name: cargo deny over the hook crates
        run: bash scripts/plugins/deny-hooks.sh

  # Compiles every workspace test binary once (plus the fixture packages connect.rs needs) and ships
  # a nextest archive. e2e crates are excluded (fixed ports, podman, serial): see e2e-gateway/e2e-hosted.
  rust-build:
    runs-on: ubuntu-24.04
    services:
      postgres: *pg
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: wasm32-wasip2 }
      - *sccache
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: rust-test, cache-on-failure: true }
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with: { tool: cargo-nextest }
      - *sqlx-cache
      - *sqlx-install
      - run: sqlx migrate run --source crates/aurora-db/migrations
      - name: Fixture packages (plugins/fixtures/dist, needed by services/aurora-api/tests/connect.rs)
        run: bash scripts/fixtures/build.sh
      # P2-CAT-0: every plugins/builtin/<id> must validate, pass its fixtures with full coverage, keep
      # narrow default scopes and render its docs (plugins/builtin/README.md). Offline, no network;
      # reuses the aurora and aurora-gateway binaries the fixture step just built.
      - name: Built-in plugin checks (validate, test, coverage, scopes, docs)
        run: SKIP_CARGO=1 bash scripts/plugins/check-builtin.sh
      - name: Build nextest archive
        run: >-
          cargo nextest archive --workspace --all-features
          --exclude aurora-e2e-gateway --exclude aurora-e2e-hosted
          --archive-file nextest-archive.tar.zst
      - name: Doctests (nextest does not run them)
        run: cargo test --workspace --all-features --doc --exclude aurora-e2e-gateway --exclude aurora-e2e-hosted
      - name: Package fixtures
        run: tar -C plugins/fixtures --exclude=dist/hooks-target --exclude=dist/stage -cf fixtures-dist.tar dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: |
            nextest-archive.tar.zst
            fixtures-dist.tar
          retention-days: 1
          compression-level: 0

  rust-test:
    needs: rust-build
    runs-on: ubuntu-24.04
    services:
      postgres: *pg
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with: { tool: cargo-nextest }
      - *sqlx-cache
      - *sqlx-install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: nextest-archive }
      - run: tar -C plugins/fixtures -xf fixtures-dist.tar
      - run: sqlx migrate run --source crates/aurora-db/migrations
      - name: nextest shard ${{ matrix.shard }}/${{ env.NEXTEST_SHARDS }}
        run: >-
          cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap .
          --profile ci --partition count:${{ matrix.shard }}/${{ env.NEXTEST_SHARDS }}

  # Serial black-box suite (scripts/e2e/gateway.sh: builds api/gateway/hookhost, then
  # `cargo test -p aurora-e2e-gateway -- --test-threads=1`); binds 127.0.0.31-34, uses the service DB.
  e2e-gateway:
    needs: rust-build
    runs-on: ubuntu-24.04
    services:
      postgres: *pg
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - *sccache
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: rust-test, save-if: "false" }
      - *sqlx-cache
      - *sqlx-install
      - run: sqlx migrate run --source crates/aurora-db/migrations
      - name: Fixture packages (hook fixtures used by the suite)
        run: bash scripts/fixtures/build.sh
      # FIX-101 (docs/18 TEST-021): the strict front doors (pinned nginx + haproxy between the gateway and
      # the mock upstream) are CI's job; without FRONTDOOR=1 frontdoor.rs printed SKIPPED and passed. With
      # CI=true the script now fails on any SKIPPED: line, so the doors cannot silently drop out again.
      - run: bash scripts/e2e/gateway.sh
        env: { FRONTDOOR: "1", FRONTDOOR_HAPROXY: "1" }

  # FIX-101: the env-gated suites the specifications cite as evidence, with their gates set. Under CI=true
  # `aurora_testkit::require_or_skip` fails a gated test whose gate is unset (the nextest `ci` profile keeps
  # them out of the shards, which have no Redis and no podman network). SEC-62: the Redis backend of the
  # counters conformance suite (and FIX-087's documented-ACL case); SEC-26: the runner's live podman
  # hardening assertions. Each step requires a non-zero passed count.
  gated-suites:
    runs-on: ubuntu-24.04
    services:
      postgres: *pg
      redis:
        image: docker.io/library/redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - *sccache
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: rust-test, save-if: "false" }
      - *sqlx-cache
      - *sqlx-install
      - run: sqlx migrate run --source crates/aurora-db/migrations
      - name: Redis counters conformance (AURORA_TEST_REDIS)
        env:
          AURORA_TEST_REDIS: "1"
          AURORA_TEST_REDIS_ADDR: redis://127.0.0.1:6379
        run: |
          cargo test -p aurora-counters --test it redis 2>&1 | tee redis.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' redis.log
          grep -q 'redis_documented_acl_runs_the_scripts \.\.\. ok' redis.log
      - name: Podman preflight (rootless, userns, netavark)
        run: |
          podman --version
          podman info --format 'rootless={{.Host.Security.Rootless}} network={{.Host.NetworkBackend}} sock={{.Host.RemoteSocket.Path}}'
      - name: Sandbox image and internal network for the runner's podman tests
        run: |
          bash scripts/images/build-sandbox-min.sh aurora-sandbox-min:dev
          podman network create --internal --disable-dns --subnet 10.89.250.0/24 --gateway 10.89.250.1 aurora-sandbox
      - name: Start rootless podman API socket
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          sock="$XDG_RUNTIME_DIR/podman/podman.sock"
          setsid nohup podman system service --time=0 "unix://$sock" > podman-service.log 2>&1 &
          for _ in $(seq 30); do [ -S "$sock" ] && break; sleep 1; done
          [ -S "$sock" ] || { echo "podman socket $sock did not appear"; cat podman-service.log; exit 1; }
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Runner podman hardening tests (AURORA_TEST_PODMAN, SEC-26)
        env:
          AURORA_TEST_PODMAN: "1"
        run: |
          cargo test -p aurora-runner --test it podman:: 2>&1 | tee podman.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' podman.log

  # Hosted suite on the runner's rootless podman (scripts/e2e/hosted.sh creates its own Postgres
  # container and networks, builds the sandbox image unless SKIP_IMAGE_BUILD=1, and runs the tests
  # inside `podman unshare --rootless-netns`). If the runner forbids unprivileged user namespaces the
  # preflight step fails with `podman info` output; then run this suite locally/nightly (docs/18).
  e2e-hosted:
    needs: rust-build
    runs-on: ubuntu-24.04
    steps:
      - name: Free runner disk space (script needs 15 GB free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - *sccache
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: rust-test, save-if: "false" }
      - name: Podman preflight (rootless, userns, netavark)
        run: |
          podman --version
          podman info --format 'rootless={{.Host.Security.Rootless}} network={{.Host.NetworkBackend}} sock={{.Host.RemoteSocket.Path}}'
          podman unshare --rootless-netns true
      - name: Restore sandbox image
        id: sbx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sandbox-image.tar
          # FIX-101: everything the image build reads — manifests, the toolchain file, the image scripts and
          # the supervisor's own crates (a dependency change without a source change used to hit a stale image).
          key: sandbox-image-${{ hashFiles('images/**', 'scripts/images/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '**/Cargo.toml', 'services/aurora-supervisor/**', 'crates/*/src/**') }}
      - name: Load cached sandbox image
        if: steps.sbx.outputs.cache-hit == 'true'
        run: podman load -i sandbox-image.tar
      - name: Build sandbox image (cache miss)
        if: steps.sbx.outputs.cache-hit != 'true'
        run: |
          bash scripts/images/build-sandbox-min.sh aurora-sandbox:0.1.0
          podman save -o sandbox-image.tar localhost/aurora-sandbox:0.1.0
      - name: Start rootless podman API socket (the runner talks to it over a unix socket)
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          sock="$XDG_RUNTIME_DIR/podman/podman.sock"
          setsid nohup podman system service --time=0 "unix://$sock" > podman-service.log 2>&1 &
          for _ in $(seq 30); do [ -S "$sock" ] && break; sleep 1; done
          [ -S "$sock" ] || { echo "podman socket $sock did not appear"; cat podman-service.log; exit 1; }
          podman info --format '{{.Host.RemoteSocket.Path}} exists={{.Host.RemoteSocket.Exists}}'
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: e2e-hosted
        env:
          AURORA_TEST_PODMAN: "1"
          SKIP_IMAGE_BUILD: "1"
          # FIX-101: with CI=true a SKIPPED: line fails the script. The one declared exception: the chromium
          # scenarios (SEC-41, hosted.rs s8d and its sibling) need the full sandbox image, which this PR job
          # does not build (~10 min with Chromium); they run in the nightly `hosted-full` job.
          AURORA_E2E_ALLOW_SKIPPED: "AURORA_E2EH_FULL_IMAGE_TAG is not set"
        run: bash scripts/e2e/hosted.sh

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: API client drift (openapi.json → schema.d.ts)
        run: pnpm gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      # FIX-101 (docs/18: "Playwright flows … every PR"): the mocked project on every push; the real-stack
      # specs (one shared stack) run nightly. `next dev` on 4100.
      - name: Browser for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright, mocked project (every spec that installs its own page.route() mocks)
        run: pnpm exec playwright test --project mocked
      # FIX-098: the production-build project — `next build` + `next start` on port 4110 (never 4000), the
      # only place the real Content-Security-Policy applies (terminal.prod.spec.ts).
      - name: Playwright, production build (AURORA_E2E_PROD=1, port 4110)
        env: { AURORA_E2E_PROD: "1", AURORA_E2E_WEB_PROD_PORT: "4110" }
        run: pnpm e2e:prod
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-failure
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  # No compile here: the schema_matches_spec test now runs inside the rust-test shards.
  # P3-VLT-2 (docs/21 §Phase 3 — HashiCorp Vault): the Vault store, `aurora-api secrets migrate`
  # (inline -> Vault -> inline over every purpose), the CAS race tests and the SEC-61 gateway test, all
  # against a Vault dev server (service container, image pinned by digest = P3-VLT-1's pin), plus the
  # Helm Vault cases. The dev server mounts KV v2 at `secret/` and takes the root token below (a
  # throwaway test value; the container is discarded with the job). The image's default command is
  # `server -dev`, listening on 0.0.0.0:8200.
  vault:
    runs-on: ubuntu-24.04
    services:
      postgres: *pg
      vault:
        image: docker.io/hashicorp/vault@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
        env: { VAULT_DEV_ROOT_TOKEN_ID: aurora-dev-root }
        ports: ["8200:8200"]
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "VAULT_ADDR=http://127.0.0.1:8200 vault status" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AURORA_TEST_VAULT: "1"
      AURORA_TEST_VAULT_ADDR: http://127.0.0.1:8200
      AURORA_TEST_VAULT_TOKEN: aurora-dev-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - *sccache
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: rust-test, save-if: "false" }
      - *sqlx-cache
      - *sqlx-install
      - run: sqlx migrate run --source crates/aurora-db/migrations
      - name: Fixture packages (the API test binary builds against them)
        run: bash scripts/fixtures/build.sh
      - name: Vault store, managed and reference modes, CAS race
        run: cargo test -p aurora-secrets
      - name: secrets migrate inline -> Vault -> inline, racing migrators
        run: cargo test -p aurora-api --test it secrets_migrate
      - name: SEC-61, a refused reference injects nothing (gateway)
        run: cargo test -p aurora-gateway --test it refused_vault_reference
      - name: Helm Vault values (lint, template, rendered config validation)
        run: |
          cargo build -p aurora-api
          bash deploy/helm/check-vault.sh

  guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bash scripts/guards/run-all.sh
      - name: schema extract is current
        run: python3 scripts/extract-schema.py --check

  # ---- OPS-020: service/web/sandbox images -> ghcr.io/<owner>/aurora-*. Runs only after EVERY check job above
  # is green (needs:), so a red build never publishes. Pull requests build (cache + Containerfile check) but
  # never log in or push; master and v* tags push. Final jobs of ci.yml, not a workflow_run workflow: that
  # trigger runs the default branch's copy of the file, loses the PR/tag context and needs head_sha plumbing.
  # Cache design (docs/ops/build-performance.md): `images-builder` compiles the Rust workspace ONCE
  # (Containerfile `builder` stage, cargo-chef deps layer) and exports the layers to the gha cache scope
  # `services`; the per-image jobs import that scope, so every service image is a copy of one compile.
  images-builder:
    concurrency: { group: "images-builder-${{ github.ref }}", cancel-in-progress: false }
    needs: [rust-lint, rust-deny, rust-build, rust-test, e2e-gateway, gated-suites, e2e-hosted, web, guards]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # No sccache GitHub Actions backend here (OPS-023 measured it: 0 hits on consecutive runs and the builder
      # went from ~15 to ~32 min, because its entries compete with the layer cache for the repository's 10 GB
      # Actions cache). The Containerfile's with-sccache then uses its local directory, which CI does not keep.
      - name: build the shared Rust builder stage (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/services/Containerfile
          target: builder
          push: false
          cache-from: type=gha,scope=services
          cache-to: type=gha,scope=services,mode=max

  images-services:
    # One group per image: a shared group lets only one matrix leg run and keeps a single pending
    # slot, so the next push's legs replaced (cancelled) the siblings still waiting.
    concurrency: { group: "images-services-${{ github.ref }}-${{ matrix.image }}", cancel-in-progress: false }
    needs: [images-builder]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # only the publishing jobs hold this
    strategy:
      fail-fast: false
      matrix:
        # `api` and `connector-host` are built by images-api / images-api-pr below (they ship
        # artifacts signed with the project key: built-in packages, connector manifests).
        image: [gateway, hookhost, runner, relay, connector-fake, connector-mattermost]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &images-prep
        name: image names and publish switch
        id: prep
        env:
          NAME: ${{ matrix.image || 'web' }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=ghcr.io/${owner}/aurora-${NAME}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ "$GITHUB_REF" = refs/heads/master ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          # `latest` only for the newest semver tag.
          newest=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git fetch --tags --quiet
            top="$(git tag --list 'v[0-9]*' | grep -Ev -- '-' | sort -V | tail -1 || true)"
            [ "${GITHUB_REF#refs/tags/}" = "$top" ] && newest=true
          fi
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - &images-login
        name: log in to ghcr.io (publishing runs only)
        if: steps.prep.outputs.push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - &images-meta
        name: tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.prep.outputs.repo }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.prep.outputs.newest == 'true' }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=aurora-${{ matrix.image || 'web' }}
      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/services/Containerfile
          target: ${{ matrix.image }}
          push: ${{ steps.prep.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=services
          provenance: mode=max
          sbom: true

  # ---- P2-CAT-0: the api image ships the built-in app packages at /usr/share/aurora/plugins, signed with
  # the project key (docs/ops/builtin-plugin-signing.md). The key is the secret AURORA_PROJECT_SIGNING_KEY of
  # the `release` environment, which only the push job can read: pull requests (no environment, no secret)
  # build the same image with UNSIGNED archives. Both jobs share these steps through YAML anchors.
  images-api:
    if: github.event_name == 'push'
    environment: release
    # One group per image, as for images-services: a shared group keeps one pending slot, so with two
    # pushes in flight the queued legs replaced (cancelled) each other — the api leg of run
    # 43578568574 was cancelled a second after it started.
    concurrency: { group: "images-api-${{ github.ref }}-${{ matrix.image }}", cancel-in-progress: false }
    needs: [images-builder]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, connector-host]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *images-prep
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - *images-login
      - *images-meta
      - &api-sign
        # The `sign` step: the key goes into a 0600 temp file (never an argument or a log line), is mounted
        # into the image build as the secret `aurora_project_signing_key`, where scripts/plugins/build-builtin.sh
        # runs `aurora plugin sign <archive> --key <file>` and verifies the result against the compiled-in public
        # key. Without the secret the file is empty and the build skips signing with a clear log line.
        name: project signing key (skips cleanly when the secret is absent)
        id: sign
        env:
          AURORA_PROJECT_SIGNING_KEY: ${{ secrets.AURORA_PROJECT_SIGNING_KEY }}
        run: |
          umask 077
          keyfile="$(mktemp "${RUNNER_TEMP}/aurora-signing-key.XXXXXX")"
          chmod 0600 "$keyfile"
          if [ -n "${AURORA_PROJECT_SIGNING_KEY:-}" ]; then
            printf '%s\n' "$AURORA_PROJECT_SIGNING_KEY" > "$keyfile"
            echo "signing: AURORA_PROJECT_SIGNING_KEY present, built-in plugins will be signed"
          else
            echo "::warning::signing SKIPPED: AURORA_PROJECT_SIGNING_KEY is not available here; built-in plugins are UNSIGNED and the API refuses them"
          fi
          echo "keyfile=$keyfile" >> "$GITHUB_OUTPUT"
      - &api-build
        name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/services/Containerfile
          target: ${{ matrix.image }}
          push: ${{ steps.prep.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=services
          secret-files: |
            aurora_project_signing_key=${{ steps.sign.outputs.keyfile }}
          provenance: mode=max
          sbom: true
      - &api-cleanup
        name: delete the signing key file
        if: always()
        run: rm -f "${{ steps.sign.outputs.keyfile }}"

  images-api-pr:
    if: github.event_name == 'pull_request'
    concurrency: { group: "images-api-pr-${{ github.ref }}", cancel-in-progress: false }
    needs: [images-builder]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, connector-host]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *images-prep
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - *images-login
      - *images-meta
      - *api-sign
      - *api-build
      - *api-cleanup

  images-web:
    concurrency: { group: "images-web-${{ github.ref }}", cancel-in-progress: false }
    needs: [rust-lint, rust-deny, rust-build, rust-test, e2e-gateway, gated-suites, e2e-hosted, web, guards]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *images-prep
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - *images-login
      - *images-meta
      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/services/web.Containerfile
          push: ${{ steps.prep.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          provenance: mode=max
          sbom: true

  # `sandbox` and `sandbox-min` share the supervisor compile and the OS layer, so they build one after the
  # other in one job over one cache scope. The base layer (Chromium, Node, claude-code) is large and
  # changes rarely: it is exported with mode=max and is the dominant cache entry. The public AlmaLinux base
  # is used in CI (the CERN default is a local build default).
  images-sandbox:
    concurrency: { group: "images-sandbox-${{ github.ref }}", cancel-in-progress: false }
    needs: [rust-lint, rust-deny, rust-build, rust-test, e2e-gateway, gated-suites, e2e-hosted, web, guards]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: image names and publish switch
        id: prep
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ "$GITHUB_REF" = refs/heads/master ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          newest=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git fetch --tags --quiet
            top="$(git tag --list 'v[0-9]*' | grep -Ev -- '-' | sort -V | tail -1 || true)"
            [ "${GITHUB_REF#refs/tags/}" = "$top" ] && newest=true
          fi
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - *images-login
      - name: tags and labels (sandbox)
        id: meta-sandbox
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner }}/aurora-sandbox
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.prep.outputs.newest == 'true' }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=aurora-sandbox
      - name: build and push sandbox
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/sandbox/Containerfile
          target: sandbox
          # unset SANDBOX_BASE_IMAGE variable = the Containerfile's public digest-pinned default
          build-args: ${{ vars.SANDBOX_BASE_IMAGE != '' && format('SANDBOX_BASE_IMAGE={0}', vars.SANDBOX_BASE_IMAGE) || '' }}
          push: ${{ steps.prep.outputs.push == 'true' }}
          tags: ${{ steps.meta-sandbox.outputs.tags }}
          labels: ${{ steps.meta-sandbox.outputs.labels }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,scope=sandbox,mode=max
          provenance: mode=max
          sbom: true
      - name: tags and labels (sandbox-min)
        id: meta-min
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner }}/aurora-sandbox-min
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.prep.outputs.newest == 'true' }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=aurora-sandbox-min
      - name: build and push sandbox-min
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/sandbox/Containerfile
          target: sandbox-min
          build-args: ${{ vars.SANDBOX_BASE_IMAGE != '' && format('SANDBOX_BASE_IMAGE={0}', vars.SANDBOX_BASE_IMAGE) || '' }}
          push: ${{ steps.prep.outputs.push == 'true' }}
          tags: ${{ steps.meta-min.outputs.tags }}
          labels: ${{ steps.meta-min.outputs.labels }}
          cache-from: type=gha,scope=sandbox
          provenance: mode=max
          sbom: true
