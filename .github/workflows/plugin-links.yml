# P2-CAT-0: link check of the built-in packages (about.api_docs, api_spec, homepage, help_url).
# Network-dependent, so it is NOT part of ci.yml and never blocks a merge: it runs weekly, on demand,
# and on pull requests that touch the packages (where a failure is informational only).
name: plugin-links
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["plugins/builtin/**", "scripts/plugins/check_links.py", ".github/workflows/plugin-links.yml"]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/plugins/check-links.sh
