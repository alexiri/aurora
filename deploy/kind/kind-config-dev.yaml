# Dev cluster `aurora-dev` for deploy/dev/kind-dev.sh (OPS-017; docs/operator/install-kind-dev.md).
# The control-plane node runs ingress-nginx on hostPort 80; it is published on 127.0.0.1:4000, the
# single Aurora URL (the former compose Caddy edge). The e2e cluster (kind-config.yaml) is separate.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 4000, listenAddress: "127.0.0.1", protocol: TCP}
