# Dev profile for deploy/dev/kind-dev.sh (OPS-017). Replaces the compose stack. Evaluation settings
# only, never for production. Layer further profiles with extra -f files:
#   values-llm-mock.yaml        LiteLLM + VidaiMock endpoint `litellm-mock` (decision I-30)
#   values-connector-fake.yaml  the fake connector
externalUrl: http://localhost:4000

image:
  registry: localhost/aurora-dev
  tag: dev
  pullPolicy: Never       # kind-dev.sh loads the images with `kind load image-archive`

postgres:
  enabled: true           # evaluation Postgres bundled in the chart

# ingress-nginx (deploy/kind/ingress-nginx.yaml) publishes the single URL on 127.0.0.1:4000.
ingress:
  enabled: true
  className: nginx

podDisruptionBudget:
  enabled: false

api: {replicas: 1}
gateway: {replicas: 1}
hookhost: {replicas: 1}
web: {replicas: 1}
runner: {replicas: 1}

# P1-005 (RFE-004): all sign-in is OIDC. The dev IdP is served through the ingress at
# http://localhost:4000/dev-idp; the API reaches it in-cluster. Any login_hint signs in (the e2e specs
# mint their own e-mails); the login page lists the users below. Dev only; loopback only.
devIdp:
  enabled: true
  allowAnyHint: true

config:
  auth:
    signup_mode: open
    org_creation: anyone
    # P4-ONB-1: a fresh open instance admits only instance admins until a placement is saved;
    # scripts/e2e/lib-placement.sh signs in as this user and saves one (docs/operator/install-kind-dev.md).
    instance_admins: ["placement-admin@e2e.test"]
  # FIX-116: log-only mail writes invitation links to the API log (development only).
  email:
    log_links: true
  # FIX-010 (D-87): no gateway address override. Hosted sandboxes default to
  # gateway.sandbox_proxy_url = https://aurora-gateway:4102 on the Kubernetes backend (the host alias the
  # runner writes into each Pod; the name is on the proxy certificate), while BYO agents keep the
  # advertised URL derived from externalUrl.
  hosted:
    enabled: true
    allow_fake_harness: true
    idle_stop_secs: 30
  runner:
    image: localhost/aurora-dev/aurora-sandbox:dev
    max_sandboxes: 4
    capacity_wait_secs: 5
  telemetry:
    log_level: info
