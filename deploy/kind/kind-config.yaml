# kind cluster for scripts/e2e/kind.sh (OPS-011). Name is set on the command line (aurora-e2e).
# kindnet is disabled when AURORA_KIND_CNI=calico (scripts/e2e/kind.sh patches this flag).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: false
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
