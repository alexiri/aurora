# Test values for scripts/e2e/kind.sh (OPS-011). Evaluation settings only, never for production.
externalUrl: http://localhost:4100

image:
  registry: localhost/aurora-e2e
  tag: e2e
  pullPolicy: Never       # images are loaded with `kind load image-archive`

postgres:
  enabled: true           # evaluation Postgres bundled in the chart
  initScriptsConfigMap: aurora-e2e-pg-init   # creates the gateway role (kind.sh creates this ConfigMap)

# FIX-016: the gateway connects as its least-privilege role, never as the API's user. kind.sh creates
# the Secret `aurora-gateway-database` (the DBA's step 2) before `helm install`.
database:
  gatewayRole: aurora_gateway
  gatewayExistingSecret: aurora-gateway-database

# kind has no ingress controller: the test reaches the API through `kubectl port-forward`.
ingress:
  enabled: false

api: {replicas: 1}
gateway: {replicas: 1}
hookhost: {replicas: 1}
web: {replicas: 1}
runner: {replicas: 1}

# P4-MCON: the e2e adds the `fake` connector type through the admin API, which needs the host to
# announce it (the host warns at start; never on a real instance).
connectorHost:
  replicas: 1
  testTypes: true

# P1-005 (RFE-004): sign-in is OIDC only. No ingress here, so the dev IdP is served at the root and
# reached through `kubectl port-forward` on 127.0.0.1:4107 (kind.sh), the same URL the API hands the browser.
devIdp:
  enabled: true
  pathPrefix: ""
  issuer: http://localhost:4107
  allowAnyHint: true

config:
  auth:
    signup_mode: open
    org_creation: anyone
    # P4-ONB-1: a fresh open instance admits only instance admins until a placement is saved;
    # the e2e journeys sign in as this user first and save one (tests/e2e-hosted common).
    instance_admins: ["placement-admin@e2e.test"]
  hosted:
    enabled: true
    allow_fake_harness: true
    idle_stop_secs: 30     # park/wake scenario
  runner:
    image: localhost/aurora-e2e/aurora-sandbox:e2e   # kind load image-archive name (kind.sh)
    max_sandboxes: 4
    capacity_wait_secs: 5
  telemetry:
    log_level: info
