# `llm-mock` profile (decision I-30; replaces the compose profile of the same name): endpoint
# `litellm-mock` = the real LiteLLM proxy in front of VidaiMock, deployed by deploy/dev/llm-mock/llm-mock.yaml
# into namespace aurora-dev-mock. It is NOT a model. The LLM key to give Aurora is the dev master key
# `sk-aurora-mock-dev`.
# SEC-09 / docs/06: the gateway refuses private destinations. Only the Service's fixed ClusterIP /32
# is opened (not the cluster), and the gateway NetworkPolicy gets one extra egress rule to that namespace.
config:
  # P2-E2E-1 / FU-OPS-017a: hosted agents run the REAL claude-code harness against the mock. The image is the dev
  # sandbox plus the pinned Claude Code CLI (scripts/e2e/llm.Containerfile), built and loaded by kind-dev.sh.
  runner:
    image: localhost/aurora-dev/aurora-sandbox-llm:dev
  gateway:
    allowed_private: ["10.96.100.40/32"]
  llm:
    endpoints:
      - id: litellm-mock
        provider: litellm
        display_name: "LiteLLM (VidaiMock, dev only)"
        base_url: http://litellm.aurora-dev-mock.svc.cluster.local:4000
        dialects: ["anthropic_messages"]
        default_model: scn-pong
        models: ["claude-mock", "scn-pong", "scn-memory-tool", "scn-count", "scn-ratelimit", "scn-overload"]

      # FIX-019 (D-136): the owner's production endpoint shape (`aigw`): only `base_url` and the `endpoint`
      # key origin; no default_model, models or dialects. A key on it is usable but names no model, so a
      # hosted turn fails `no_default_model` until the agent's model is set (web/e2e/no-default-model.spec.ts).
      # No `key_origin` here (no rule behaves as method `endpoint`): the API pod has no egress to the mock, and
      # with a rule the save-time check would fail `llm_endpoint_unreachable` (`litellm-mock` hides this behind
      # its static `models` fallback). Without a rule the key is saved with a pending origin and is usable.
      # The gateway finds the endpoint of an LLM request by host, so this one uses the Service's fixed ClusterIP
      # (already allowed above) instead of the name `litellm-mock` uses: two endpoints must not share a host.
      - id: aigw-mock
        provider: litellm
        display_name: "AIGW shape (no default model, dev only)"
        base_url: http://10.96.100.40:4000

networkPolicy:
  gatewayExtraEgress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: aurora-dev-mock}}
      ports: [{protocol: TCP, port: 4000}]
