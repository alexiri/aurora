# TEST-021 tier 2: second strict front-door peer (different strictness quirks than nginx,
# notably h1 keep-alive semantics; docs/tasks/TEST-021.md req 4). Mounted read-only by
# scripts/e2e/gateway.sh into a `--network=host` container when FRONTDOOR=1; proxies to the
# same mock upstream as the nginx front door (127.0.0.2:8093), verifying it by name.
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    timeout http-request 10s
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe_main
    bind 127.0.0.2:8092 ssl crt /fd/fd.pem alpn h2,http/1.1
    default_backend be_mock

backend be_mock
    server mock 127.0.0.2:8093 ssl verify required ca-file /fd/mock.pem verifyhost fd-mock.e2e.aurora.dev sni str(fd-mock.e2e.aurora.dev) alpn http/1.1
