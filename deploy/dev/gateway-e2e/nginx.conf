# TEST-021 tier 2: the strict front door between the gateway and its upstream — the
# production topology that escaped FIX-052 (docs/tasks/TEST-021.md req 4). Mounted read-only
# by scripts/e2e/gateway.sh into a `--network=host` container; the mock upstream address is
# fixed (127.0.0.2:8093, bound by tests/frontdoor.rs, exported as AURORA_E2E_FRONTDOOR_MOCK).
# The gateway-side leg negotiates h2 via ALPN, so an RFC-forbidden relayed header pair meets
# nginx's bare 400 here instead of the application.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr info;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen 127.0.0.2:8091 ssl;
        http2 on;
        ssl_certificate     /fd/fd.pem;
        ssl_certificate_key /fd/fd.pem;
        location / {
            proxy_pass https://127.0.0.2:8093;
            proxy_http_version 1.1;
            proxy_set_header connection "";
            proxy_ssl_trusted_certificate /fd/mock.pem;
            proxy_ssl_verify_depth 1;
            proxy_ssl_name fd-mock.e2e.aurora.dev;
            proxy_ssl_server_name on;
        }
    }
}
