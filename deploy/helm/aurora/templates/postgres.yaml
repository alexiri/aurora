{{- if .Values.postgres.enabled }}
{{- $full := include "aurora.fullname" . -}}
# EVALUATION ONLY. Pre-install hooks without a delete policy so the database exists before `migrate`;
# they are not removed by `helm uninstall` (delete the StatefulSet/PVC manually).
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-postgres
  labels: {{- include "aurora.labels" . | nindent 4 }}
  annotations: {"helm.sh/hook": "pre-install", "helm.sh/hook-weight": "-5"}
spec:
  selector: {{- include "aurora.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports: [{name: pg, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-postgres
  labels: {{- include "aurora.labels" . | nindent 4 }}
  annotations: {"helm.sh/hook": "pre-install", "helm.sh/hook-weight": "-5"}
spec:
  serviceName: {{ $full }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aurora.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - {name: POSTGRES_USER, value: aurora}
            - {name: POSTGRES_DB, value: aurora}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "aurora.secretName" . }}, key: POSTGRES_PASSWORD}}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, aurora, -d, aurora]}, periodSeconds: 10}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes: [{name: run, emptyDir: {}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
{{- end }}
