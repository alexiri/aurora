{{- $full := include "aurora.fullname" . -}}
{{- $secret := include "aurora.secretName" . -}}
{{- $ca := include "aurora.caSecretName" . -}}
{{- $genSecrets := not .Values.secrets.existingSecret -}}
{{- $genCA := not .Values.gateway.ca.existingSecret -}}
{{- $rotate := .Values.secrets.rotate | default dict -}}
{{- /* RFE-007: a rotation request needs the hook on upgrade too (it only appends, never activates).
       P4-MCON: so does a release upgraded from before the connector host, whose Secret has no
       AURORA_CONNECTOR_HOST_TOKEN yet. Every `put` is idempotent (only absent keys are written), so the hook
       runs on every upgrade. */ -}}
{{- $secretHook := "pre-install,pre-upgrade" -}}
{{- if or $genSecrets $genCA }}
# Hook ServiceAccount + Role: may only read/create/patch Secrets in the release namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-hooks
  annotations:
    "helm.sh/hook": {{ $secretHook }}
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-hooks
  annotations:
    "helm.sh/hook": {{ $secretHook }}
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-hooks
  annotations:
    "helm.sh/hook": {{ $secretHook }}
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $full }}-hooks}
subjects:
  - {kind: ServiceAccount, name: {{ $full }}-hooks}
{{- end }}
{{- if $genSecrets }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-secrets
  labels: {{- include "aurora.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $secretHook }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $full }}-hooks
      {{- include "aurora.podSecurity" . | nindent 6 }}
      containers:
        - name: secrets
          image: {{ .Values.hookImage | quote }}
          {{- include "aurora.containerSecurity" . | nindent 10 }}
          env:
            - {name: NAME, value: {{ $secret | quote }}}
            - {name: PG_ENABLED, value: {{ .Values.postgres.enabled | quote }}}
            - {name: PG_HOST, value: {{ printf "%s-postgres" $full | quote }}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export HOME=/tmp
              kubectl get secret "$NAME" >/dev/null 2>&1 || kubectl create secret generic "$NAME"
              # Idempotent: only keys that are absent are written; existing values are never overwritten.
              have() { [ -n "$(kubectl get secret "$NAME" -o "jsonpath={.data.$1}")" ]; }
              put() { case "$2" in ""|k1:|aur_|aun_|auh_) echo "empty generated value for $1" >&2; exit 1;; esac; have "$1" || kubectl patch secret "$NAME" -p "{\"stringData\":{\"$1\":\"$2\"}}" >/dev/null; }
              # The hook image (alpine/k8s) has no openssl: read /dev/urandom. A generator that
              # printed nothing would store an empty value, so every put refuses empty values.
              b64() { head -c 32 /dev/urandom | base64 | tr -d '\n'; }
              hex() { head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
              put AURORA_ENCRYPTION_KEYS "k1:$(b64)"
              put AURORA_ENCRYPTION_ACTIVE_KEY k1
              put AURORA_SIGNING_KEY "$(b64)"
              put AURORA_INTERNAL_SECRET "$(b64)"
              # RFE-007 (docs/08 §4, docs/operator/key-rotation.md): `secrets.rotate.*` APPENDS one new
              # ring entry and never activates it; the operator sets *_ACTIVE_KEY after every
              # service has rolled. A bare value becomes ring `v0` (kept active). Idempotent: if a
              # non-active entry is already pending, nothing is added.
              get() { kubectl get secret "$NAME" -o "jsonpath={.data.$1}" | base64 -d; }
              set_key() { kubectl patch secret "$NAME" -p "{\"stringData\":{\"$1\":\"$2\"}}" >/dev/null; }
              rotate() {
                key=$1; activekey=$2
                cur="$(get "$key")"
                case "$cur" in *:*) list="$cur"; act="$(get "$activekey")";; *) list="v0:$cur"; act=v0;; esac
                [ -n "$act" ] || { echo "$key is a list but $activekey is unset; refusing to rotate" >&2; exit 1; }
                n=$(printf '%s' "$list" | tr ',' '\n' | grep -c .)
                if [ "$n" -ge 2 ]; then echo "$key already has a pending entry; not appending" >&2; return 0; fi
                id="r$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
                set_key "$key" "$list,$id:$(b64)"
                set_key "$activekey" "$act"
                echo "appended ring entry $id to $key (not active)"
              }
              {{- if $rotate.signing }}
              rotate AURORA_SIGNING_KEY AURORA_SIGNING_ACTIVE_KEY
              {{- end }}
              {{- if $rotate.internal }}
              rotate AURORA_INTERNAL_SECRET AURORA_INTERNAL_ACTIVE_KEY
              {{- end }}
              put AURORA_RUNNER_SESSION_KEY "$(b64)"
              put AURORA_RUNNER_TOKEN "aur_$(hex)"
              put AURORA_CONNECTOR_TOKEN "aun_$(hex)"
              # P4-MCON: the connector host's anchor token (given to the api as the bootstrap token).
              put AURORA_CONNECTOR_HOST_TOKEN "auh_$(hex)"
              if [ "$PG_ENABLED" = "true" ]; then
                put POSTGRES_PASSWORD "$(hex)"
                pw="$(kubectl get secret "$NAME" -o 'jsonpath={.data.POSTGRES_PASSWORD}' | base64 -d)"
                put AURORA_DATABASE_URL "postgres://aurora:${pw}@${PG_HOST}:5432/aurora"
              fi
      volumes: [{name: tmp, emptyDir: {}}]
{{- end }}
{{- if $genCA }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-gateway-ca
  labels: {{- include "aurora.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $full }}-hooks
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "aurora.podSecurity" . | nindent 6 }}
      initContainers:
        - name: generate-ca
          image: {{ include "aurora.image" (dict "root" . "name" "aurora-gateway") | quote }}
          args: ["generate-ca", "--out", "/ca"]
          {{- include "aurora.containerSecurity" . | nindent 10 }}
          volumeMounts: [{name: ca, mountPath: /ca}]
      containers:
        - name: store
          image: {{ .Values.hookImage | quote }}
          {{- include "aurora.containerSecurity" . | nindent 10 }}
          env: [{name: NAME, value: {{ $ca | quote }}}]
          volumeMounts: [{name: ca, mountPath: /ca, readOnly: true}, {name: tmp, mountPath: /tmp}]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export HOME=/tmp
              if kubectl get secret "$NAME" >/dev/null 2>&1; then echo "CA secret exists; not overwriting"; exit 0; fi
              kubectl create secret generic "$NAME" --from-file=ca.pem=/ca/ca.pem --from-file=ca.key=/ca/ca.key
      volumes: [{name: ca, emptyDir: {}}, {name: tmp, emptyDir: {}}]
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-migrate
  labels: {{- include "aurora.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10   # tolerates the evaluation Postgres still starting
  template:
    metadata:
      labels: {{- include "aurora.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "aurora.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "aurora.image" (dict "root" . "name" "aurora-api") | quote }}
          args: ["migrate"]
          {{- include "aurora.containerSecurity" . | nindent 10 }}
          env:
            {{- include "aurora.env" (dict "root" . "db" true "keys" (list "AURORA_ENCRYPTION_KEYS" "AURORA_ENCRYPTION_ACTIVE_KEY" "AURORA_INTERNAL_SECRET" "AURORA_SIGNING_KEY" "AURORA_RUNNER_SESSION_KEY") "optionalKeys" (list "AURORA_SIGNING_ACTIVE_KEY" "AURORA_INTERNAL_ACTIVE_KEY")) | nindent 12 }}
            {{- /* `aurora-api migrate` validates the same configuration as the API, so it needs the
                   same extra environment (e.g. AURORA_*_CLIENT_SECRET for OIDC providers): a
                   missing `*_env` variable fails the configuration check before any migration runs. */}}
            {{- with .Values.api.extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          volumeMounts: [{name: config, mountPath: /etc/aurora, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes:
        - {name: config, configMap: {name: {{ $full }}-config}}
        - {name: tmp, emptyDir: {}}
