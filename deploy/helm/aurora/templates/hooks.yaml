{{- $full := include "aurora.fullname" . -}}
{{- $secret := include "aurora.secretName" . -}}
{{- $ca := include "aurora.caSecretName" . -}}
{{- $genSecrets := not .Values.secrets.existingSecret -}}
{{- $genCA := not .Values.gateway.ca.existingSecret -}}
{{- $rotate := .Values.secrets.rotate | default dict -}}
{{- $np := .Values.networkPolicy -}}
{{- /* RFE-007: a rotation request needs the hook on upgrade too (it only appends, never activates).
       P4-MCON: so does a release upgraded from before the connector host, whose Secret has no
       AURORA_CONNECTOR_HOST_TOKEN yet. Every `put` is idempotent (only absent keys are written), so the hook
       runs on every upgrade. */ -}}
{{- $secretHook := "pre-install,pre-upgrade" -}}
{{- /* (FIX-102) One ServiceAccount, Role and RoleBinding per hook Job, with `resourceNames` on get/patch:
       the secrets Job reaches only the generated Secret, the CA Job (install only) only the CA Secret —
       neither can read the other's key material. `create` cannot be restricted by name. */ -}}
{{- if $genCA }}
# CA hook ServiceAccount + Role: creates and reads the gateway CA Secret, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-hooks-ca
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-hooks-ca
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: [{{ $ca | quote }}]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-hooks-ca
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $full }}-hooks-ca}
subjects:
  - {kind: ServiceAccount, name: {{ $full }}-hooks-ca, namespace: {{ .Release.Namespace }}}
{{- end }}
{{- if $genSecrets }}
---
# Secrets hook ServiceAccount + Role: reads and patches the generated Secret, creates it when absent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-hooks
  annotations:
    "helm.sh/hook": {{ $secretHook }}
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $full }}-hooks
  annotations:
    "helm.sh/hook": {{ $secretHook }}
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, patch]
    resourceNames: [{{ $secret | quote }}]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $full }}-hooks
  annotations:
    "helm.sh/hook": {{ $secretHook }}
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $full }}-hooks}
subjects:
  - {kind: ServiceAccount, name: {{ $full }}-hooks, namespace: {{ .Release.Namespace }}}
{{- if .Values.networkPolicy.enabled }}
{{- /* The hook jobs talk to the Kubernetes API with kubectl. On pre-upgrade the release's
       default-deny policy already exists (hooks run before regular resources on upgrade, so
       the policy cannot be one), and the hook pods carry no component label: without an
       allow policy of their own their kubectl calls hang and the upgrade times out. Weight
       -15: after the RBAC (-20), before the secrets job (-10). */}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-hooks
  annotations:
    "helm.sh/hook": {{ $secretHook }}
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "secrets") | nindent 6 }}
  policyTypes: [Egress]
  {{- /* FIX-069/FIX-102: who may the secrets hook reach on 443/6443? In order of preference:
         (1) networkPolicy.kubeApiCidrs, as set by the operator;
         (2) the real API server addresses, read from the `kubernetes` EndpointSlice in `default` at
             install/upgrade time (Helm `lookup`, see the aurora.kubeApiCidrs helper) — /32 each;
         (3) neither (`helm template`/--dry-run, or no `get` on endpointslices in `default`): no rule
             at all — never a silent 0.0.0.0/0; an operator who accepts that sets
             networkPolicy.kubeApiOpen=true. (An empty `to:` would mean "everywhere", so the rule is
             omitted, not emptied.) */}}
  {{- $hookApi := include "aurora.kubeApiCidrs" . | fromJsonArray }}
  {{- if or $hookApi $np.kubeApiOpen }}
  egress:
    - to:
        {{- range $hookApi }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
        {{- if $np.kubeApiOpen }}
        - ipBlock: {cidr: 0.0.0.0/0}
        {{- end }}
      ports:
        {{- range (default (list 443 6443) $np.kubeApiPorts) }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
  {{- end }}
{{- if $np.cilium.enabled }}
---
# Cilium: the API server is the `kube-apiserver` entity, which no NetworkPolicy ipBlock
# matches (mirrors <full>-runner-kube-api in networkpolicy.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $full }}-hooks-kube-api
  annotations:
    "helm.sh/hook": {{ $secretHook }}
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  endpointSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "secrets") | nindent 6 }}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            {{- range (default (list 443 6443) $np.kubeApiPorts) }}
            - {port: {{ . | quote }}, protocol: TCP}
            {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if $genSecrets }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-secrets
  labels: {{- include "aurora.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $secretHook }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "aurora.labels" . | nindent 8 }}
        app.kubernetes.io/component: secrets
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $full }}-hooks
      {{- include "aurora.podSecurity" . | nindent 6 }}
      containers:
        - name: secrets
          image: {{ .Values.hookImage | quote }}
          {{- include "aurora.containerSecurity" . | nindent 10 }}
          env:
            - {name: NAME, value: {{ $secret | quote }}}
            - {name: PG_ENABLED, value: {{ .Values.postgres.enabled | quote }}}
            - {name: PG_HOST, value: {{ printf "%s-postgres" $full | quote }}}
            - {name: GW_ROLE_AUTO, value: {{ ternary "true" "false" (not (empty (include "aurora.gatewayRoleAuto" .))) | quote }}}
            - {name: GW_ROLE, value: {{ include "aurora.gatewayAutoRole" . | quote }}}
            - {name: IS_UPGRADE, value: {{ .Release.IsUpgrade | quote }}}
            - {name: ALLOW_REGENERATE, value: {{ default false .Values.secrets.allowRegenerate | quote }}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export HOME=/tmp
              if ! kubectl get secret "$NAME" >/dev/null 2>&1; then
                # (FIX-102) An upgrade that finds the generated Secret gone (a namespace restore without it,
                # a deleted Secret) must not mint fresh encryption keys: every stored credential would become
                # undecryptable and nothing would say so (the API starts without checking). Restore the
                # Secret (docs/operator/backups.md) or, only if nothing encrypted must survive, set
                # secrets.allowRegenerate=true.
                if [ "$IS_UPGRADE" = "true" ] && [ "$ALLOW_REGENERATE" != "true" ]; then
                  echo "refusing to generate new keys: Secret $NAME is absent on an upgrade, so credentials stored with the old keys would be lost. Restore the Secret from backup (docs/operator/backups.md); to start over deliberately, upgrade again with --set secrets.allowRegenerate=true." >&2
                  exit 1
                fi
                kubectl create secret generic "$NAME"
              fi
              # Idempotent: only keys that are absent are written; existing values are never overwritten.
              have() { [ -n "$(kubectl get secret "$NAME" -o "jsonpath={.data.$1}")" ]; }
              put() { case "$2" in ""|k1:|aur_|aun_|auh_|aul_) echo "empty generated value for $1" >&2; exit 1;; esac; have "$1" || kubectl patch secret "$NAME" -p "{\"stringData\":{\"$1\":\"$2\"}}" >/dev/null; }
              # The hook image (alpine/k8s) has no openssl: read /dev/urandom. A generator that
              # printed nothing would store an empty value, so every put refuses empty values.
              b64() { head -c 32 /dev/urandom | base64 | tr -d '\n'; }
              hex() { head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
              put AURORA_ENCRYPTION_KEYS "k1:$(b64)"
              put AURORA_ENCRYPTION_ACTIVE_KEY k1
              put AURORA_SIGNING_KEY "$(b64)"
              put AURORA_INTERNAL_SECRET "$(b64)"
              # RFE-007 (docs/08 §4, docs/operator/key-rotation.md): `secrets.rotate.*` APPENDS one new
              # ring entry and never activates it; the operator sets *_ACTIVE_KEY after every
              # service has rolled. A bare value becomes ring `v0` (kept active). Idempotent: if a
              # non-active entry is already pending, nothing is added.
              get() { kubectl get secret "$NAME" -o "jsonpath={.data.$1}" | base64 -d; }
              set_key() { kubectl patch secret "$NAME" -p "{\"stringData\":{\"$1\":\"$2\"}}" >/dev/null; }
              rotate() {
                key=$1; activekey=$2
                cur="$(get "$key")"
                case "$cur" in *:*) list="$cur"; act="$(get "$activekey")";; *) list="v0:$cur"; act=v0;; esac
                [ -n "$act" ] || { echo "$key is a list but $activekey is unset; refusing to rotate" >&2; exit 1; }
                n=$(printf '%s' "$list" | tr ',' '\n' | grep -c .)
                if [ "$n" -ge 2 ]; then echo "$key already has a pending entry; not appending" >&2; return 0; fi
                id="r$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
                set_key "$key" "$list,$id:$(b64)"
                set_key "$activekey" "$act"
                echo "appended ring entry $id to $key (not active)"
              }
              {{- if $rotate.signing }}
              rotate AURORA_SIGNING_KEY AURORA_SIGNING_ACTIVE_KEY
              {{- end }}
              {{- if $rotate.internal }}
              rotate AURORA_INTERNAL_SECRET AURORA_INTERNAL_ACTIVE_KEY
              {{- end }}
              put AURORA_RUNNER_SESSION_KEY "$(b64)"
              put AURORA_RUNNER_TOKEN "aur_$(hex)"
              put AURORA_CONNECTOR_TOKEN "aun_$(hex)"
              # P4-MCON: the connector host's anchor token (given to the api as the bootstrap token).
              put AURORA_CONNECTOR_HOST_TOKEN "auh_$(hex)"
              # P4-PRV-2: the relay's anchor token (aul_…). One key: the relay reads it as
              # AURORA_RELAY_TOKEN and the api is handed the same secret key as its
              # AURORA_BOOTSTRAP_RELAY_TOKEN env (workloads.yaml). (FIX-069: a second, never-read
              # secret key AURORA_BOOTSTRAP_RELAY_TOKEN used to be generated here; instances that
              # already have it keep it, harmlessly — nothing reads it and `put` never deletes.)
              put AURORA_RELAY_TOKEN "aul_$(hex)"
              if [ "$PG_ENABLED" = "true" ]; then
                put POSTGRES_PASSWORD "$(hex)"
                pw="$(kubectl get secret "$NAME" -o 'jsonpath={.data.POSTGRES_PASSWORD}' | base64 -d)"
                put AURORA_DATABASE_URL "postgres://aurora:${pw}@${PG_HOST}:5432/aurora"
                # FIX-106 (D-178 Q-R5-11): the gateway's own least-privilege login; the gateway-role
                # Job below creates the role with this password.
                if [ "$GW_ROLE_AUTO" = "true" ]; then
                  put POSTGRES_GATEWAY_PASSWORD "$(hex)"
                  gpw="$(kubectl get secret "$NAME" -o 'jsonpath={.data.POSTGRES_GATEWAY_PASSWORD}' | base64 -d)"
                  put AURORA_GATEWAY_DATABASE_URL "postgres://${GW_ROLE}:${gpw}@${PG_HOST}:5432/aurora"
                fi
              fi
      volumes: [{name: tmp, emptyDir: {}}]
{{- end }}
{{- if $genCA }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-gateway-ca
  labels: {{- include "aurora.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $full }}-hooks-ca
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "aurora.podSecurity" . | nindent 6 }}
      initContainers:
        - name: generate-ca
          image: {{ include "aurora.image" (dict "root" . "name" "aurora-gateway") | quote }}
          args: ["generate-ca", "--out", "/ca"]
          {{- include "aurora.containerSecurity" . | nindent 10 }}
          volumeMounts: [{name: ca, mountPath: /ca}]
      containers:
        - name: store
          image: {{ .Values.hookImage | quote }}
          {{- include "aurora.containerSecurity" . | nindent 10 }}
          env: [{name: NAME, value: {{ $ca | quote }}}]
          volumeMounts: [{name: ca, mountPath: /ca, readOnly: true}, {name: tmp, mountPath: /tmp}]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export HOME=/tmp
              if kubectl get secret "$NAME" >/dev/null 2>&1; then echo "CA secret exists; not overwriting"; exit 0; fi
              kubectl create secret generic "$NAME" --from-file=ca.pem=/ca/ca.pem --from-file=ca.key=/ca/ca.key
      volumes: [{name: ca, emptyDir: {}}, {name: tmp, emptyDir: {}}]
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# (FIX-102) The migrate and gateway-role Jobs' policies are hook resources, like the secrets hook's: on
# `helm upgrade` from a chart that predates them, the hooks run before any regular resource, under the
# previous release's default-deny, and the Job could not reach the database. Database egress only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "migrate") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "aurora.dbEgress" . | nindent 4 }}
{{- if .Values.postgres.enabled }}
---
# ... and the bundled Postgres admits those Jobs (the regular -postgres policy admits api and gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-postgres-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "aurora.peer" (dict "root" . "c" "migrate") | nindent 8 }}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}
{{- end }}
{{- if include "aurora.gatewayRoleAuto" . }}
---
# (FIX-106, D-178 Q-R5-11) The bundled evaluation Postgres gets the gateway's least-privilege login
# role automatically, on install and on every upgrade (so a database that predates this still
# gets it, and the password always matches the Secret). `aurora-api migrate` (next) grants it
# exactly what 03 lists. The pod carries the `migrate` component label: the NetworkPolicies that let
# migrate reach (and be reached by) the database apply to it as well.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-gateway-role
  labels: {{- include "aurora.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10   # tolerates the evaluation Postgres still starting
  template:
    metadata:
      labels: {{- include "aurora.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- include "aurora.podSecurity" . | nindent 6 }}
      containers:
        - name: gateway-role
          image: {{ .Values.postgres.image | quote }}
          {{- include "aurora.containerSecurity" . | nindent 10 }}
          env:
            - {name: HOME, value: /tmp}
            - {name: PGHOST, value: {{ printf "%s-postgres" $full | quote }}}
            - {name: PGUSER, value: aurora}
            - {name: PGDATABASE, value: aurora}
            - {name: GW_ROLE, value: {{ include "aurora.gatewayAutoRole" . | quote }}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: POSTGRES_PASSWORD}}
            - name: GW_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret | quote }}, key: POSTGRES_GATEWAY_PASSWORD}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -q; do sleep 2; done
              # Create the role if it is missing, then (always) set its password and keep it a plain login.
              psql -v ON_ERROR_STOP=1 -v role="$GW_ROLE" -v pw="$GW_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION', :'role', :'pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
              SELECT format('ALTER ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION', :'role', :'pw') \gexec
              SQL
      volumes: [{name: tmp, emptyDir: {}}]
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-migrate
  labels: {{- include "aurora.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10   # tolerates the evaluation Postgres still starting
  template:
    metadata:
      labels: {{- include "aurora.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "aurora.podSecurity" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "aurora.image" (dict "root" . "name" "aurora-api") | quote }}
          args: ["migrate"]
          {{- include "aurora.containerSecurity" . | nindent 10 }}
          env:
            {{- include "aurora.env" (dict "root" . "db" true "keys" (list "AURORA_ENCRYPTION_KEYS" "AURORA_ENCRYPTION_ACTIVE_KEY" "AURORA_INTERNAL_SECRET" "AURORA_SIGNING_KEY" "AURORA_RUNNER_SESSION_KEY") "optionalKeys" (list "AURORA_SIGNING_ACTIVE_KEY" "AURORA_INTERNAL_ACTIVE_KEY")) | nindent 12 }}
            {{- /* `aurora-api migrate` validates the same configuration as the API, so it needs the
                   same extra environment (e.g. AURORA_*_CLIENT_SECRET for OIDC providers): a
                   missing `*_env` variable fails the configuration check before any migration runs. */}}
            {{- with .Values.api.extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          volumeMounts: [{name: config, mountPath: /etc/aurora, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes:
        - {name: config, configMap: {name: {{ $full }}-config}}
        - {name: tmp, emptyDir: {}}
