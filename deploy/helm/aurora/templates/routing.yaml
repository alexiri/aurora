{{- $full := include "aurora.fullname" . -}}
{{- $host := default (include "aurora.host" .) .Values.ingress.host -}}
{{- if .Values.ingress.enabled }}
# Edge rules: /v1/* -> api:4101, /connectors/* -> connector-host:4110 (managed connectors' platform
# callbacks, P4-MCON), everything else -> web:4100. /internal and /metrics are never routed to api.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels: {{- include "aurora.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.secretName }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  {{- /* (P4-PRV-2) with relay.enabled a wildcard rule "*.<domain>" -> relay:4112 is added:
        every preview label is served by the relay (uniform 404 for unknown ones); the
        dashboard host below stays untouched. Wildcard TLS is the operator's ingress config. */}}
  rules:
    {{- if .Values.relay.enabled }}
    - host: {{ printf "*.%s" .Values.relay.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $full }}-relay, port: {number: 4112}}}
    {{- end }}
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if .Values.scim.enabled }}
          # (P4-GRP-2) SCIM provisioning: the /scim/v2 plane, served by the API. Rendered only
          # when the instance switch is on (while off the API answers 404 for every /scim path).
          - path: /scim
            pathType: Prefix
            backend: {service: {name: {{ $full }}-api, port: {number: 4101}}}
          {{- end }}
          - path: /v1
            pathType: Prefix
            backend: {service: {name: {{ $full }}-api, port: {number: 4101}}}
          {{- if .Values.connectorHost.enabled }}
          - path: /connectors
            pathType: Prefix
            backend: {service: {name: {{ $full }}-connector-host, port: {number: 4110}}}
          {{- end }}
          {{- if and .Values.devIdp.enabled .Values.devIdp.pathPrefix }}
          - path: {{ .Values.devIdp.pathPrefix }}
            pathType: Prefix
            backend: {service: {name: {{ $full }}-dev-idp, port: {number: 4107}}}
          {{- end }}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ $full }}-web, port: {number: 4100}}}
{{- end }}
{{- if .Values.gatewayApi.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $full }}
  labels: {{- include "aurora.labels" . | nindent 4 }}
spec:
  {{- with .Values.gatewayApi.parentRefs }}
  parentRefs: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.relay.enabled }}
  hostnames: {{ toJson (concat (default (list $host) .Values.gatewayApi.hostnames) (list (printf "*.%s" .Values.relay.domain))) }}
  {{- else }}
  hostnames: {{ toJson (default (list $host) .Values.gatewayApi.hostnames) }}
  {{- end }}
  {{- /* rules: with relay.enabled a hostname-scoped wildcard rule for the previews domain is prepended. */}}
  rules:
    {{- if .Values.relay.enabled }}
    - hostnames: [{{ printf "*.%s" .Values.relay.domain | quote }}]
      matches:
        - path: {type: PathPrefix, value: /}
      timeouts:
        request: {{ .Values.gatewayApi.requestTimeout }}
      backendRefs:
        - {name: {{ $full }}-relay, port: 4112}
    {{- end }}
    {{- if .Values.scim.enabled }}
    # (P4-GRP-2) SCIM provisioning, see the Ingress above.
    - matches:
        - path: {type: PathPrefix, value: /scim}
      timeouts:
        request: {{ .Values.gatewayApi.requestTimeout }}
      backendRefs:
        - {name: {{ $full }}-api, port: 4101}
    {{- end }}
    - matches:
        - path: {type: PathPrefix, value: /v1}
      timeouts:
        request: {{ .Values.gatewayApi.requestTimeout }}
      backendRefs:
        - {name: {{ $full }}-api, port: 4101}
    {{- if .Values.connectorHost.enabled }}
    - matches:
        - path: {type: PathPrefix, value: /connectors}
      timeouts:
        request: {{ .Values.gatewayApi.requestTimeout }}
      backendRefs:
        - {name: {{ $full }}-connector-host, port: 4110}
    {{- end }}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: {{ $full }}-web, port: 4100}
{{- end }}
