{{- $full := include "aurora.fullname" . -}}
{{- $cfg := deepCopy .Values.config -}}
{{- $_ := set $cfg "server" (merge (dict "external_url" .Values.externalUrl) (default (dict) $cfg.server)) -}}
{{- $k8s := dict "namespace" .Values.sandboxes.namespace "core_namespace" .Release.Namespace "gateway_service" (printf "%s-gateway-proxy" $full) "runner_service" (printf "%s-runner" $full) -}}
{{- with .Values.runner.k8s.storageClass }}{{ $_ := set $k8s "storage_class" . }}{{ end -}}
{{- with .Values.runner.k8s.runtimeClass }}{{ $_ := set $k8s "runtime_class" . }}{{ end -}}
{{- with .Values.runner.k8s.nodeSelector }}{{ $_ := set $k8s "node_selector" . }}{{ end -}}
{{- with .Values.runner.k8s.tolerations }}{{ $_ := set $k8s "tolerations" . }}{{ end -}}
{{- with .Values.runner.sandboxImagePullSecrets }}{{ $_ := set $k8s "image_pull_secrets" . }}{{ end -}}
{{- /* (D-159) sandbox image defaults to the same registry/tag as the service images, so one
      `image.tag` bump retargets every component (the sandbox image is published under the same
      tags as the services, docs/15 §Images). */ -}}
{{- $sandboxImage := printf "aurora-sandbox:%s" (default .Chart.AppVersion .Values.image.tag) -}}
{{- with .Values.image.registry }}{{ $sandboxImage = printf "%s/aurora-sandbox:%s" (trimSuffix "/" .) (default $.Chart.AppVersion $.Values.image.tag) }}{{ end -}}
{{- $sandboxImage := default $sandboxImage .Values.runner.sandboxImage -}}
{{- $_ := set $cfg "runner" (merge (dict "backend" "kubernetes" "api_url" (printf "http://%s-api:4101" $full) "image" (default $sandboxImage ($cfg.runner).image) "k8s" $k8s) (default (dict) $cfg.runner)) -}}
{{- /* (P4-TERM, FIX-053) the web terminal: `terminal.enabled` (top-level) is the single
      operator switch and MIRRORS `config.terminal.enabled` (D-159 semantics, as
      `config.runner.image` is derived): with the config side not explicitly set it renders
      FROM the top-level value, so flipping one key wires the whole feature. The guard fails
      only on real disagreement: both keys set and unequal, or `config.terminal.enabled=true`
      alone — the top-level switch does the chart-level work (the runner :4108 stream listener
      below, the NetworkPolicy api→runner:4108 flows) that the config value alone never
      renders, so config-only-true is refused with an actionable message instead of silently
      half-wiring a route the NetworkPolicy blocks. The limits ride [terminal] unchanged.
      (Must precede the stream-listener block: its `$terminal` reads the mirrored value.) */ -}}
{{- $tm := default (dict) $cfg.terminal -}}
{{- if hasKey $tm "enabled" }}
{{- if and .Values.terminal.enabled (not (get $tm "enabled")) }}{{ fail "terminal.enabled (top-level) mirrors config.terminal.enabled and they disagree; set only terminal.enabled, or make both equal" }}{{ end -}}
{{- if and (not .Values.terminal.enabled) (get $tm "enabled") }}{{ fail "config.terminal.enabled=true alone does not turn the terminal on: set the top-level terminal.enabled — config.terminal.enabled alone leaves the chart's runner :4108 listener and NetworkPolicy wiring off" }}{{ end -}}
{{- else }}
{{- $_ := set $tm "enabled" .Values.terminal.enabled -}}
{{- $_ := set $cfg "terminal" $tm -}}
{{- end -}}
{{- /* (P4-PRV-2, FIX-056) port previews: `relay.enabled` (top-level) is the single
      operator switch and MIRRORS `config.previews.enabled` (D-159 semantics, as
      FIX-053's terminal pair): with the config side not explicitly set it renders
      FROM the top-level value, so flipping one key wires the whole feature. The guard
      fails only on real disagreement: both keys set and unequal, or
      `config.previews.enabled=true` alone — the top-level switch does the chart-level
      work (the relay Deployment/Service/PDB, the wildcard `*.<previews.domain>` edge
      rules and the relay NetworkPolicy posture) that the config value alone never
      renders, so config-only-true is refused with an actionable message instead of
      silently half-wiring a previews feature with no relay to serve it (every share
      answers 502 `preview_unreachable`). The limits ride [previews] unchanged.
      (Must precede the stream-listener block: the shared `stream_bind`/
      `advertised_host` line keys off both features' switches.) */ -}}
{{- $pv := default (dict) $cfg.previews -}}
{{- if hasKey $pv "enabled" }}
{{- if and .Values.relay.enabled (not (get $pv "enabled")) }}{{ fail "relay.enabled (top-level) mirrors config.previews.enabled and they disagree; set only relay.enabled, or make both equal" }}{{ end -}}
{{- if and (not .Values.relay.enabled) (get $pv "enabled") }}{{ fail "config.previews.enabled=true alone does not turn previews on: set the top-level relay.enabled — config alone leaves the chart's relay Deployment and wildcard edge routing off" }}{{ end -}}
{{- else }}
{{- $_ := set $pv "enabled" .Values.relay.enabled -}}
{{- $_ := set $cfg "previews" $pv -}}
{{- end -}}
{{- /* (P4-PRV-2, P4-TERM) the runner's relay/API-facing stream listener: opened when previews
      or the web terminal is on (the runner registers the `terminal` capability and redeems
      `kind: "terminal"` grants on the same listener, `16 §W19`). The value is an address
      (like `ops_bind`); the port is the fixed 4108. The stream listener is in-cluster
      plaintext, so the runner advertises itself by the headless Service name and registers
      `stream_tls: false` (the default): the API hands the relay/leg-1 dialer
      `ws://<advertised_host>:4108` (`16 §W18`/`W19`). */ -}}
{{- $terminal := get (default (dict) $cfg.terminal) "enabled" | default false -}}
{{- if or .Values.relay.enabled $terminal }}{{- $_ := set $cfg.runner "stream_bind" "0.0.0.0" -}}{{- $_ := set $cfg.runner "advertised_host" (printf "%s-runner" $full) -}}{{- end -}}
{{- $_ := set $cfg "connector_host" (merge (dict "api_url" (printf "http://%s-api:4101" $full) "test_types" (.Values.connectorHost.testTypes | default false)) (default (dict) $cfg.connector_host)) -}}
{{- /* (P4-GRP-2) SCIM: the rate limit is chart-owned; `enabled` itself comes from [scim] in
      the operator's config (the chart comment points there) — the edge route follows
      `scim.enabled` below. */ -}}
{{- $_ := set $cfg "scim" (merge (dict "rate_per_minute" .Values.scim.ratePerMinute) (default (dict) $cfg.scim)) -}}
{{- if .Values.scim.enabled }}{{ $_ := set (default (dict) $cfg).scim "enabled" true }}{{ end -}}
{{- /* (P4-PRV-2, FIX-056) the chart-level wiring renders only from the top-level switch:
      the relay workload, the wildcard edge rules and the NetworkPolicy posture below all
      read `.Values.relay.enabled` (never the config side). The domain and the [relay]
      limits render as before. */ -}}
{{- if .Values.relay.enabled }}
{{- if not .Values.relay.domain }}{{ fail "relay.domain is required when relay.enabled (the preview DNS suffix, e.g. preview.example.org)" }}{{ end -}}
{{- $pv = default (dict) $cfg.previews -}}
{{- $_ := set $pv "domain" .Values.relay.domain -}}
{{- $_ := set $cfg "previews" $pv -}}
{{- $rl := dict "api_url" (printf "http://%s-api:4101" $full) "listen" "0.0.0.0:4112" "ops_port" 4193 "previews_domain" .Values.relay.domain "max_streams" (int .Values.relay.max_streams) "max_streams_per_user" (int .Values.relay.max_streams_per_user) "request_body_max_bytes" (int .Values.relay.request_body_max_bytes) "trusted_proxies" (default (list) .Values.relay.trusted_proxies) -}}
{{- $_ := set $cfg "relay" (merge $rl (default (dict) $cfg.relay)) -}}
{{- end -}}
{{- /* (P4-GSL, D-154) the API reaches the gateway's internal port (library fetch) by this release's Service name */ -}}
{{- $_ := set $cfg "api" (merge (dict "gateway_internal_url" (printf "http://%s-gateway:4103" $full)) (default (dict) $cfg.api)) -}}
{{- $_ := set $cfg "database" (merge (dict "max_connections" .Values.database.maxConnections.api) (default (dict) $cfg.database)) -}}
{{- if ne (not (not .Values.database.gatewayRole)) (not (not .Values.database.gatewayExistingSecret)) }}{{ fail "database.gatewayRole and database.gatewayExistingSecret go together: set both (the gateway then connects as that least-privilege role) or neither (the gateway uses the main database user). See docs/operator/install-helm.md, Database." }}{{ end -}}
{{- /* (FIX-106, D-178 Q-R5-11) The gateway's least-privilege role is the rule: the bundled evaluation Postgres creates it
      automatically; with an external database the chart refuses to render without the pair unless the operator says,
      explicitly, that the gateway may share the main login (database.allowSharedLogin). */ -}}
{{- if and .Values.database.allowSharedLogin (or .Values.database.gatewayRole .Values.database.gatewayExistingSecret) }}{{ fail "database.allowSharedLogin and the least-privilege pair (database.gatewayRole + database.gatewayExistingSecret) contradict each other: set the pair (recommended) or allowSharedLogin, not both. See docs/operator/install-helm.md, Database." }}{{ end -}}
{{- if and (not .Values.postgres.enabled) (not .Values.database.gatewayRole) (not .Values.database.allowSharedLogin) }}{{ fail "the gateway needs its own least-privilege database role with an external database. Create the role and a Secret that logs in as it, then set database.gatewayRole and database.gatewayExistingSecret (docs/operator/install-helm.md, Database); or, knowing that the gateway then runs with the main database login and every privilege it has, set database.allowSharedLogin=true." }}{{ end -}}
{{- if .Values.database.gatewayRole }}{{ $_ := set $cfg.database "gateway_role" .Values.database.gatewayRole }}{{ end -}}
{{- if include "aurora.gatewayRoleAuto" . }}{{ $_ := set $cfg.database "gateway_role" (include "aurora.gatewayAutoRole" .) }}{{ end -}}
{{- /* (RFE-002) proxy listener certificate: the Service names, the external host and extra names */ -}}
{{- $px := printf "%s-gateway-proxy" $full -}}
{{- $ptNames := list "aurora-gateway" $px (printf "%s.%s" $px .Release.Namespace) (printf "%s.%s.svc" $px .Release.Namespace) (printf "%s.%s.svc.cluster.local" $px .Release.Namespace) -}}
{{- with .Values.gateway.proxy.tls.externalHost }}{{ $ptNames = append $ptNames . }}{{ end -}}
{{- range .Values.gateway.proxy.tls.names }}{{ $ptNames = append $ptNames . }}{{ end -}}
{{- $pt := dict "names" $ptNames -}}
{{- if .Values.gateway.proxy.tls.existingSecret }}{{ $_ := set $pt "cert_file" "/var/lib/aurora/proxy-tls/tls.crt" }}{{ $_ := set $pt "key_file" "/var/lib/aurora/proxy-tls/tls.key" }}{{ end -}}
{{- $gw := dict "ca_dir" "/var/lib/aurora/ca" "proxy_tls" $pt -}}
{{- /* (RFE-025) layer-4 load balancers that send a PROXY protocol header (gateway.trusted_proxies) */ -}}
{{- with .Values.gateway.proxy.trustedProxies }}{{ $_ := set $gw "trusted_proxies" . }}{{ end -}}
{{- /* (FIX-104, D-180) gateway.insecure_loopback_injection is a test-only key: the chart never renders it, not even through the free-form `config` values */ -}}
{{- if hasKey (default (dict) $cfg.gateway) "insecure_loopback_injection" }}{{ fail "config.gateway.insecure_loopback_injection is for tests only and cannot be set through the chart (docs/15, docs/23)" }}{{ end -}}
{{- $_ := set $cfg "gateway" (merge $gw (default (dict) $cfg.gateway)) -}}
{{- if not (has .Values.plugins.source (list "none" "configMap" "pvc")) }}{{ fail "plugins.source must be none, configMap or pvc" }}{{ end -}}
{{- if and (eq .Values.plugins.source "configMap") (not .Values.plugins.configMapName) }}{{ fail "plugins.configMapName is required when plugins.source is configMap" }}{{ end -}}
{{- if and (eq .Values.plugins.source "pvc") (not .Values.plugins.pvcName) }}{{ fail "plugins.pvcName is required when plugins.source is pvc" }}{{ end -}}
{{- $_ := set $cfg "plugins" (merge (dict "dir" .Values.plugins.dir) (default (dict) $cfg.plugins)) -}}
{{- /* tls.extra_ca_bundle: the mounted PEM bundle (every workload trusts it for outbound TLS) */ -}}
{{- if and .Values.extraCaBundle.existingConfigMap .Values.extraCaBundle.existingSecret }}{{ fail "extraCaBundle: set existingConfigMap or existingSecret, not both" }}{{ end -}}
{{- if or .Values.extraCaBundle.existingConfigMap .Values.extraCaBundle.existingSecret }}
{{- $_ := set $cfg "tls" (merge (dict "extra_ca_bundle" (printf "/etc/aurora-tls/%s" .Values.extraCaBundle.key)) (default (dict) $cfg.tls)) -}}
{{- end -}}
{{- if .Values.devIdp.enabled }}
{{- if not (regexMatch "^https?://(localhost|127\\.0\\.0\\.1|\\[::1\\]|[A-Za-z0-9.-]+\\.localhost)(:[0-9]+)?/?$" .Values.externalUrl) }}{{ fail "devIdp.enabled is development only: externalUrl must be a loopback origin (localhost, *.localhost, 127.0.0.1, [::1])" }}{{ end -}}
{{- $auth := default (dict) $cfg.auth -}}
{{- $_ := set $auth "dev_idp" (dict "enabled" true "issuer" (default (printf "%s%s" (trimSuffix "/" .Values.externalUrl) .Values.devIdp.pathPrefix) .Values.devIdp.issuer) "internal_url" (printf "http://%s-dev-idp:4107%s" $full .Values.devIdp.pathPrefix)) -}}
{{- $_ := set $cfg "auth" $auth -}}
{{- end -}}
{{- /* (P4-CNT, D-119) shared rate-limit counters: rendered only when a shared backend is chosen,
       so the default produces the same manifests as before. */ -}}
{{- $cn := .Values.counters | default dict -}}
{{- $cnBackend := default "memory" $cn.backend -}}
{{- if not (has $cnBackend (list "memory" "postgres" "redis")) }}{{ fail "counters.backend must be memory, postgres or redis" }}{{ end -}}
{{- $cnOnU := default (dict) $cn.onUnavailable -}}
{{- range $c := list "security" "management" "gateway" }}
{{- $v := default "local" (get $cnOnU $c) -}}
{{- if not (has $v (list "local" "closed")) }}{{ fail (printf "counters.onUnavailable.%s must be local or closed (there is no open: a counter outage must never remove a limit)" $c) }}{{ end -}}
{{- end -}}
{{- if ne $cnBackend "memory" }}
{{- $cnRedis := default (dict) $cn.redis -}}
{{- $ctr := dict "backend" $cnBackend "api" (default "shared" $cn.api) "gateway" (default "shared" $cn.gateway) "timeout_ms" (default 50 $cn.timeoutMs) "on_unavailable" (dict "security" (default "local" $cnOnU.security) "management" (default "local" $cnOnU.management) "gateway" (default "local" $cnOnU.gateway)) "postgres" (dict "pool_size" (default 4 (default (dict) $cn.postgres).poolSize)) -}}
{{- if eq $cnBackend "redis" }}
{{- if not $cnRedis.address }}{{ fail "counters.redis.address is required when counters.backend is redis (rediss://host:port)" }}{{ end -}}
{{- if contains "@" $cnRedis.address }}{{ fail "counters.redis.address must not carry credentials: put them in counters.redis.existingSecret" }}{{ end -}}
{{- $rd := dict "address" $cnRedis.address "allow_plaintext" (default false $cnRedis.allowPlaintext) "db" (default 0 $cnRedis.db) "key_prefix" (default "aurora:rl:" $cnRedis.keyPrefix) -}}
{{- if $cnRedis.existingSecret }}{{ $_ := set $rd "username_env" "AURORA_COUNTERS_REDIS_USERNAME" }}{{ $_ := set $rd "password_env" "AURORA_COUNTERS_REDIS_PASSWORD" }}{{ end -}}
{{- with $cnRedis.caFile }}{{ $_ := set $rd "ca_file" . }}{{ end -}}
{{- $_ := set $ctr "redis" $rd -}}
{{- end -}}
{{- $rl := default (dict) $cfg.ratelimit -}}
{{- $_ := set $rl "counters" (merge $ctr (default (dict) $rl.counters)) -}}
{{- $_ := set $cfg "ratelimit" $rl -}}
{{- end -}}
{{- /* Vault store: api and gateway each get their own config (their own Vault role). */ -}}
{{- $gwCfg := deepCopy $cfg -}}
{{- if .Values.vault.enabled }}
{{- $_ := set $cfg "secrets" (include "aurora.vaultSecrets" (dict "root" . "cfg" $cfg "svc" "api") | fromJson) -}}
{{- $_ := set $gwCfg "secrets" (include "aurora.vaultSecrets" (dict "root" . "cfg" $gwCfg "svc" "gateway") | fromJson) -}}
{{- end -}}
# Pre-install hook: the migrate job needs the config before regular resources exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-config
  labels: {{- include "aurora.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  aurora.toml: |
    {{- regexReplaceAll "(?m)= (-?[0-9]+)\\.0$" (toToml $cfg) "= ${1}" | nindent 4 }}
{{- if .Values.vault.enabled }}
  aurora-gateway.toml: |
    {{- regexReplaceAll "(?m)= (-?[0-9]+)\\.0$" (toToml $gwCfg) "= ${1}" | nindent 4 }}
{{- end }}
