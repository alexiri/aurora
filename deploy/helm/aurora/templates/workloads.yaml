{{- $r := . -}}
{{- $full := include "aurora.fullname" . -}}
{{- $common := list "AURORA_ENCRYPTION_KEYS" "AURORA_ENCRYPTION_ACTIVE_KEY" "AURORA_INTERNAL_SECRET" -}}
{{- $apiKeys := concat $common (list "AURORA_SIGNING_KEY" "AURORA_RUNNER_SESSION_KEY") -}}
{{- $apiEnv := include "aurora.env" (dict "root" . "db" true "keys" $apiKeys "optionalKeys" (list "AURORA_SIGNING_ACTIVE_KEY" "AURORA_INTERNAL_ACTIVE_KEY")) -}}
{{- $apiEnv = printf "%s%s%s" $apiEnv (include "aurora.vaultEnv" (dict "root" . "svc" "api")) (include "aurora.countersEnv" .) -}}
{{- /* The gateway reads its own config file when Vault is on (its own Vault role). */ -}}
{{- $gwConfig := ternary "aurora-gateway.toml" "aurora.toml" .Values.vault.enabled -}}
{{- if .Values.api.bootstrap.runnerToken }}
{{- $apiEnv = printf "%s\n- name: AURORA_BOOTSTRAP_RUNNER_TOKEN\n  valueFrom: {secretKeyRef: {name: %s, key: AURORA_RUNNER_TOKEN}}" $apiEnv (include "aurora.secretName" .) }}
{{- end }}
{{- if and .Values.connectorHost.enabled .Values.api.bootstrap.connectorHostToken }}
{{- $apiEnv = printf "%s\n- name: AURORA_BOOTSTRAP_CONNECTOR_HOST_TOKEN\n  valueFrom: {secretKeyRef: {name: %s, key: AURORA_CONNECTOR_HOST_TOKEN}}" $apiEnv (include "aurora.secretName" .) }}
{{- end }}
{{ include "aurora.workload" (dict "root" . "name" "api" "spec" .Values.api "caCert" true "vaultToken" true "image" (include "aurora.image" (dict "root" . "name" "aurora-api")) "args" (list "serve") "env" $apiEnv "pluginsMount" true "ports" (list (dict "name" "http" "port" 4101) (dict "name" "internal" "port" 4111))) }}
---
{{ include "aurora.workload" (dict "root" . "name" "hookhost" "spec" .Values.hookhost "image" (include "aurora.image" (dict "root" . "name" "aurora-hookhost")) "args" (list "serve") "env" (include "aurora.env" (dict "root" . "keys" (list "AURORA_INTERNAL_SECRET") "optionalKeys" (list "AURORA_INTERNAL_ACTIVE_KEY"))) "ports" (list (dict "name" "http" "port" 4104))) }}
---
{{ include "aurora.workload" (dict "root" . "name" "web" "spec" .Values.web "image" (include "aurora.image" (dict "root" . "name" "aurora-web")) "env" (include "aurora.env" (dict "root" .)) "ports" (list (dict "name" "http" "port" 4100))) }}
---
{{/* gateway: Service for 4103 (internal) is separate from the proxy Service (4102, TLS-only: RFE-002) */}}
{{ include "aurora.workload" (dict "root" . "name" "gateway" "spec" .Values.gateway "ca" true "vaultToken" true "image" (include "aurora.image" (dict "root" . "name" "aurora-gateway")) "args" (list "serve") "proxyTlsSecret" .Values.gateway.proxy.tls.existingSecret "env" (printf "%s%s\n- name: POD_NAMESPACE\n  valueFrom: {fieldRef: {fieldPath: metadata.namespace}}" (include "aurora.env" (dict "root" . "db" true "gatewayDb" true "configFile" $gwConfig "keys" $common "optionalKeys" (list "AURORA_INTERNAL_ACTIVE_KEY"))) (printf "%s%s" (include "aurora.vaultEnv" (dict "root" . "svc" "gateway")) (include "aurora.countersEnv" .))) "ports" (list (dict "name" "internal" "port" 4103) (dict "name" "proxy" "port" 4102 "skipService" true))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-gateway-proxy
  labels: {{- include "aurora.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.proxy.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.proxy.service.type }}
  selector: {{- include "aurora.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - {name: proxy, port: 4102, targetPort: 4102}
  {{- with .Values.gateway.proxy.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.runner.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-runner
  labels: {{- include "aurora.labels" . | nindent 4 }}
---
{{ include "aurora.workload" (dict "root" . "name" "runner" "spec" .Values.runner "serviceAccount" (printf "%s-runner" $full) "image" (include "aurora.image" (dict "root" . "name" "aurora-runner")) "args" (list "serve") "env" (include "aurora.env" (dict "root" . "keys" (list "AURORA_RUNNER_SESSION_KEY" "AURORA_RUNNER_TOKEN"))) "ports" (list (dict "name" "http" "port" 4105))) }}
{{- end }}
{{- if .Values.connectorHost.enabled }}
---
{{/* connector host (P4-MCON): callbacks 4110 (Service, routed by the edge under /connectors), ops 4192 (no Service) */}}
{{ include "aurora.workload" (dict "root" . "name" "connector-host" "spec" .Values.connectorHost "image" (include "aurora.image" (dict "root" . "name" "aurora-connector-host")) "args" (list "serve") "env" (include "aurora.env" (dict "root" . "keys" (list "AURORA_CONNECTOR_HOST_TOKEN"))) "ports" (list (dict "name" "callbacks" "port" 4110) (dict "name" "ops" "port" 4192 "skipService" true))) }}
{{- end }}
{{- range .Values.connectors }}
{{- $c := . }}
---
{{ include "aurora.workload" (dict "root" $r "name" (printf "connector-%s" .id) "spec" (dict "replicas" (default 1 .replicas) "resources" (default (dict "requests" (dict "cpu" "50m" "memory" "64Mi")) .resources) "extraEnv" (default (list) .env)) "image" (include "aurora.image" (dict "root" $r "name" (printf "aurora-connector-%s" .id) "override" .image)) "args" (list "serve") "env" (printf "%s\n- name: AURORA_CONNECTOR_TOKEN\n  valueFrom: {secretKeyRef: {name: %s, key: %s}}" (include "aurora.env" (dict "root" $r)) .tokenSecret.name .tokenSecret.key) "ports" (list (dict "name" "callback" "port" (default 4190 .callbackPort)))) }}
{{- if and .callbackIngress .callbackIngress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-connector-{{ .id }}
  labels: {{- include "aurora.labels" $r | nindent 4 }}
spec:
  {{- with $r.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .callbackIngress.host | quote }}
      http:
        paths:
          - path: {{ default "/" .callbackIngress.path }}
            pathType: Prefix
            backend: {service: {name: {{ $full }}-connector-{{ .id }}, port: {number: {{ default 4190 .callbackPort }}}}}
{{- end }}
{{- end }}
