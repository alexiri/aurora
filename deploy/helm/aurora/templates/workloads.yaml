{{- $r := . -}}
{{- $full := include "aurora.fullname" . -}}
{{- $common := list "AURORA_ENCRYPTION_KEYS" "AURORA_ENCRYPTION_ACTIVE_KEY" "AURORA_INTERNAL_SECRET" -}}
{{- $apiKeys := concat $common (list "AURORA_SIGNING_KEY" "AURORA_RUNNER_SESSION_KEY") -}}
{{- $apiEnv := include "aurora.env" (dict "root" . "db" true "keys" $apiKeys "optionalKeys" (list "AURORA_SIGNING_ACTIVE_KEY" "AURORA_INTERNAL_ACTIVE_KEY")) -}}
{{- $apiEnv = printf "%s%s%s" $apiEnv (include "aurora.vaultEnv" (dict "root" . "svc" "api")) (include "aurora.countersEnv" .) -}}
{{- $apiEnv = printf "%s%s" $apiEnv (include "aurora.pushEnv" .) -}}
{{- /* The gateway reads its own config file when Vault is on (its own Vault role). */ -}}
{{- $gwConfig := ternary "aurora-gateway.toml" "aurora.toml" .Values.vault.enabled -}}
{{- if .Values.api.bootstrap.runnerToken }}
{{- $apiEnv = printf "%s\n- name: AURORA_BOOTSTRAP_RUNNER_TOKEN\n  valueFrom: {secretKeyRef: {name: %s, key: AURORA_RUNNER_TOKEN}}" $apiEnv (include "aurora.secretName" .) }}
{{- end }}
{{- if and .Values.connectorHost.enabled .Values.api.bootstrap.connectorHostToken }}
{{- $apiEnv = printf "%s\n- name: AURORA_BOOTSTRAP_CONNECTOR_HOST_TOKEN\n  valueFrom: {secretKeyRef: {name: %s, key: AURORA_CONNECTOR_HOST_TOKEN}}" $apiEnv (include "aurora.secretName" .) }}
{{- end }}
{{- if and .Values.connectorHost.enabled .Values.connectorHost.perHostToken }}
{{- /* FIX-120: the bound per-host token(s), as JSON the hooks job wrote into the Secret. */}}
{{- $apiEnv = printf "%s\n- name: AURORA_BOOTSTRAP_CONNECTOR_HOST_TOKENS\n  valueFrom: {secretKeyRef: {name: %s, key: AURORA_BOOTSTRAP_CONNECTOR_HOST_TOKENS}}" $apiEnv (include "aurora.secretName" .) }}
{{- end }}
{{- if .Values.relay.enabled }}
{{- $apiEnv = printf "%s\n- name: AURORA_BOOTSTRAP_RELAY_TOKEN\n  valueFrom: {secretKeyRef: {name: %s, key: AURORA_RELAY_TOKEN}}" $apiEnv (include "aurora.secretName" .) }}
{{- end }}
{{- if .Values.ssh.enabled }}
{{- /* (P4-SSH-2) the CA private key goes into the api pods ONLY; the terminator's anchor token is the same
       secret key the terminator reads as AURORA_TERMINATOR_TOKEN. */}}
{{- $apiEnv = printf "%s\n- name: AURORA_SSH_CA_KEY\n  valueFrom: {secretKeyRef: {name: %s, key: AURORA_SSH_CA_KEY}}\n- name: AURORA_BOOTSTRAP_TERMINATOR_TOKEN\n  valueFrom: {secretKeyRef: {name: %s, key: AURORA_TERMINATOR_TOKEN}}" $apiEnv (include "aurora.secretName" .) (include "aurora.secretName" .) }}
{{- end }}
{{ include "aurora.workload" (dict "root" . "name" "api" "probePort" 4101 "spec" .Values.api "caCert" true "vaultToken" true "image" (include "aurora.image" (dict "root" . "name" "aurora-api")) "args" (list "serve") "env" $apiEnv "pluginsMount" true "ports" (list (dict "name" "http" "port" 4101) (dict "name" "internal" "port" 4111))) }}
---
{{ include "aurora.workload" (dict "root" . "name" "hookhost" "probePort" 4104 "spec" .Values.hookhost "image" (include "aurora.image" (dict "root" . "name" "aurora-hookhost")) "args" (list "serve") "env" (include "aurora.env" (dict "root" . "keys" (list "AURORA_INTERNAL_SECRET") "optionalKeys" (list "AURORA_INTERNAL_ACTIVE_KEY"))) "ports" (list (dict "name" "http" "port" 4104))) }}
---
{{- /* (FIX-146 Part C, D-232) the dashboard loads its tracing code only when this is set: rendered only with an OTLP endpoint */}}
{{- $webEnv := include "aurora.env" (dict "root" .) }}
{{- $tel := .Values.config.telemetry | default dict }}
{{- if $tel.otlp_endpoint }}
{{- /* hasKey, not `default`: a ratio of 0 (export nothing) must stay 0 */}}
{{- $ratio := ternary $tel.sample_ratio 1.0 (hasKey $tel "sample_ratio") }}
{{- $webEnv = printf "%s\n- {name: AURORA_TRACING_SAMPLE_RATIO, value: %s}" $webEnv ($ratio | toString | quote) }}
{{- end }}
{{ include "aurora.workload" (dict "root" . "name" "web" "spec" .Values.web "image" (include "aurora.image" (dict "root" . "name" "aurora-web")) "env" $webEnv "ports" (list (dict "name" "http" "port" 4100))) }}
---
{{/* gateway: Service for 4103 (internal) is separate from the proxy Service (4102, TLS-only: RFE-002) */}}
{{ include "aurora.workload" (dict "root" . "name" "gateway" "probePort" 4103 "spec" .Values.gateway "ca" true "vaultToken" true "image" (include "aurora.image" (dict "root" . "name" "aurora-gateway")) "args" (list "serve") "proxyTlsSecret" .Values.gateway.proxy.tls.existingSecret "env" (printf "%s%s\n- name: POD_NAMESPACE\n  valueFrom: {fieldRef: {fieldPath: metadata.namespace}}" (include "aurora.env" (dict "root" . "db" true "gatewayDb" true "configFile" $gwConfig "keys" $common "optionalKeys" (list "AURORA_INTERNAL_ACTIVE_KEY"))) (printf "%s%s" (include "aurora.vaultEnv" (dict "root" . "svc" "gateway")) (include "aurora.countersEnv" .))) "ports" (list (dict "name" "internal" "port" 4103) (dict "name" "proxy" "port" 4102 "skipService" true))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-gateway-proxy
  labels: {{- include "aurora.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.proxy.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.proxy.service.type }}
  selector: {{- include "aurora.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - {name: proxy, port: 4102, targetPort: 4102}
  {{- with .Values.gateway.proxy.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.runner.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $full }}-runner
  labels: {{- include "aurora.labels" . | nindent 4 }}
---
{{ include "aurora.workload" (dict "root" . "name" "runner" "probePort" 4106 "spec" .Values.runner "serviceAccount" (printf "%s-runner" $full) "image" (include "aurora.image" (dict "root" . "name" "aurora-runner")) "args" (list "serve") "env" (include "aurora.env" (dict "root" . "keys" (list "AURORA_RUNNER_SESSION_KEY" "AURORA_RUNNER_TOKEN"))) "ports" (list (dict "name" "http" "port" 4105) (dict "name" "streams" "port" 4108) (dict "name" "ops" "port" 4106 "skipService" true))) }}
{{- end }}
{{- if .Values.relay.enabled }}
---
{{/* port-previews relay (P4-PRV-2): edge 4112 (Service, wildcard-routed by routing.yaml),
     ops 4193 (health/metrics, no Service). The relay token is the AURORA_RELAY_TOKEN secret. */}}
{{ include "aurora.workload" (dict "root" . "name" "relay" "probePort" 4193 "spec" .Values.relay "image" (include "aurora.image" (dict "root" . "name" "aurora-relay")) "args" (list "serve") "env" (include "aurora.env" (dict "root" . "keys" (list "AURORA_RELAY_TOKEN"))) "ports" (list (dict "name" "edge" "port" 4112) (dict "name" "ops" "port" 4193 "skipService" true))) }}
{{- end }}
{{- if .Values.ssh.enabled }}
---
{{/* SSH terminator (P4-SSH-2, docs/15 §SSH access): SSH on 2222 (published by the LoadBalancer/NodePort
     Service below, not by the workload's own Service), ops 4194 (headless Service for the metrics). No
     service-account token (the helper's default), no database URL, no Vault; the host key and the
     anchor token are the only secrets it gets. */}}
{{ include "aurora.workload" (dict "root" . "name" "terminator" "probePort" 4194 "headless" true "spec" .Values.terminator "image" (include "aurora.image" (dict "root" . "name" "aurora-terminator")) "args" (list "serve") "env" (include "aurora.env" (dict "root" . "keys" (list "AURORA_TERMINATOR_TOKEN" "AURORA_SSH_HOST_KEY"))) "ports" (list (dict "name" "ssh" "port" 2222 "skipService" true) (dict "name" "ops" "port" 4194))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-terminator-ssh
  labels: {{- include "aurora.labels" . | nindent 4 }}
    app.kubernetes.io/component: terminator
  {{- with .Values.terminator.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.terminator.service.type }}
  {{- if eq .Values.terminator.service.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.terminator.service.externalTrafficPolicy }}
  {{- end }}
  selector: {{- include "aurora.selector" (dict "root" . "component" "terminator") | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.terminator.service.port }}
      targetPort: 2222
      {{- if and (eq .Values.terminator.service.type "NodePort") .Values.terminator.service.nodePort }}
      nodePort: {{ .Values.terminator.service.nodePort }}
      {{- end }}
  {{- with .Values.terminator.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.connectorHost.enabled }}
---
{{/* connector host (P4-MCON): callbacks 4110 (Service, routed by the edge under /connectors), ops 4192 (no Service) */}}
{{ include "aurora.workload" (dict "root" . "name" "connector-host" "connectorCa" true "probePort" 4192 "spec" .Values.connectorHost "image" (include "aurora.image" (dict "root" . "name" "aurora-connector-host")) "args" (list "serve") "env" (ternary (printf "%s\n- name: AURORA_CONNECTOR_HOST_TOKEN\n  valueFrom: {secretKeyRef: {name: %s, key: AURORA_CONNECTOR_HOST_TOKEN_BOUND}}" (include "aurora.env" (dict "root" . "keys" (list))) (include "aurora.secretName" .)) (include "aurora.env" (dict "root" . "keys" (list "AURORA_CONNECTOR_HOST_TOKEN"))) (not (not .Values.connectorHost.perHostToken))) "ports" (list (dict "name" "callbacks" "port" 4110) (dict "name" "ops" "port" 4192 "skipService" true))) }}
{{- end }}
{{- range .Values.connectors }}
{{- $c := . }}
---
{{ include "aurora.workload" (dict "root" $r "name" (printf "connector-%s" .id) "connectorCa" true "spec" (dict "replicas" (default 1 .replicas) "resources" (default (dict "requests" (dict "cpu" "50m" "memory" "64Mi")) .resources) "extraEnv" (default (list) .env)) "image" (include "aurora.image" (dict "root" $r "name" (printf "aurora-connector-%s" .id) "override" .image)) "args" (list "serve") "env" (printf "%s\n- name: AURORA_CONNECTOR_TOKEN\n  valueFrom: {secretKeyRef: {name: %s, key: %s}}" (include "aurora.env" (dict "root" $r)) .tokenSecret.name .tokenSecret.key) "ports" (list (dict "name" "callback" "port" (default 4190 .callbackPort)))) }}
{{- if and .callbackIngress .callbackIngress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-connector-{{ .id }}
  labels: {{- include "aurora.labels" $r | nindent 4 }}
spec:
  {{- with $r.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .callbackIngress.host | quote }}
      http:
        paths:
          - path: {{ default "/" .callbackIngress.path }}
            pathType: Prefix
            backend: {service: {name: {{ $full }}-connector-{{ .id }}, port: {number: {{ default 4190 .callbackPort }}}}}
{{- end }}
{{- end }}
