{{- if .Values.networkPolicy.enabled }}
{{- $full := include "aurora.fullname" . -}}
{{- $ns := .Release.Namespace -}}
{{- $sb := .Values.sandboxes.namespace -}}
{{- $np := .Values.networkPolicy -}}
{{- $inst := .Release.Name -}}
# ---- core namespace: default deny ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-default-deny, namespace: {{ $ns }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-allow-dns, namespace: {{ $ns }}}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {{- toYaml $np.dnsNamespaceSelector | nindent 14 }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# api: ingress from edge, web (SSR), runner, hookhost, connectors, gateway; 4111 internal from hookhost/gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-api, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $np.edgeNamespaceSelector | nindent 14 }}
        {{- include "aurora.peer" (dict "root" . "c" "web") | nindent 8 }}
        {{- include "aurora.peer" (dict "root" . "c" "runner") | nindent 8 }}
        {{- include "aurora.peer" (dict "root" . "c" "hookhost") | nindent 8 }}
        {{- include "aurora.peer" (dict "root" . "c" "gateway") | nindent 8 }}
        {{- range .Values.connectors }}
        {{- include "aurora.peer" (dict "root" $ "c" (printf "connector-%s" .id)) | nindent 8 }}
        {{- end }}
        {{- if .Values.connectorHost.enabled }}
        {{- include "aurora.peer" (dict "root" . "c" "connector-host") | nindent 8 }}
        {{- end }}
        {{- if .Values.relay.enabled }}
        {{- include "aurora.peer" (dict "root" . "c" "relay") | nindent 8 }}
        {{- end }}
      ports: [{protocol: TCP, port: 4101}]
    - from:
        {{- include "aurora.peer" (dict "root" . "c" "hookhost") | nindent 8 }}
        {{- include "aurora.peer" (dict "root" . "c" "gateway") | nindent 8 }}
      ports: [{protocol: TCP, port: 4111}]
  egress:
    {{- include "aurora.dbEgress" . | nindent 4 }}
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "hookhost") | nindent 8 }}
      ports: [{protocol: TCP, port: 4104}]
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "gateway") | nindent 8 }}
      ports: [{protocol: TCP, port: 4103}]
    {{- /* (P4-TERM, C-617) the terminal's leg 1: the api dials the runner's stream listener
         :4108 with the minted `auy_` grant and bridges the browser's WebSocket onto it. */ -}}
    {{- if .Values.terminal.enabled }}
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "runner") | nindent 8 }}
      ports: [{protocol: TCP, port: 4108}]
    {{- end }}
    {{- if .Values.devIdp.enabled }}
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "dev-idp") | nindent 8 }}
      ports: [{protocol: TCP, port: 4107}]
    {{- end }}
    {{- include "aurora.vaultEgress" . | nindent 4 }}
    {{- with (include "aurora.countersEgress" .) }}{{ . | nindent 4 }}{{ end }}
    {{- include "aurora.external" . | nindent 4 }}
{{- if .Values.devIdp.enabled }}
---
# dev-idp (development only): ingress from the edge (browser) and the api (discovery/token/JWKS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-dev-idp, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "dev-idp") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $np.edgeNamespaceSelector | nindent 14 }}
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
      ports: [{protocol: TCP, port: 4107}]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-web, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $np.edgeNamespaceSelector | nindent 14 }}
      ports: [{protocol: TCP, port: 4100}]
  egress:
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
      ports: [{protocol: TCP, port: 4101}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-gateway, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $sb }}}}
        {{- if eq .Values.gateway.proxy.service.type "LoadBalancer" }}
        - ipBlock: {cidr: 0.0.0.0/0}   # external BYO agents; restrict with loadBalancerSourceRanges
        {{- end }}
      ports: [{protocol: TCP, port: 4102}]
    - from:
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
      ports: [{protocol: TCP, port: 4103}]
  egress:
    {{- include "aurora.dbEgress" . | nindent 4 }}
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "hookhost") | nindent 8 }}
      ports: [{protocol: TCP, port: 4104}]
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
      ports: [{protocol: TCP, port: 4111}]
    {{- include "aurora.vaultEgress" . | nindent 4 }}
    {{- with (include "aurora.countersEgress" .) }}{{ . | nindent 4 }}{{ end }}
    {{- include "aurora.external" . | nindent 4 }}
    {{- with .Values.networkPolicy.gatewayExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-hookhost, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "hookhost") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
        {{- include "aurora.peer" (dict "root" . "c" "gateway") | nindent 8 }}
      ports: [{protocol: TCP, port: 4104}]
  egress:
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
      ports: [{protocol: TCP, port: 4111}]
    {{- include "aurora.external" . | nindent 4 }}
{{- if .Values.runner.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-runner, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "runner") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $sb }}}}
      ports: [{protocol: TCP, port: 4105}]
    {{- /* (P4-PRV-2/P4-TERM) the stream listener :4108 serves relay leg-1 (previews) and
         api leg-1 (the terminal's own WebSocket proxy, C-617); open while either feature
         is on — the runner opens the port under the same condition. */ -}}
    {{- if or .Values.relay.enabled .Values.terminal.enabled }}
    - from:
        {{- if .Values.relay.enabled }}
        {{- include "aurora.peer" (dict "root" . "c" "relay") | nindent 8 }}
        {{- end }}
        {{- if .Values.terminal.enabled }}
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
        {{- end }}
      ports: [{protocol: TCP, port: 4108}]
    {{- end }}
  egress:
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
      ports: [{protocol: TCP, port: 4101}]
    - to:
        {{- if .Values.networkPolicy.kubeApiCidrs }}
        {{- range .Values.networkPolicy.kubeApiCidrs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
        {{- else }}
        - ipBlock: {cidr: 0.0.0.0/0}
        {{- end }}
      ports:
        {{- range (default (list 443 6443) $np.kubeApiPorts) }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- if $np.cilium.enabled }}
---
# Cilium: the API server is the `kube-apiserver` entity, which no NetworkPolicy ipBlock matches
# (values.yaml networkPolicy.cilium). Allows only runner -> Kubernetes API on kubeApiPorts.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: {{ $full }}-runner-kube-api, namespace: {{ $ns }}}
spec:
  endpointSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "runner") | nindent 6 }}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            {{- range (default (list 443 6443) $np.kubeApiPorts) }}
            - {port: {{ . | quote }}, protocol: TCP}
            {{- end }}
{{- end }}
{{- end }}
{{- if .Values.relay.enabled }}
---
# (P4-PRV-2, docs/15 §Port previews) Relay: previews HTTP/WebSocket on 4112 from the edge,
# registration/resolve/streams/grants to api:4101, leg-1 WebSocket streams to runner:4108,
# DNS (the allow-dns policy) and nothing else. (FIX-069: no `aurora.external` egress — the relay only
# talks to the api and the runners, and it is an edge-exposed pod: no internet path.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-relay, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "relay") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $np.edgeNamespaceSelector | nindent 14 }}
      ports: [{protocol: TCP, port: 4112}]
  egress:
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
      ports: [{protocol: TCP, port: 4101}]
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "runner") | nindent 8 }}
      ports: [{protocol: TCP, port: 4108}]
{{- end }}
{{- range .Values.connectors }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-connector-{{ .id }}, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" $ "component" (printf "connector-%s" .id)) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if and .callbackIngress .callbackIngress.enabled }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $np.edgeNamespaceSelector | nindent 14 }}
      ports: [{protocol: TCP, port: {{ default 4190 .callbackPort }}}]
  {{- end }}
  egress:
    - to:
        {{- include "aurora.peer" (dict "root" $ "c" "api") | nindent 8 }}
      ports: [{protocol: TCP, port: 4101}]
    {{- include "aurora.external" $ | nindent 4 }}
{{- end }}
{{- if .Values.connectorHost.enabled }}
---
# (P4-MCON, docs/15) Connector host: platform callbacks (/connectors/<id>/) on 4110 from the edge,
# registration and the connector contract to the api, DNS (the allow-dns policy), external egress
# (chat platforms) and `networkPolicy.connectorHostExtraEgress` for platforms on private ranges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-connector-host, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "connector-host") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $np.edgeNamespaceSelector | nindent 14 }}
      ports: [{protocol: TCP, port: 4110}]
  egress:
    - to:
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
      ports: [{protocol: TCP, port: 4101}]
    {{- include "aurora.external" . | nindent 4 }}
    {{- with $np.connectorHostExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if and $np.cilium.enabled $np.cilium.edgeEntities }}
{{- $edge := list (dict "c" "api" "port" 4101) (dict "c" "web" "port" 4100) }}
{{- if .Values.devIdp.enabled }}{{- $edge = append $edge (dict "c" "dev-idp" "port" 4107) }}{{- end }}
{{- if .Values.connectorHost.enabled }}{{- $edge = append $edge (dict "c" "connector-host" "port" 4110) }}{{- end }}
{{- if .Values.relay.enabled }}{{- $edge = append $edge (dict "c" "relay" "port" 4112) }}{{- end }}
{{- range .Values.connectors }}
{{- if and .callbackIngress .callbackIngress.enabled }}{{- $edge = append $edge (dict "c" (printf "connector-%s" .id) "port" (default 4190 .callbackPort)) }}{{- end }}
{{- end }}
{{- range $edge }}
---
# Cilium: the Gateway API / Ingress Envoy reaches backends as the `ingress` entity (a host-network
# ingress controller as `host`/`remote-node`), which the edgeNamespaceSelector rule never matches
# (values.yaml networkPolicy.cilium.edgeEntities). Allows only those entities to the edge port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: {{ $full }}-{{ .c }}-edge, namespace: {{ $ns }}}
spec:
  endpointSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" $ "component" .c) | nindent 6 }}
  ingress:
    - fromEntities: {{ toJson $np.cilium.edgeEntities }}
      toPorts:
        - ports:
            - {port: {{ .port | quote }}, protocol: TCP}
{{- end }}
{{- end }}
---
# migrate hook (pre-upgrade runs while the policies above exist): database egress only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-migrate, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "migrate") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "aurora.dbEgress" . | nindent 4 }}
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $full }}-postgres, namespace: {{ $ns }}}
spec:
  podSelector:
    matchLabels: {{- include "aurora.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "aurora.peer" (dict "root" . "c" "api") | nindent 8 }}
        {{- include "aurora.peer" (dict "root" . "c" "gateway") | nindent 8 }}
        {{- include "aurora.peer" (dict "root" . "c" "migrate") | nindent 8 }}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}
---
# ---- sandboxes namespace: default deny (no ingress, no DNS), egress only to gateway:4102 and runner:4105 ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ $sb }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-gateway-runner, namespace: {{ $sb }}}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $ns }}}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/component: gateway}}
      ports: [{protocol: TCP, port: 4102}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $ns }}}}
          podSelector: {matchLabels: {app.kubernetes.io/instance: {{ $inst }}, app.kubernetes.io/component: runner}}
      ports: [{protocol: TCP, port: 4105}]
{{- end }}
