description: secrets target selects by scope and kind; secret id selects one
workspace:
  ordered_rules:
    - {logical_id: 00000000-0000-0000-0000-0000000000a1, name: llm-secrets, action: allow, targets: [{type: secrets, scope: workspace, kind: llm}]}
    - {logical_id: 00000000-0000-0000-0000-0000000000a2, name: one-secret, action: allow, targets: [{type: secret, id: 00000000-0000-0000-0000-000000000053}]}
facts: {host: api.example.com, port: 443, path: /v1/x, method: GET, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
select:
  candidates:
    - {type: secret, id: 00000000-0000-0000-0000-000000000051, kind: llm, scope: workspace}
    - {type: secret, id: 00000000-0000-0000-0000-000000000052, kind: generic, scope: workspace}
    - {type: secret, id: 00000000-0000-0000-0000-000000000053, kind: generic, scope: organization}
    - {type: secret, id: 00000000-0000-0000-0000-000000000054, kind: llm, scope: organization}
  expect: [00000000-0000-0000-0000-000000000051, 00000000-0000-0000-0000-000000000053]
