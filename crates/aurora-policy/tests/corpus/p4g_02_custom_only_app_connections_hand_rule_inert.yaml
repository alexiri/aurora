description: SEC-67 custom_only - a hand-written toolless app_connections allow rule is inert for a custom_only app (the same rule still allows a normal app)
org: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: hand-all-indico, action: allow, targets: [{type: app_connections, app_id: indico, scope: organization}]}], default_action: block}
facts:
  host: indico.example.org
  port: 443
  path: /export/event/1.json
  method: GET
  app_id: indico
  tool_id: export_event
  winning_credential: {type: connection, id: 00000000-0000-0000-0000-0000000000c1, app_id: indico, scope: organization, custom_only: true}
  identity: {agent_id: 00000000-0000-0000-0000-000000000001}
expect: {verdict: block, reason: default_denied}
