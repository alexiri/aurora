- description: 'block rule for another host does not apply'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: blk, action: block, targets: [{type: network, host: other.example.com, path: /x}]}]}
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: allow}
- description: 'block rule with a different port does not apply'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: blk, action: block, targets: [{type: network, host: api.example.com:8443}]}]}
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: allow}
- description: 'org path-scoped block beats a workspace allow'
  org: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: blk, action: block, targets: [{type: network, host: api.example.com, path: /a}]}]}
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a2, name: ok, action: allow, targets: [{type: network, host: api.example.com}]}]}
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: block, reason: rule, org_rule: blk}
- description: 'require_approval rule scoped to a path refuses (needs approval verdict, tunnel is never held)'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: appr, action: allow, targets: [{type: network, host: api.example.com, path: /pay/**}], require_approval: true}]}
