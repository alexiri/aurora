  expect: {verdict: needs_approval, workspace_rule: appr}
- description: 'require_approval with body condition is treated as matched'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: appr, action: allow, targets: [{type: network, host: api.example.com}], require_approval: true, conditions: [{on: body, op: contains, value: x}]}]}
