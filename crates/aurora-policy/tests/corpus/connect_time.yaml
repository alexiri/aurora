- description: 'rate-limited rule scoped to a path counts the tunnel as one request (one hit)'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: rl, action: allow, targets: [{type: network, host: api.example.com, path: /api/**}], rate_limit: {count: 3, per: minute}}]}
  counters: [{rule: 00000000-0000-0000-0000-0000000000a1, agent: 00000000-0000-0000-0000-000000000001, n: 1}]
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: allow, hits: 1}
- description: 'exhausted rate limit refuses the tunnel even when the rule is path-scoped'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: rl, action: allow, targets: [{type: network, host: api.example.com, path: /api/**}], rate_limit: {count: 1, per: minute}}]}
  counters: [{rule: 00000000-0000-0000-0000-0000000000a1, agent: 00000000-0000-0000-0000-000000000001, n: 1}]
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: rate_limited}
- description: 'a blocked tunnel does not consume rate-limit quota'
  org: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: blk, action: block, targets: [{type: network, host: api.example.com, path: /a}]}]}
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a2, name: rl, action: allow, targets: [{type: network, host: api.example.com}], rate_limit: {count: 3, per: minute}}]}
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: block, reason: rule, hits: 0}
- description: 'restrictive rule for a different agent does not apply'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: blk, action: block, identities: [{kind: agent, id: 00000000-0000-0000-0000-0000000000ff}], targets: [{type: network, host: api.example.com}]}]}
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
