# Open-lane (CONNECT-time) cases: docs/07 §CONNECT-time evaluation (RFE-003).
- description: 'block rule scoped to a path refuses the tunnel (unknowable path counts as matched)'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: blk, action: block, targets: [{type: network, host: api.example.com, path: /admin/**}]}]}
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: block, reason: rule, workspace_rule: blk}
- description: 'block rule scoped to methods refuses the tunnel'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: blk, action: block, targets: [{type: network, host: api.example.com, methods: [DELETE]}]}]}
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: block, reason: rule, workspace_rule: blk}
- description: 'block rule with a body condition refuses the tunnel'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: blk, action: block, targets: [{type: network, host: api.example.com}], conditions: [{on: body, op: contains, value: DROP}]}]}
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: block, reason: rule, workspace_rule: blk}
- description: 'block rule scoped to path, methods and body at once refuses the tunnel'
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: blk, action: block, targets: [{type: network, host: api.example.com, path: /x, methods: [POST]}], conditions: [{on: body, op: equals, value: x}]}]}
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: block, reason: rule, workspace_rule: blk}
- description: 'host-only block refuses the tunnel'
