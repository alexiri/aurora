- description: 'an allow rule cannot loosen an org-level uncredentialed block (org scope default is egress)'
  org: {uncredentialed_default: block}
  workspace: {ordered_rules: [{logical_id: 00000000-0000-0000-0000-0000000000a1, name: ok, action: allow, targets: [{type: network, host: api.example.com}]}]}
  facts: {host: api.example.com, port: 443, path: /, method: CONNECT, connect_time: true, identity: {agent_id: 00000000-0000-0000-0000-000000000001}}
  expect: {verdict: block, reason: egress_denied}
