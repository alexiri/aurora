description: SEC-67 custom_only - a hand-written allow rule with a toolless `app` target ordered above the grant's rules never allows an unlisted tool when the winning connection is custom_only
workspace:
  ordered_rules:
    - {logical_id: 00000000-0000-0000-0000-0000000000b1, name: allow-app, action: allow, targets: [{type: app, app_id: indico}]}
    - {logical_id: 00000000-0000-0000-0000-0000000000a1, name: grant-allow, action: allow, targets: [{type: connection, id: 00000000-0000-0000-0000-0000000000c1, tools: [export_event]}]}
    - {logical_id: 00000000-0000-0000-0000-0000000000a3, name: grant-block, action: block, targets: [{type: connection, id: 00000000-0000-0000-0000-0000000000c1}]}
  default_action: block
facts:
  host: indico.example.org
  port: 443
  path: /export/event/1.json
  method: GET
  app_id: indico
  tool_id: book_room
  winning_credential: {type: connection, id: 00000000-0000-0000-0000-0000000000c1, app_id: indico, scope: workspace, custom_only: true}
  identity: {agent_id: 00000000-0000-0000-0000-000000000001}
expect: {verdict: block, workspace_rule: grant-block}
