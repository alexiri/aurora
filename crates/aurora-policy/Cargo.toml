[package]
name = "aurora-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
graphql-parser = { workspace = true }
thiserror = { workspace = true }
percent-encoding = { workspace = true }
# park fingerprint (C-821): SHA-256, the OS CSPRNG for the salt, constant-time compare
sha2 = { workspace = true }
aws-lc-rs = { workspace = true }

[dev-dependencies]
# The gateway is built with `raw_value` (through sqlx and axum), which changes how `Value`
# parses one private member name: the tests here must parse the way the gateway does.
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = { workspace = true }
proptest = { workspace = true }
