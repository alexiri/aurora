[package]
name = "aurora-counters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The optional Redis backend (D-119, `15 §Shared rate-limit counters`).
redis = ["dep:redis", "dep:rustls", "dep:rustls-native-certs"]

[dependencies]
async-trait.workspace = true
metrics.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
redis = { version = "1.5", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls", "script"], optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The conformance suite runs every backend: turn the Redis one on for this crate's own tests.
aurora-counters = { path = ".", features = ["redis"] }
aurora-db.workspace = true
# (FIX-101) the skip policy of the env-gated Redis tests (`require_or_skip`: CI=true fails instead of skipping).
aurora-testkit.workspace = true
sqlx.workspace = true
futures.workspace = true
redis = { version = "1.5", default-features = false, features = ["tokio-comp", "script"] }
